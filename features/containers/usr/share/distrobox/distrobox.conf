# The dev box (M7.17): what `distrobox create` makes when it is given no
# image or name. Ubuntu's LTS toolbox image (the "Decisions taken by
# default" row): vendors build their .deb for Ubuntu first, and the image
# carries everything distrobox needs, so the box starts without fetching
# packages. A person's own ~/.config/distrobox/distrobox.conf wins.
container_manager="podman"
container_image_default="quay.io/toolbx/ubuntu-toolbox:26.04"
container_name_default="dev"
