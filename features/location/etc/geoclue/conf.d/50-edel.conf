# Edel OS (roadmap M6.14c): the place comes only from /etc/geolocation,
# which `edel settings apply` writes from location.place, so nothing leaves
# the machine. location.online adds 60-edel-online.conf, which turns the
# Wi-Fi lookup through BeaconDB on. The location portal is the one client
# let in; it asks each app's choice and the person's Location switch.
[ip]
enable=false

[wifi]
enable=false
submit-data=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

[network-nmea]
enable=false

[compass]
enable=false

[static-source]
enable=true

[xdg-desktop-portal]
allowed=true
system=true
users=
