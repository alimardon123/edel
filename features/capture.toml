# Screenshots and screen sharing (roadmap M6.3): xdg-desktop-portal-wlr,
# the portals' backend for wlroots-style compositors, which takes the
# picture through wlr-screencopy (our compositor's protocol) and streams
# the screen to PipeWire. Its config (features/capture/) shares the first
# screen without a chooser until Edel's own chooser comes later.
format = 1
summary = "Screenshots and screen sharing: the portals' wlr backend, which copies the screen with wlr-screencopy and streams it over PipeWire"
why = "Apps ask xdg-desktop-portal for a screenshot or to share the screen, and the portal hands the request to its backend, xdg-desktop-portal-wlr, which the compositor's wlr-screencopy serves (M6.3). D-Bus starts the backend only when an app first asks, so a desktop nobody shares spends nothing on it; screen sharing streams over PipeWire, which the session already starts, and a sandboxed app (Flatpak) can only capture through this portal, since the compositor hides screencopy from it. grim and slurp are not packaged: the backend takes non-interactive screenshots itself, and its interactive region picker is a later step's choice."
packages = ["xdg-desktop-portal-wlr"]
