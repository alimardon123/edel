# Screen sharing (roadmap M6.3): xdg-desktop-portal-wlr, the portals'
# backend for wlroots-style compositors, which streams the screen to
# PipeWire through wlr-screencopy (our compositor's protocol). Screenshots
# are shell-ui's own (M8.21 part 21f, the shell feature). Its config (features/capture/) shares the first
# screen without a chooser until Edel's own chooser comes later.
format = 1
summary = "Screen sharing: the portals' wlr backend, which copies the screen with wlr-screencopy and streams it over PipeWire"
why = "Apps ask xdg-desktop-portal to share the screen, and the portal hands the request to its backend, xdg-desktop-portal-wlr, which the compositor's wlr-screencopy serves (M6.3). D-Bus starts the backend only when an app first asks, so a desktop nobody shares spends nothing on it; screen sharing streams over PipeWire, which the session already starts, and a sandboxed app (Flatpak) can only capture through this portal, since the compositor hides screencopy from it. Screenshots no longer come from here: the wlr backend ran grim, which wrote each one to /tmp/out.png where another person could read it, so shell-ui answers the screenshot portal itself and keeps the picture in the person's own runtime folder (M8.21 part 21f), and grim is gone from the image."
packages = ["xdg-desktop-portal-wlr"]

# The basics checklist (M6.7): each row is proved by its desktop-test case or marked.

[[basics]]
name = "Screenshots and screen sharing"
test = "capture"

[[basics]]
name = "Camera"
needs = "hardware"
