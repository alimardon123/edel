# The default apps (roadmap M6.2): Flatpak apps installed once into the
# data partition's installation, never into a slot, by edel image build,
# and kept up to date by edel update. An id taken out of `flatpak` moves
# to `flatpak_dropped`, so each person who used it keeps it.
format = 1
summary = "The default apps: a web browser, the app store, a text editor and a files app, installed once on the data partition"
why = "People expect a browser on a new computer, working offline on the stick and right after an install. Firefox (Alimardon's choice, 2026-10-12) for its site compatibility and privacy, from Flathub, about 130 MB to download and 340 MB installed with its runtime shared by later apps; on the data partition it is paid for once, not in both slots, and edel update keeps it current. Bazaar is the store (M6.4, Alimardon's choice of 2026-10-12): small and quick, made for Flathub, about 12 MB to download on the GNOME runtime, which the text editor will share. GNOME Text Editor and Portfolio, the files app (Alimardon's choices of 2026-10-13, for now: the set is looked at again before the first public release; Nautilus is not on Flathub), are 1.2 MB and 0.2 MB to download: the editor shares Bazaar's GNOME runtime, and Portfolio, made for touch and phones as well as laptops, runs on the GNOME runtime before it until it moves on; their categories make them the default editor and files app (Super+E)."
flatpak = ["org.mozilla.firefox", "io.github.kolunmi.Bazaar", "org.gnome.TextEditor", "dev.tchx84.Portfolio"]
