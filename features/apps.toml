# The default apps (roadmap M6.2): Flatpak apps installed once into the
# data partition's installation, never into a slot, by edel image build,
# and kept up to date by edel update. An id taken out of `flatpak` moves
# to `flatpak_dropped`, so each person who used it keeps it.
format = 1
summary = "The default apps: a web browser, the app store, a text editor and a files app, installed once on the data partition"
why = "People expect a browser on a new computer, working offline on the stick and right after an install. Firefox (Alimardon's choice, 2026-10-12) for its site compatibility and privacy, from Flathub, about 130 MB to download and 340 MB installed with its runtime shared by later apps; on the data partition it is paid for once, not in both slots, and edel update keeps it current. Bazaar is the store (M6.4, Alimardon's choice of 2026-10-12): small and quick, made for Flathub, about 12 MB to download on the GNOME runtime, which the text editor will share. GNOME Text Editor (Alimardon's choice of 2026-10-13) is 1.2 MB to download and shares Bazaar's GNOME runtime. Dolphin is the files app (2026-10-26, replacing Portfolio, whose older GNOME runtime cost 467 MiB for one small app): no GTK files app on Flathub runs on the newer GNOME runtime (Nautilus is not there), and measured beside Portfolio it opens a folder in about 360 ms rather than 620, takes about 110 to 130 MiB rather than 240, and has tabs, a split view, thumbnails, search and network shares, for about 310 MiB more on disk with the KDE runtime. Their categories make them the default editor and files app (Super+E)."
flatpak = ["org.mozilla.firefox", "io.github.kolunmi.Bazaar", "org.gnome.TextEditor", "org.kde.dolphin"]
flatpak_dropped = ["dev.tchx84.Portfolio"]
