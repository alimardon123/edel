# Steam Input makes the pad games see on /dev/uinput (roadmap M7.6b), and
# nothing else loads the module; OpenRC's modules service reads this at boot.
uinput
# Proton's fast sync (M8.33): /dev/ntsync, the kernel's Windows-style
# waiting, which newer Wine and Proton use on their own when it is there.
ntsync
