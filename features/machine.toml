# What any booted machine runs. features/machine/ holds the console and
# serial logins (inittab, each through usr/libexec/edel-console, which asks
# for the first person when nobody can log in, M6.6b) and edel-clock, which
# sets the clock from the network once at each start (init.d/edel-clock, usr/libexec/edel-clock,
# M1.13), and edel-install, a stick that installs itself when its settings
# file holds an [install] table (M7.3, docs/FLEET.md), and edel-zram, compressed
# memory of half the RAM made at each start (M7.15), and edel-leave,
# which at shutdown ends what people's sessions left running (`edel boot
# leave`), so killprocs never waits on them, and usr/lib/sysctl.d/edel.conf,
# room for the memory maps some games and servers need (M8.33). The network itself is another feature's: `vm` brings busybox's
# DHCP on eth0, `network` brings NetworkManager (M5.8a).
format = 1
summary = "A booted machine: init, logs, a console login and the right time"
why = "alpine-base is OpenRC with busybox's tools; its services mount /dev, keep the kernel log, set the hostname, log, and stop the machine cleanly. edel-clock sets the clock once from the network with busybox ntpd (no new package), because a machine whose clock battery died starts in the past and then fails every certificate check, `edel update` over https:// included; it runs in the background and exits, so nothing stays running and nothing waits for it. Device events come from mdev or udev, a feature each. doas (M6.5) runs edel as root for the admin group with one rule file, features/machine/etc/doas.d/edel.conf, which asks no doas password because edel asks the administrator's own password for what can break the machine; doas-sudo-shim (a 4 KiB script, Alpine's main) answers to `sudo` with the same rules, so people from other systems type what they know, with no second program running as root; linux-pam brings unix_chkpwd, the helper that checks that password, as the lock screen's check does (no polkit). edel-install (M7.3) runs `edel install --unattended`, which returns at once on any machine whose settings file has no [install] table, so a fleet stick installs itself with no other image or seed volume needed. edel-zram (M7.15) makes a zram swap device of half the memory, zstd where the kernel offers it, with busybox's mkswap and swapon and no package or daemon, so a machine keeps a game, a browser and a build open without stalling. edel-leave runs only at shutdown, after the login screen and ssh have stopped and before the data partition is unmounted: a person's portals, Flatpak sandboxes and rootless containers outlive greetd and sshd in mount namespaces fuser cannot see, and OpenRC's killprocs, which stops every process before signalling them, hung on a process waiting for the stopped document portal's FUSE file system; `edel boot leave` ends people's processes with 3 s to finish, then unmounts FUSE lazily, and starting it does nothing. usr/lib/sysctl.d/edel.conf (M8.33) raises vm.max_map_count to 1048576, as SteamOS, Fedora and Arch do, since some games under Proton, their anti-cheat and some servers stop when the kernel's 65530 runs out; it is a limit, so it costs nothing until a program uses it, and it is in the base rather than the gaming add-on because servers need it too."
packages = ["alpine-base", "doas", "doas-sudo-shim", "linux-pam"]

[services]
sysinit = ["devfs", "dmesg"]
boot = ["modules", "sysctl", "hostname", "bootmisc", "syslog", "edel-zram", "edel-leave"]
shutdown = ["mount-ro", "killprocs", "savecache"]
default = ["edel-clock", "edel-install"]
