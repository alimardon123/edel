# What any booted machine runs. features/machine/ holds the console and
# serial logins (inittab) and edel-clock, which sets the clock from the
# network once at each start (init.d/edel-clock, usr/libexec/edel-clock,
# M1.13). The network itself is another feature's: `vm` brings busybox's
# DHCP on eth0, `network` brings NetworkManager (M5.8a).
format = 1
summary = "A booted machine: init, logs, a console login and the right time"
why = "alpine-base is OpenRC with busybox's tools; its services mount /dev, keep the kernel log, set the hostname, log, and stop the machine cleanly. edel-clock sets the clock once from the network with busybox ntpd (no new package), because a machine whose clock battery died starts in the past and then fails every certificate check, `edel update` over https:// included; it runs in the background and exits, so nothing stays running and nothing waits for it. Device events come from mdev or udev, a feature each."
packages = ["alpine-base"]

[services]
sysinit = ["devfs", "dmesg"]
boot = ["modules", "sysctl", "hostname", "bootmisc", "syslog"]
shutdown = ["mount-ro", "killprocs", "savecache"]
default = ["edel-clock"]
