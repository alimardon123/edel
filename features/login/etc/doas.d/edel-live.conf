# The stick's own account (M6.6a): Settings' installer page runs
# `doas edel install --list`, `--plan` and the install itself as live, which
# has no password and is in no group. edel lets live install only while the
# system runs from a stick (privilege.rs, live_may_install) and lets it
# read, never change, anything else; an installed machine has no live.
# The Welcome (M6.12) also runs `edel settings first-boot --user` as live, to
# make the computer's first person; edel allows that only while nobody has an
# account (privilege.rs, live_may_set_up), and refuses it once anyone has one.
permit nopass live as root cmd edel
permit nopass live as root cmd /usr/bin/edel
