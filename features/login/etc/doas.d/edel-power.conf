# Power for the people at the machine (M5.10c): the lock and login
# screens' power menu runs these as root with no password, for whoever is
# in group seat (the people the settings file names, and greetd's own
# account for the login screen). Each of these takes no arguments; the
# profile rules below name the one argument they allow.
permit nopass :seat as root cmd /sbin/poweroff args
permit nopass :seat as root cmd /sbin/reboot args
permit nopass :seat as root cmd /usr/sbin/zzz args
# M7.8: shell-ui sets the power profile on battery and on the charger, as
# edel power profile NAME, for the people at the machine (group seat).
permit nopass :seat as root cmd /usr/bin/edel args power profile power-saver
permit nopass :seat as root cmd /usr/bin/edel args power profile balanced
permit nopass :seat as root cmd /usr/bin/edel args power profile performance
# M7.16e: Settings' Charge fully once button.
permit nopass :seat as root cmd /usr/bin/edel args power charge-full
