# The A/B disk (ADR-006). features/ab-boot/ holds the read-only root's
# fstab and the services: edel-data (mount /data, grow it on first boot),
# edel-guard (the watchdog until the slot is healthy), edel-settings (apply
# the settings) and edel-boot-ok (confirm the slot).
format = 1
summary = "Updates that roll back: two root slots, the data partition and the settings file"
why = "The A/B disk needs vfat and ext4 tools for the EFI system partition, the slots and /data (e2fsprogs-extra gives edel update its tune2fs and the installer its resize2fs), partx and sfdisk to grow /data and to install, cryptsetup and the console keyboard maps to encrypt /data and unlock it at the start (M8.2), and libgcc, which the edel binary links; its services mount /data, guard the boot, apply the settings file and confirm the slot."
packages = ["cryptsetup", "dosfstools", "e2fsprogs", "e2fsprogs-extra", "kbd-bkeymaps", "libgcc", "partx", "sfdisk"]
# softdog, which the guard pets (linux-lts has it; a kernel without it
# skips it) until a hardware watchdog loads by its hardware ID (QEMU's
# i6300esb, a laptop's iTCO_wdt or sp5100_tco), and the disks a slot can
# live on, loaded before the root is looked for. Everything else loads by
# hardware ID; a module a kernel lacks is skipped (M3.3a). i6300esb is left
# to hwdrivers like a laptop's watchdog, so CI proves the guard takes it.
modules = ["softdog", "virtio_pci", "virtio_blk", "nvme", "ahci", "sd_mod", "usb-storage", "uas", "xhci_pci"]
# The initramfs finds disks on SATA, NVMe, SCSI, USB and virtio with ext4,
# and nothing more (M8.17e): the screen shows the firmware's picture
# (simpledrm, built into the kernel) until the graphics driver loads in the
# root at the start, before a password is asked or the login screen comes.
# mkinitfs's kms took every graphics driver and its firmware along, 44 of
# its 63 MiB, on servers too.
initramfs = ["ata", "base", "ext4", "nvme", "scsi", "usb", "virtio"]
# The boot guard confirms the slot once the default runlevel is reached.
health = ["default-runlevel"]

[services]
sysinit = ["edel-guard", "edel-data"]
boot = ["edel-settings"]
default = ["edel-boot-ok"]
