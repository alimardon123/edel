# The Edel shell's panels and menus (ADR-002, M5.1b): edel-shell-ui, built
# from this repository's workspace and copied in by edel image build. It
# draws its own surfaces (ADR-002's shell-ui toolkit decision), so it links
# no library apk would need to see; the compositor starts it in every
# session but the greeter's and starts it again if it ends. Screen readers
# read it through AT-SPI (M5.1d), whose bus at-spi2-core starts on the
# session's D-Bus when asked. Apps ask xdg-desktop-portal, which D-Bus
# starts when an app first asks, for the colour scheme and the accent,
# and shell-ui answers it (M5.5a; usr/share/xdg-desktop-portal/).
format = 1
summary = "shell-ui: the panel, and later the launcher and quick settings"
why = "edel-shell-ui draws the panel along the screen's edge, the second of the shell's two long-running processes (ADR-002); its text needs the fonts feature's Inter. at-spi2-core is the accessibility bus screen readers find every app's tree on, started by D-Bus when asked (M5.1d); its launcher aborts without the GSettings schemas of gsettings-desktop-schemas. xdg-desktop-portal is how apps, Flatpak ones above all, learn the desktop's colour scheme and accent (M5.5a), with shell-ui as its Settings backend, so no portal backend process of our own runs; D-Bus starts it when an app asks."
programs = ["edel-shell-ui"]
packages = ["at-spi2-core", "gsettings-desktop-schemas", "xdg-desktop-portal"]
