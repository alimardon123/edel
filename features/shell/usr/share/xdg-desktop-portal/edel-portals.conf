# The portals' backends in an Edel session (XDG_CURRENT_DESKTOP=Edel,
# M5.5a): shell-ui answers the Settings portal, the colour scheme and the
# accent from the design tokens. Screenshots are shell-ui's too (M8.21
# part 21f): it copies the screens itself into the person's runtime
# folder, so nobody else can read the picture, after the portal has asked
# through the Access dialog shell-ui draws. Screen sharing comes from
# xdg-desktop-portal-wlr, which the capture feature ships (M6.3). Other
# portals join as their backends do. The Lockdown switches
# (M6.14c) are shell-ui's too: its Location switch refuses the location
# portal's requests while the person's location.enabled is off. The
# keyring feature's oo7 keeps Flatpak apps' secrets (M7.18).
[preferred]
org.freedesktop.impl.portal.Settings=edel
org.freedesktop.impl.portal.Access=edel
org.freedesktop.impl.portal.Lockdown=edel
org.freedesktop.impl.portal.Screenshot=edel
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Secret=oo7-portal
