# The portals' backends in an Edel session (XDG_CURRENT_DESKTOP=Edel,
# M5.5a): shell-ui answers the Settings portal, the colour scheme and the
# accent from the design tokens. The screenshot and the screen sharing
# come from xdg-desktop-portal-wlr, which the capture feature ships
# (M6.3). Other portals join as their backends do. The screenshot portal
# asks through the Access dialog shell-ui draws: xdg-desktop-portal offers
# no screenshot until some backend answers Access.
[preferred]
org.freedesktop.impl.portal.Settings=edel
org.freedesktop.impl.portal.Access=edel
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
