why = "foot is a small, fast Wayland terminal; developer mode and people who want a shell need one, and CI uses it as a window that asks for server-side title bars (M4.4). Its look is the desktop's (M6.13): its colours and font come from the design tokens, and it starts in the scheme the desktop is in, light or dark."
