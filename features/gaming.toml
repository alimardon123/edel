# Game controllers (M7.6b): Steam's device rules and the uinput module, as
# an add-on the gaming profile names, since controllers are a basic for
# people who play. features/gaming/ holds the rule that gives the person at
# the screen what steam-devices marks for uaccess (M8.37) and group seat
# /dev/ntsync, the file that loads
# uinput and ntsync (M8.33) and the
# game session the login screen offers (M8.26).
format = 1
summary = "Game controllers: Steam's device rules, for the people at the machine"
why = "Controllers are a basic for people who play (M7.6b). steam-devices is Valve's list of the controllers and VR headsets Steam Input talks to directly, through their hidraw and USB devices, and of /dev/uinput, where Steam Input makes the pad games see. Its rules mark them for uaccess, which only logind acts on, and Edel OS has no logind, so 90-edel-gaming makes them root's alone and tags them for edel-seat (the seat feature), which gives them to the person whose session is at the screen and takes them back when it ends (M8.37), with a controller's own joystick device too, never a keyboard's. Group seat, which sound and scanners still use, would let a program one person left running type into another's session through /dev/uinput (the review of 2026-10-25). modules-load.d/edel-gaming.conf loads uinput at boot, as nothing else asks for it, and ntsync (M8.33), the kernel's Windows-style waiting that newer Wine and Proton use on their own for smoother frame times, which 90-edel-gaming gives to group seat, as systemd's default rules give it to everyone elsewhere. No service: nothing runs until a game opens a controller. wayland-sessions/edel-game.desktop is the game session (M8.26), Edel OS Game on the login screen: Steam's Big Picture alone in our compositor, fullscreen and in game mode, with no panels or dock and no second compositor inside ours, yet locked and asleep when left as the desktop is, for people who start the machine to play; it comes and goes with the add-on."
packages = ["steam-devices"]
addon = true
