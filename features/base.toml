# Every image starts here. features/base/ holds the identity: os-release
# (the build adds the version and image facts), issue and motd. [alpine]
# owns the Alpine branch every image is built from, and CI's build
# container takes its version from it too: write it nowhere else (M5.27).
format = 1
summary = "The Edel OS base every image starts from"
why = "Every image needs Alpine's signing keys so apk trusts its packages, /bin/sh, and the certificates every https download is checked against."
packages = ["alpine-keys", "busybox-binsh", "ca-certificates-bundle"]
# The root's file system and the overlay /etc sits on (M1.4), loaded
# before the root is looked for. An image without a kernel ignores them.
modules = ["ext4", "overlay"]

[alpine]
branch = "v3.24"
mirror = "https://dl-cdn.alpinelinux.org/alpine"
repositories = ["main", "community"]
# The last day Alpine fixes each repository of the branch (M8.44): main's
# is the branch's eol_date and community's its repository's, both from
# https://alpinelinux.org/releases.json, read 2026-11-03. An image's
# os-release SUPPORT_END and each release.toml's fixes_until are main's;
# community is fixed until the next branch is out, which the newest
# channel moves to. Copy both again at the next branch bump (M8.4).
fixes_until = { main = "2028-06-01", community = "2026-11-01" }
# Alpine edge's community, tagged @edge, for one package taken from edge
# while the branch lacks its fix: oo7-portal (the keyring feature), which
# in v3.24 cannot answer an app that hands it a pipe, as libsecret does
# (upstream's fix of 2026-06-26, edge's 0.6.0_git20260709, same musl).
# Empty it at the next branch bump (M8.4), which carries the fix.
edge = ["community"]
# The digest of CI's build container, `alpine:` plus the branch above
# (ci.yml reads both from here), so a build runs in an image someone looked
# at. The registry moves the tag at every Alpine point release; refresh with
# `docker buildx imagetools inspect alpine:3.24` (the multi-architecture
# index's Digest, branch as above) and say so in the PR. Last read 2026-10-07.
image_digest = "sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"

# The id of every system account (an id from 100 to 999) the images' and
# the add-ons' packages add or Alpine's base layout ships. busybox hands
# such ids out in the order apk installs the packages, so one package more
# would move the others, and a newer slot's new account could take an id
# a machine already gave someone else, which data.rs's merge then has to
# leave out. The build moves each to the id here and fails on one that
# is not listed: give a new account the lowest id from 900 up that its
# table below does not use yet, never one an account had before, and give
# a user the id of its own group where that is free. Edel OS's own system
# accounts (the live person, the admin group) have theirs in the code, at
# 990. An id once listed stays with its name, even after its package goes.
[alpine.users]
klogd = 100
messagebus = 101
flatpak = 102
geoclue = 103
greetd = 104
ntp = 123
guest = 405

[alpine.groups]
users = 100
klogd = 101
messagebus = 102
plugdev = 103
pipewire = 104
flatpak = 105
geoclue = 106
greetd = 107
seat = 108
lpadmin = 109
scanner = 110
ntp = 123
abuild = 300
utmp = 406
ping = 999
