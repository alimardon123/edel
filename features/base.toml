# Every image starts here. features/base/ holds the identity: os-release
# (the build adds the version and image facts), issue and motd. [alpine]
# owns the Alpine branch every image is built from, and CI's build
# container takes its version from it too: write it nowhere else (M5.27).
format = 1
summary = "The Edel OS base every image starts from"
why = "Every image needs Alpine's signing keys so apk trusts its packages, /bin/sh, and the certificates every https download is checked against."
packages = ["alpine-keys", "busybox-binsh", "ca-certificates-bundle"]
# The root's file system and the overlay /etc sits on (M1.4), loaded
# before the root is looked for. An image without a kernel ignores them.
modules = ["ext4", "overlay"]

[alpine]
branch = "v3.24"
mirror = "https://dl-cdn.alpinelinux.org/alpine"
repositories = ["main", "community"]
