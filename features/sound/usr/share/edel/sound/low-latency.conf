# Low latency (Edel OS, sound.low_latency, roadmap M7.6b): every app's
# sound reaches the device in at most this many samples, about 5 ms at
# 48 kHz, for music and recording. The compositor links this file into
# the person's own PipeWire drop-in folder while the key is on, before it
# starts PipeWire, so it applies from the next login. A shorter wait wakes
# the processor more often while sound plays, never while it is quiet.
context.properties = {
  default.clock.quantum = 256
  default.clock.max-quantum = 256
}
