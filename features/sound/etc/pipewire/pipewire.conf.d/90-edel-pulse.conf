# The PulseAudio server apps speak to (Edel OS, the sound feature): loaded
# inside PipeWire itself rather than run as a second process,
# pipewire-pulse, which would hold its own copy of the same modules. The
# pipewire-pulse package still brings the module. These are the lines of
# its pipewire-pulse.conf that the main PipeWire does not load already.
context.modules = [
  { name = libpipewire-module-protocol-pulse
    args = { }
  }
]

pulse.properties = {
  server.address = [ "unix:native" ]
}

pulse.cmd = [
  { cmd = "load-module" args = "module-always-sink" flags = [ ] }
  { cmd = "load-module" args = "module-device-manager" flags = [ ] }
  { cmd = "load-module" args = "module-device-restore" flags = [ ] }
  { cmd = "load-module" args = "module-stream-restore" flags = [ ] }
]
