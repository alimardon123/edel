# Quality and low delay (Edel OS, roadmap M6.15): PipeWire may run the
# device at the rate the music or the call has, among these, so a 44.1 kHz
# song plays at 44.1 kHz with no resampling, as long as the device takes
# that rate; the default 48 kHz stays the first choice.
context.properties = {
  default.clock.allowed-rates = [ 48000 44100 96000 88200 ]
}
