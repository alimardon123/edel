# Edel OS (M5.7b, M6.14b): WirePlumber starts only what the image uses.
# Cameras come through V4L2's monitor (M6.14b), so the camera portal and the
# panel's in-use sign see them; libcamera's monitor stays off, as it loads a
# camera stack for every kind of sensor, which cost the desktop more memory
# than its budget allows (desktop_held_mib in ci/budgets.toml) when both
# were on. Bluetooth audio is off here for images without Bluetooth (the
# stock profile makes it required, which fails when the plugin is missing);
# the bluetooth feature (M5.8a) turns it on again in
# 91-edel-bluetooth.conf, which loads after this file. The microphone rule
# (M6.14b, apps.microphone) is ours: scripts/edel/microphone-access.lua.
wireplumber.profiles = {
  main = {
    hardware.bluetooth = disabled
    monitor.libcamera = disabled
    script.edel.microphone-access = required
  }
}

wireplumber.components = [
  {
    name = edel/microphone-access.lua, type = script/lua
    provides = script.edel.microphone-access
    requires = [ support.portal-permissionstore ]
  }
]
