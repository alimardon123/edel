# Edel OS (M5.7b): WirePlumber starts only what the image uses. Bluetooth
# audio and cameras are off until the images carry Bluetooth (M5.8, which
# turns hardware.bluetooth back on) and camera support (M6); loading them
# for nothing cost the desktop more memory than its budget allows
# (desktop_memory_mib in ci/budgets.toml).
wireplumber.profiles = {
  main = {
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
  }
}
