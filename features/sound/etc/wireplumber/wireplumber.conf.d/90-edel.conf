# Edel OS (M5.7b): WirePlumber starts only what the image uses. Cameras are
# off until the images carry camera support (M6); loading them for nothing
# cost the desktop more memory than its budget allows (desktop_held_mib in
# ci/budgets.toml). Bluetooth audio is off here for images without Bluetooth
# (the stock profile makes it required, which fails when the plugin is
# missing); the bluetooth feature (M5.8a) turns it on again in
# 91-edel-bluetooth.conf, which loads after this file.
wireplumber.profiles = {
  main = {
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
  }
}
