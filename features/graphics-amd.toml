# AMD graphics (M8.17d, ADR-012): a hardware pack.
format = 1
summary = "AMD graphics: the firmware of AMD's and older Radeon cards"
why = "amdgpu and radeon cannot start a card without its firmware (about 28 MiB), and a server, a VM or an Intel laptop has no AMD card, so it is a pack the stick carries and a machine with an AMD card gets, not part of every system. The driver asks for the firmware before the data partition's packs are mounted, finds none and leaves the card without a driver, and edel-data starts it again once the pack is there (M7.11), so the screen moves from the firmware's picture to amdgpu as it does at every start."
packages = ["linux-firmware-amdgpu", "linux-firmware-radeon"]
addon = true
# AMD's display controllers.
hardware = ["pci:v00001002d*bc03*"]

# GCN and newer (amdgpu) and the older Radeons (radeon).
[[keep]]
under = "lib/firmware"
files = ["amdgpu/*", "radeon/*"]
