# Who may use the screen and input. features/seat/ holds edel-rundir,
# which makes /run/edel/session at boot for the files the session leaves
# for root (the compositor's health file, M4.8), and runs seatd under
# supervise-daemon, which starts it again if it dies.
format = 1
summary = "Seats: the screen and input for the person at the machine"
why = "seatd hands the display and input devices to the compositor without logind; edel-rundir makes the session's directory for root, where the compositor, running as the person, leaves its health file for the boot guard."
packages = ["seatd", "seatd-openrc"]

# The desktop's (M8.17): without a graphics card, seatd stays off.
screen = true

[services]
boot = ["edel-rundir"]
default = ["seatd"]

# The basics checklist (M6.7): each row is proved by its desktop-test case or marked.

[[basics]]
name = "Keyboard layouts"
test = "keyboard"

[[basics]]
name = "Game controller"
needs = "hardware"

[[basics]]
name = "Pen pressure"
needs = "hardware"
