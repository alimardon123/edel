# Only the VM image needs this (a feature named after its image).
format = 1
summary = "The small kernel for virtual machines"
why = "linux-virt, not linux-lts as on the laptop: lts installs 152 MiB against virt's 49 (Alpine's package index, 2026-10-02), more than the whole 91 MiB root, and a VM needs none of its hardware drivers. One kernel would be simpler; a VM image that doubles in size for drivers it never loads is waste people see in every download and update (M3.3a)."
packages = ["linux-virt"]
