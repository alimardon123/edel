# Containers (M7.2a, M7.6): Podman, as an add-on for the people and
# machines that run OCI containers, and distrobox's dev box (M7.17).
format = 1
summary = "Containers: Podman, rootless and without a daemon, and a dev box for software not on Flathub"
why = "Servers run their apps as OCI containers and developers work in them (ADR-003, ADR-005). Podman runs a container as the person who starts it, with no daemon running between containers, so nothing runs in the background while no container does; crun is its small runtime and fuse-overlayfs gives rootless containers their layers. The rest comes with Podman's own dependencies, which bring pasta for the network and newuidmap for subordinate ids (M7.6b). distrobox, a shell script on podman, makes the dev box (M7.17): a glibc container in the person's home on /data where a vendor's .deb, an AppImage or a language's tools install, never touching the base, and distrobox-export puts what it installs in the launcher and on the person's PATH; nothing of it runs until the person opens it."
packages = ["podman", "crun", "fuse-overlayfs", "distrobox"]
addon = true

# OpenRC's cgroups service mounts the cgroup2 file system that podman keeps
# its containers' cgroups in (M7.6b).
[services]
boot = ["cgroups"]
