# The login screen. features/login/ holds greetd's config (our compositor
# running shell-ui's greeter, M5.10b), the person's session (edel-session), its
# PAM file with pam_rundir, its conf.d, which runs greetd under
# supervise-daemon, and edel-live, which logs the person called live in on
# a USB stick (M3.6); greetd, not a supervisor, starts the compositor
# again when a session ends. doas.d/edel-power.conf gives the lock and
# login screens' power menu its three commands (M5.10c). usr/share/wayland-sessions
# holds our session's desktop file, which the login screen's session chip
# lists beside any other installed session (M5.10c3b); edel-live makes the
# login screen's directory for each person's choice.
format = 1
summary = "Login: greetd and its greeter, with a private runtime directory per session"
why = "greetd starts the session after login and the greeter again when it ends, a crash included; its greeter is edel-shell-ui --greeter (feature shell) on edel-compositor (feature compositor), which logs in through greetd's own socket; pam_rundir gives every session, the greeter's too, /run/user/UID (mode 0700) without logind, which Wayland needs for its socket. edel-live runs edel boot live at boot, so a USB stick, or a virtual machine nobody has set up yet, logs a person in by itself. doas, which the machine feature brings, with one rule file here, lets the people at the machine (group seat) run exactly poweroff, reboot and zzz (Alpine's suspend to memory, a 7 KB program) from the lock and login screens' power menu, with no logind, polkit or service of ours (M5.10c). The admin rule of M6.5 is the machine feature's. doas.d/edel-live.conf lets the stick's own account, live, run edel, which installs for it only on a stick (M6.6a), so Settings' installer page needs no password nobody has. On a computer nobody has an account on, the same rule lets the Welcome make the first person (M6.12), which edel refuses once anyone has one. The login screen's session chip (M5.10c3b) offers each installed Wayland session's desktop file, with our edel.desktop, and keeps each person's choice in the data partition's greeter directory."
packages = ["greetd", "greetd-openrc", "pam-rundir", "zzz"]

[services]
boot = ["edel-live"]
default = ["greetd"]
