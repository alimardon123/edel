# Edel OS's own rule (M6.5): the admin group runs edel as root with no doas
# password. edel then asks the administrator's own password for what can
# break the machine or open it (an install, an update, a rollback, a change
# of root's ssh keys), and refuses anyone outside the group, so this rule
# can be this wide. The group is the one users::ADMIN_GROUP names (the
# settings file's users.NAME.admin); /usr/bin/edel is where image.rs puts
# the tool.
permit nopass :admin as root cmd /usr/bin/edel
