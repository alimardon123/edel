# Memory maps for the programs that need many (roadmap M8.33): some games
# under Proton and their anti-cheat, and some servers, map more areas than
# the kernel's 65530 and stop when refused. 1048576 is what SteamOS, Fedora
# and Arch set; it costs nothing until a program uses it. OpenRC's sysctl
# service reads this at boot.
vm.max_map_count = 1048576
