# Real hardware: the desktop image lists it (M4.1); the laptop image it
# was named after was dropped on 2026-10-06, as the desktop is the stick. features/laptop/ holds edel-report,
# which leaves the hardware report on the stick's EFI system partition at
# every boot (M3.4, docs/TRY-IT.md).
format = 1
summary = "Real laptops: Intel graphics and wired firmware, and the hardware report"
why = "Intel's graphics, the reference laptop's (Iris Xe, i915), and its newer xe cards need firmware for their power saving and their scheduler, which i915 asks for as it starts, before the data partition's packs are mounted, and without which it runs on without its deep power states, so it stays here, 12.5 MiB; so does Realtek's wired firmware, 0.1 MiB, so a wired machine is online for an online install. The rest of a laptop's firmware is in hardware packs the stick carries (M8.17d, ADR-012): graphics-amd, intel-laptop (Wi-Fi, Bluetooth, sound, cameras, sensors), wifi-mediatek, wifi-qualcomm and wifi-realtek. edel-report writes EFI/edel/report.toml, because the stick has no login yet to run edel report from (M3.4)."
# eMMC disks of small laptops: without mmc the initramfs cannot find a
# root installed on one.
initramfs = ["mmc"]
packages = ["linux-firmware-i915", "linux-firmware-rtl_nic", "linux-firmware-xe"]

[services]
default = ["edel-report"]

# The firmware the base keeps (M5.30, M8.17d): Intel's graphics (Skylake
# to Meteor Lake with i915, Lunar Lake and newer with xe) and Realtek's
# Ethernet chips. Everything else these packages carry is taken out when
# the image is built; a listed pattern that matches nothing fails the build.
[[keep]]
under = "lib/firmware"
files = ["i915/*", "xe/*", "rtl_nic/*"]
