# Real hardware: the desktop image lists it (M4.1); the laptop image it
# was named after was dropped on 2026-10-06, as the desktop is the stick. features/laptop/ holds edel-report,
# which leaves the hardware report on the stick's EFI system partition at
# every boot (M3.4, docs/TRY-IT.md).
format = 1
summary = "Real laptops: the long-term kernel, firmware for graphics and Wi-Fi, CPU microcode and the hardware report"
why = "Laptops need linux-lts for their hardware drivers, firmware for the graphics and Wi-Fi in most of them, and CPU microcode, which GRUB loads before the initramfs (M3.3a); edel-report writes EFI/edel/report.toml, because the stick has no login yet to run edel report from (M3.4)."
# eMMC disks of small laptops: without mmc the initramfs cannot find a
# root installed on one.
initramfs = ["mmc"]
packages = [
  "linux-lts",
  "amd-ucode",
  "intel-ucode",
  "linux-firmware-amdgpu",
  "linux-firmware-ath10k",
  "linux-firmware-ath11k",
  "linux-firmware-i915",
  "linux-firmware-intel",
  "linux-firmware-mediatek",
  "linux-firmware-radeon",
  "linux-firmware-rtl_nic",
  "linux-firmware-rtlwifi",
  "linux-firmware-rtw88",
  "linux-firmware-rtw89",
  "linux-firmware-xe",
]

[services]
default = ["edel-report"]
