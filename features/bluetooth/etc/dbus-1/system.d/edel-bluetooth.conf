<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Edel OS (M5.8a): who may use Bluetooth. BlueZ's package lets every user
  of the machine talk to bluetoothd (its default policy allows
  org.bluez), so any account could pair or connect a device; here only
  root and group seat, the people at the machine, may. This file loads
  after the package's (/etc/dbus-1/system.d comes after
  /usr/share/dbus-1/system.d in system.conf), and a group's policy after the
  default one, so the denial reaches everyone else and the group is let in.
-->
<busconfig>
  <policy context="default">
    <deny send_destination="org.bluez"/>
  </policy>

  <policy group="seat">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
