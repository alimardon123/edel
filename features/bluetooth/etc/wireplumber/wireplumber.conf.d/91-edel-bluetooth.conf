# Edel OS (M5.8a): the image carries Bluetooth, so WirePlumber's Bluetooth
# monitor is back on. features/sound/.../90-edel.conf turns it off for images
# without it, and this file, loaded after it, turns it on again. optional:
# if the monitor cannot load, sound still starts (the stock profile says
# required).
wireplumber.profiles = {
  main = {
    hardware.bluetooth = optional
  }
}
