# Sound (roadmap M5.7b): PipeWire, which serves the PulseAudio socket from
# inside itself (etc/pipewire/pipewire.conf.d), and WirePlumber, which the
# session starts for each person (the preset's [session] start,
# edel::presets::SESSION_START), never a service of the machine. features/
# sound/ holds a udev rule that gives the people at the machine the
# sound devices, which the seat feature's group already holds, and the
# PipeWire and WirePlumber drop-ins. WirePlumber's Bluetooth monitor is off
# here and on again in the bluetooth feature (M5.8a), which brings the plugin.
format = 1
summary = "Sound: PipeWire and WirePlumber, started in each person's session"
why = "PipeWire is the one sound server for apps that play (PulseAudio and ALSA apps through the pulse module of pipewire-pulse, loaded inside PipeWire so no second process runs, and pipewire-alsa, Flatpak ones above all), record and, later, lend a paired phone's speakers over the network (ADR-011); WirePlumber picks and remembers each person's devices and its wpctl is the one command Settings' Sound page, the panel's volume and the shell read and set them with. They run per person in the session, started by the compositor, so nothing runs on a machine nobody is using; alsa-ucm-conf gives laptops' sound cards their speaker and microphone profiles. The udev rule gives group seat, the people at the machine (no logind here), the sound devices, so the feature needs seat. Laptop speakers that sound right (M6.15, ADR-012): edel-speakers, which runs edel boot speakers once at boot and exits, links the speaker tuning profile that matches the machine's model from usr/share/edel/speakers (a table and a PipeWire filter-chain file per model, kilobytes each, in the base so they work offline and on the stick) into PipeWire's drop-in folder; the filter chain itself is pipewire-pulse's module, and its equalizer and convolver need pipewire-filter-graph and its builtin plugins (with fftw and libsndfile, about 3.5 MiB). etc/pipewire/pipewire.conf.d/90-edel-quality.conf lets the device run at the music's own rate, so nothing is resampled that need not be."
packages = ["pipewire", "pipewire-pulse", "pipewire-alsa", "wireplumber", "alsa-ucm-conf", "pipewire-filter-graph", "pipewire-filter-graph-builtin"]

[services]
boot = ["edel-speakers"]

# The basics checklist (M6.7): each row is proved by its desktop-test case or marked.

[[basics]]
name = "Audio"
test = "sound"
