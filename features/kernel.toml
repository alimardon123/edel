# The kernel every bootable image runs (M8.17): one image for servers, VMs,
# desktops and laptops, so one kernel. Firmware stays the laptop feature's:
# linux-firmware-none stands in for it, or linux-lts pulls in every
# firmware package Alpine has (over 1 GiB) where no feature lists one.
format = 1
summary = "The long-term kernel and the CPU microcode"
why = "One image boots every machine (M8.17), so it carries the one kernel that drives real hardware, linux-lts, where linux-virt drives only virtual machines; a VM loads only the few drivers it finds, so the bigger package costs disk, never memory or boot time (measured in CI). CPU microcode (amd-ucode, intel-ucode), which GRUB loads before the initramfs (M3.3a), fixes the processor's own bugs and security holes on servers as on laptops, and a VM ignores it. linux-firmware-none, an empty package, meets linux-lts's need for firmware, so an image takes only the firmware its features list (the laptop feature's), not all of Alpine's."
packages = ["linux-lts", "amd-ucode", "intel-ucode", "linux-firmware-none"]
