# Edel OS (M5.8a): there is no polkit on the desktop, so NetworkManager
# authorizes every request that reaches it, and the D-Bus policy beside this
# file (/etc/dbus-1/system.d/edel-network.conf) decides who may reach it:
# root and group seat, the people at the machine. Everything else is the
# package's own defaults: keyfile connections under /etc/NetworkManager,
# its built-in DHCP client, a wired connection made for each cable, and
# wpa_supplicant started over D-Bus when a Wi-Fi adapter appears.
# hostname-mode=none: the machine's name is network.hostname, set by edel
# and OpenRC's hostname service alone (M8.17a). Left to its default,
# NetworkManager set the name it last read from /etc/hostname back again
# after `edel settings reset network.hostname`, which changes the file
# beneath the /etc overlay where its file watch does not see it.
[main]
auth-polkit=false
hostname-mode=none
