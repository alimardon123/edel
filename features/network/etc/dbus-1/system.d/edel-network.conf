<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Edel OS (M5.8a): who may change the network. NetworkManager's own policy
  lets every user talk to it and leaves the question to polkit; there is no
  polkit here and NetworkManager is told to authorize everything it is asked
  (NetworkManager/conf.d/90-edel.conf), so this file answers it: only root
  and group seat, the people at the machine, may call the interfaces that
  change something. This file loads after the package's (/etc/dbus-1/system.d
  comes after /usr/share/dbus-1/system.d in system.conf), so its denials win
  over the package's allowances for everyone; the policy for a group comes
  after the default one. Anyone may still read: the properties, the object
  lists and the read-only interfaces stay as the package left them.
-->
<busconfig>
  <policy context="default">
    <deny send_destination="org.freedesktop.NetworkManager"
          send_interface="org.freedesktop.NetworkManager"/>
    <deny send_destination="org.freedesktop.NetworkManager"
          send_interface="org.freedesktop.NetworkManager.Settings"/>
    <deny send_destination="org.freedesktop.NetworkManager"
          send_interface="org.freedesktop.NetworkManager.Settings.Connection"/>
    <deny send_destination="org.freedesktop.NetworkManager"
          send_interface="org.freedesktop.NetworkManager.AgentManager"/>
    <deny send_destination="org.freedesktop.NetworkManager"
          send_interface="org.freedesktop.NetworkManager.Device"/>
    <deny send_destination="org.freedesktop.NetworkManager"
          send_interface="org.freedesktop.NetworkManager.Device.Wireless"/>
    <deny send_destination="org.freedesktop.NetworkManager"
          send_interface="org.freedesktop.NetworkManager.Device.WifiP2P"/>
    <!-- Properties.Set is how Wi-Fi is switched off: a property is written
         through this interface, whatever interface the property is on. -->
    <deny send_destination="org.freedesktop.NetworkManager"
          send_interface="org.freedesktop.DBus.Properties"
          send_member="Set"/>
  </policy>

  <policy group="seat">
    <allow send_destination="org.freedesktop.NetworkManager"/>
  </policy>
</busconfig>
