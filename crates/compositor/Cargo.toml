[package]
name = "edel-compositor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Edel OS compositor: windows, floating and tiling, title bars, outputs and effects"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "edel-compositor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# The system file reader (M4.5), without the command line's network and
# signing dependencies.
edel = { path = "../edel", default-features = false }
fontdue = "0.9.4"
inotify = { version = "0.11.5", default-features = false }
# Pinned (roadmap M4.2a): only what is used; the DRM, GBM, libinput, udev
# and libseat backends join with the virtual GPU (M4.2b).
smithay = { version = "=0.7.0", default-features = false, features = ["backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_winit", "desktop", "renderer_gl", "wayland_frontend"] }
toml = "1.1.6"
