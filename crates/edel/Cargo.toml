[package]
name = "edel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Edel OS system tool: builds images today; updates, add-ons and system files later"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
