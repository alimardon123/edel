[package]
name = "edel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Edel OS system tool: builds images today; updates, add-ons and settings files later"
license = "GPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "edel"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# What only the command needs: arguments, hashing, signing and downloads.
# The compositor, shell-ui and Settings link the library without them.
cli = ["os", "dep:clap", "dep:ed25519-dalek", "dep:flate2", "dep:inotify", "dep:libc", "dep:sha2", "dep:ureq"]
# The system's own work (M6.17): the install plan, the feature file reader,
# the base's tools (edel::base), firmware, what an image keeps, scripts,
# services and speaker profiles.
# The command and Settings take it; the compositor and shell-ui never do,
# so the desktop links only the settings format and its models.
os = []
# The shell's own icons (M5.5d), drawn for the compositor, shell-ui and
# Settings, and apps' icons from the icon themes (M5.4c, M5.6a), whose
# PNGs tiny-skia reads; the same tiny-skia resvg draws with.
icons = ["dep:resvg", "dep:tiny-skia"]
# Wallpapers read and blurred for the compositor and shell-ui (M5.10c4c): a
# JPEG or PNG fitted to a screen, and the blur behind the overview.
pictures = ["icons", "dep:jpeg-decoder"]

# Draws an SVG into a PNG for design/wallpapers/make.py (M5.10c4b).
[[example]]
name = "render-svg"
required-features = ["icons"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"], optional = true }
ed25519-dalek = { version = "3", optional = true }
flate2 = { version = "1", optional = true }
# `edel update` and the add-on fetch wait for a game to end (M7.7c): inotify
# wakes them when the compositor writes its state file. The crate is already
# in the lock file for the compositor.
inotify = { version = "0.11.5", default-features = false, optional = true }
# Sunrise and sunset in this computer's own time (M7.14): the time zone files tzdata ships, as shell-ui's clock reads them.
jiff = "0.2"
# Wallpapers' JPEG pictures (M5.10c4b): pure Rust, and it decodes at a half, a quarter or an eighth of the size the screen needs, so a 4K picture never sits whole in memory for a smaller screen.
jpeg-decoder = { version = "0.3.2", default-features = false, optional = true }
# O_NOFOLLOW and O_NONBLOCK, to read files in a user's home safely as root.
libc = { version = "0.2", optional = true }
resvg = { version = "0.48.1", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "png-format"], optional = true }
serde_ignored = "0.1"
sha2 = { version = "0.11", optional = true }
toml = "1.1.6"
toml_edit = "0.25"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
