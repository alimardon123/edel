[package]
name = "edel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Edel OS system tool: builds images today; updates, add-ons and system files later"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3"
flate2 = "1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
toml = "1.1.6"
ureq = { version = "3", default-features = false, features = ["rustls"] }
