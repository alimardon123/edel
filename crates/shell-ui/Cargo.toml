[package]
name = "edel-shell-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Edel OS shell's panels and menus, drawn by itself (ADR-002)"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "edel-shell-ui"
path = "src/main.rs"

[dependencies]
# Screen readers (M5.1d): every widget a node in an AccessKit tree, which
# the Unix adapter serves over AT-SPI on the session's D-Bus once a reader
# turns accessibility on. Its zbus is the D-Bus shell-ui talks over later
# (M5.2, M5.5, M5.9).
accesskit = "0.25.0"
accesskit_unix = "0.23.0"
anyhow = "1.0.104"
# Text for every script, shaped, with fallback fonts (ADR-002's shell-ui
# toolkit decision, M5.1b).
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "fontconfig", "swash"] }
# The design tokens and, later, the settings file, read as every part does.
edel = { path = "../edel", default-features = false, features = ["icons"] }
# Reading the tray items' streams of signals (M5.2e); already in the tree
# through zbus.
futures-lite = { version = "2.6", default-features = false }
# The clock's local time, from /etc/localtime when a zone is set.
jiff = "0.2"
# The compositor's state file, for the effect tier (M5.11a).
toml = "1.1.6"
# Pinned like the test client's: the layer shell, a calloop event loop
# for the clock's timer and xkbcommon for the launcher's keys (M5.3b),
# whose keyboard shell-ui binds only while the launcher is open.
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
# The code for the compositor's private protocol, edel-shell-v1 (M5.3);
# already in the tree through smithay-client-toolkit's protocols.
wayland-scanner = "0.31.11"
# 2D drawing into the panel's shared-memory buffers.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
# The settings portal's backend (M5.5a), on the zbus AccessKit already
# brings, with its blocking API: it answers on a thread of its own.
zbus = { version = "5.5", default-features = false, features = ["async-io", "blocking-api"] }
