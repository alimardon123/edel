# Edel OS VM image: the base plus a kernel, init and SSH, for cloud and
# local virtual machines. Builds a bootable disk with A/B update slots.
format = 1
name = "edel-vm"
variant = "vm"
arch = "x86_64"
hostname = "edel"
files = ["files/common", "files/vm", "files/ab"]

[alpine]
branch = "v3.24"
mirror = "https://dl-cdn.alpinelinux.org/alpine"
repositories = ["main", "community"]

[packages]
install = [
  "alpine-base",
  "alpine-keys",
  "busybox-binsh",
  "ca-certificates-bundle",
  "e2fsprogs",
  "e2fsprogs-extra",
  "libgcc",
  "linux-virt",
  "openssh-server",
  "partx",
  "sfdisk",
]

[services]
sysinit = ["devfs", "dmesg", "mdev", "hwdrivers", "edel-data"]
boot = ["modules", "sysctl", "hostname", "bootmisc", "syslog", "networking"]
default = ["sshd", "edel-boot-ok"]
shutdown = ["mount-ro", "killprocs", "savecache"]

[vm]
kernel = "virt"
slot_mib = 1024
cmdline = "console=ttyS0 modules=ext4,virtio_pci,virtio_blk,overlay"
