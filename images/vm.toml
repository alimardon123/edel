# Edel OS VM image: the base plus a kernel, init and SSH, for cloud and
# local virtual machines. Builds a bootable disk with A/B update slots.
format = 2
name = "edel-vm"
variant = "vm"
arch = "x86_64"
hostname = "edel"
features = ["base", "machine", "mdev", "ab-boot", "ssh", "vm"]

[vm]
# linux-virt, from the vm feature (its why says why not lts).
kernel = "virt"
# Every slot of a machine is 4096 MiB (docs/FORMATS.md, M3.3b): a VM
# runs from this disk as it is, so it must take every later update.
slot_mib = 4096
cmdline = "console=ttyS0"
