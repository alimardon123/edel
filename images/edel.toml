# Edel OS (roadmap M8.17): the one disk image for every machine, servers,
# VMs, desktops and laptops, and the stick to try and install from. What a
# machine becomes is its settings file: with a screen it starts the
# desktop, greetd's greeter on our compositor (M4.7b, M5.10b); with no
# graphics card it starts no desktop service (the features marked screen)
# and its console asks for the first person (M6.6b). The firewall (M8.14) is
# one of those: it closes inbound connections where there is a screen, and a
# server keeps the ports its containers publish. A bootable A/B disk,
# so its variant is vm. The container image is the other image, as a
# container cannot be a disk.
format = 2
name = "edel"
variant = "vm"
arch = "x86_64"
hostname = "edel"
features = ["base", "machine", "udev", "ab-boot", "ssh", "kernel", "laptop", "completion", "network", "firewall", "cloud", "updates"]
# ssh is off where a screen is, a desktop's people sit at it, and on where
# none is, as a server is used from afar; services.ssh in the settings
# file decides either way (the seed, the installer, the console's key).
off = ["ssh"]
headless = ["ssh"]
# Built beside the image from its root, signed in its release, and
# mounted on a machine whose settings file names them (M7.2a). The
# desktop is one of them (M8.17c), and wallpapers, fonts-cjk, orca and
# graphics-nvidia are built on it; the laptops' firmware packs are the
# last four (M8.17d).
addons = ["desktop", "wallpapers", "fonts-cjk", "orca", "printing", "containers", "virtualization", "gaming", "graphics-nvidia", "ai-agents", "intel-laptop", "wifi-mediatek", "wifi-qualcomm", "wifi-realtek"]

[vm]
kernel = "lts"
# Small slots, so the disk fits a common 8 GB stick; `edel install` gives
# the installed machine slots of 4096 MiB.
slot_mib = 1536
# The screen and the serial port both show the kernel; the serial port,
# listed last, also gets the boot messages, as the CI tests read them and
# a server's console is often one.
cmdline = "console=tty0 console=ttyS0,115200"
# The disk carries the desktop and its wallpapers on its data partition, and a machine has it
# while its settings file names no add-ons of its own (M8.17c): the stick,
# and every machine installed from it, starts the desktop where a screen is.
# It carries the laptops' firmware packs too (M8.17d), of which a machine
# has those its own hardware matches, so any laptop works from the stick
# offline and an install copies only its own chips' packs.
carry = ["desktop", "wallpapers", "intel-laptop", "wifi-mediatek", "wifi-qualcomm", "wifi-realtek"]
