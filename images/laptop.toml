# Edel OS laptop image: the VM image with the kernel and firmware real
# laptops need (roadmap M3.3a). Written to a USB stick, it boots a laptop
# through UEFI; the same disk layout and A/B slots as the VM image.
format = 1
name = "edel-laptop"
variant = "vm"
arch = "x86_64"
hostname = "edel"
files = ["files/common", "files/vm", "files/ab"]

[alpine]
branch = "v3.24"
mirror = "https://dl-cdn.alpinelinux.org/alpine"
repositories = ["main", "community"]

[packages]
install = [
  "alpine-base",
  "alpine-keys",
  "busybox-binsh",
  "ca-certificates-bundle",
  "dosfstools",
  "e2fsprogs",
  "e2fsprogs-extra",
  "libgcc",
  "linux-lts",
  "openssh-server",
  "partx",
  "sfdisk",
  # Firmware for the graphics and Wi-Fi in most laptops, and CPU
  # microcode, which GRUB loads before the initramfs (roadmap M3.3a).
  "amd-ucode",
  "intel-ucode",
  "linux-firmware-amdgpu",
  "linux-firmware-ath10k",
  "linux-firmware-ath11k",
  "linux-firmware-i915",
  "linux-firmware-intel",
  "linux-firmware-mediatek",
  "linux-firmware-radeon",
  "linux-firmware-rtl_nic",
  "linux-firmware-rtlwifi",
  "linux-firmware-rtw88",
  "linux-firmware-rtw89",
  "linux-firmware-xe",
]

[services]
sysinit = ["devfs", "dmesg", "mdev", "hwdrivers", "edel-guard", "edel-data"]
boot = ["modules", "sysctl", "edel-system", "hostname", "bootmisc", "syslog", "networking"]
default = ["sshd", "edel-boot-ok"]
shutdown = ["mount-ro", "killprocs", "savecache"]

[image]
# The boot guard confirms the slot once the default runlevel is reached.
health = ["default-runlevel"]

[vm]
kernel = "lts"
slot_mib = 1024
# The screen and the serial port both show the kernel; the serial port,
# listed last, also gets the boot messages, as the CI boot test reads them.
cmdline = "console=tty0 console=ttyS0,115200"
