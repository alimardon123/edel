# Edel OS laptop image: the VM image with the kernel and firmware real
# laptops need (roadmap M3.3a). Written to a USB stick, it boots a laptop
# through UEFI; the same disk layout and A/B slots as the VM image. It
# ships ssh off: people sit at a laptop (ADR-008).
format = 2
name = "edel-laptop"
variant = "vm"
arch = "x86_64"
hostname = "edel"
features = ["base", "machine", "mdev", "ab-boot", "ssh", "laptop", "completion"]
off = ["ssh"]

[vm]
kernel = "lts"
# The stick a laptop boots and installs from keeps small slots, so it
# fits a common 8 GB stick (about 7.45 GiB); `edel install` gives the
# installed machine slots of 4096 MiB (docs/FORMATS.md, M3.3b).
slot_mib = 1024
# The screen and the serial port both show the kernel; the serial port,
# listed last, also gets the boot messages, as the CI boot test reads them.
cmdline = "console=tty0 console=ttyS0,115200"
