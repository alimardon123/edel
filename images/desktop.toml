# Edel OS desktop image (roadmap M4.1): the laptop image plus graphics,
# seats, the login screen, the interface font and a terminal. Until the
# compositor exists (M4.2b), greetd's text greeter logs people in to a
# shell, and sway is here only for CI's baseline; dropping it is deleting
# its line. A bootable A/B disk like the laptop's, so its variant is vm.
format = 2
name = "edel-desktop"
variant = "vm"
arch = "x86_64"
hostname = "edel"
features = ["base", "machine", "udev", "ab-boot", "ssh", "laptop", "graphics", "seat", "login", "fonts", "terminal", "sway-baseline"]
off = ["ssh"]

[alpine]
branch = "v3.24"
mirror = "https://dl-cdn.alpinelinux.org/alpine"
repositories = ["main", "community"]

[vm]
kernel = "lts"
# Small slots, as on the laptop stick, so the disk fits a common 8 GB
# stick; `edel install` gives the installed machine slots of 4096 MiB.
slot_mib = 1536
# The screen and the serial port both show the kernel; the serial port,
# listed last, also gets the boot messages, as the CI tests read them.
cmdline = "console=tty0 console=ttyS0,115200"
