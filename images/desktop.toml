# Edel OS desktop image (roadmap M4.1, M4.2b): the laptop image plus
# graphics, seats, the login screen, fonts, a terminal, our compositor and
# XWayland for X11 apps (M4.7).
# greetd's greeter, our compositor running the text greeter in foot,
# logs people in and starts the compositor as them (M4.7b), until the
# compositor greets people itself (M5.10). A bootable A/B disk like
# the laptop's, so its variant is vm.
format = 2
name = "edel-desktop"
variant = "vm"
arch = "x86_64"
hostname = "edel"
features = ["base", "machine", "udev", "ab-boot", "ssh", "laptop", "completion", "graphics", "seat", "login", "fonts", "terminal", "compositor", "shell", "settings", "xwayland", "sound", "network", "bluetooth"]
off = ["ssh"]

[vm]
kernel = "lts"
# Small slots, as on the laptop stick, so the disk fits a common 8 GB
# stick; `edel install` gives the installed machine slots of 4096 MiB.
slot_mib = 1536
# The screen and the serial port both show the kernel; the serial port,
# listed last, also gets the boot messages, as the CI tests read them.
cmdline = "console=tty0 console=ttyS0,115200"
