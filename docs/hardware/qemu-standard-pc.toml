# A sample report: CI's virtual machine (QEMU), written by hand from a CI
# run of 2026-10-18 to show the format until the first laptop's report
# arrives (M8.1). Its kernel log and system log are cut.
format = 1
version = "2026.10.1554"
kernel = "6.18.57-0-virt"
model = "QEMU Standard PC (Q35 + ICH9, 2009)"
features = [
    "ab-boot",
    "apps",
    "base",
    "bluetooth",
    "capture",
    "completion",
    "compositor",
    "flatpak",
    "fonts",
    "graphics",
    "input-method",
    "laptop",
    "location",
    "login",
    "machine",
    "network",
    "power",
    "seat",
    "settings",
    "shell",
    "sound",
    "ssh",
    "terminal",
    "udev",
    "wallpapers",
    "xwayland",
]
feature_notes = []
started = "Started in 5.85 s, 67 MiB of memory in use, 91 MiB used on the root"
memory_in_use_mib = 412
dmesg = "(cut for the sample)"
system_log = "(cut for the sample)"
pci = []
missing_firmware = []
sessions = []
games = []

[measured]
boot_seconds = 5.85
memory_at_boot_mib = 67
root_used_mib = 91

[[frame_times]]
person = "ci"
frames = 300
render_p50_ms = 1.2
