<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edel OS mockups</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Edel OS target look, second round (2026-10-03). Not binding: the real
  values are design tokens (design/tokens.toml, M5.5), every one of which a
  person can change (M5.12). Render with `node render.js` (Playwright).
-->
<style>
:root {
  --font: "Inter Variable", "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", "DejaVu Sans Mono", monospace;
  /* Corners: a little rounded, never pill-shaped. */
  --r-win: 10px;
  --r-menu: 12px;
  --r-ctl: 7px;
  --r-sm: 5px;
  /* Light */
  --accent: #2d6ae3;
  --accent-text: #ffffff;
  --accent-soft: rgba(45, 106, 227, 0.12);
  --text: #1c1e22;
  --text-2: #5f646e;
  --text-3: #8d929b;
  --win: #ffffff;
  --win-2: #f5f6f8;
  --bar: #f1f2f4;
  --bar-focused: #f7f8f9;
  --line: rgba(20, 24, 32, 0.09);
  --line-2: rgba(20, 24, 32, 0.055);
  --edge: rgba(20, 24, 32, 0.14);
  --fill: rgba(20, 24, 32, 0.055);
  --fill-2: rgba(20, 24, 32, 0.085);
  --material: rgba(246, 247, 249, 0.76);
  --material-strong: rgba(250, 251, 252, 0.95);
  --thumb: #ffffff;
  --shadow-win: 0 0 0 0.5px rgba(20, 24, 32, 0.16), 0 1px 2px rgba(20, 24, 32, 0.06), 0 10px 24px -8px rgba(20, 24, 32, 0.18), 0 28px 56px -18px rgba(20, 24, 32, 0.26);
  --shadow-win-2: 0 0 0 0.5px rgba(20, 24, 32, 0.14), 0 1px 2px rgba(20, 24, 32, 0.05), 0 8px 18px -10px rgba(20, 24, 32, 0.16);
  --shadow-menu: 0 0 0 0.5px rgba(20, 24, 32, 0.14), 0 2px 6px rgba(20, 24, 32, 0.06), 0 18px 44px -12px rgba(20, 24, 32, 0.28);
  --shadow-thumb: 0 0 0 0.5px rgba(20, 24, 32, 0.12), 0 1px 2px rgba(20, 24, 32, 0.12);
  --close: #e0443e;
}
.dark {
  --accent: #5b8ef5;
  --accent-text: #0b1220;
  --accent-soft: rgba(91, 142, 245, 0.18);
  --text: #eceef1;
  --text-2: #a5abb5;
  --text-3: #737a85;
  --win: #1e2026;
  --win-2: #191b20;
  --bar: #24272e;
  --bar-focused: #2b2e36;
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.05);
  --edge: rgba(255, 255, 255, 0.10);
  --fill: rgba(255, 255, 255, 0.06);
  --fill-2: rgba(255, 255, 255, 0.10);
  --material: rgba(26, 28, 34, 0.74);
  --material-strong: rgba(32, 34, 41, 0.95);
  --thumb: #3a3e48;
  --shadow-win: 0 0 0 0.5px rgba(0, 0, 0, 0.6), inset 0 0.5px 0 rgba(255, 255, 255, 0.08), 0 10px 24px -8px rgba(0, 0, 0, 0.45), 0 28px 56px -18px rgba(0, 0, 0, 0.55);
  --shadow-win-2: 0 0 0 0.5px rgba(0, 0, 0, 0.55), inset 0 0.5px 0 rgba(255, 255, 255, 0.06), 0 8px 18px -10px rgba(0, 0, 0, 0.45);
  --shadow-menu: 0 0 0 0.5px rgba(0, 0, 0, 0.6), inset 0 0.5px 0 rgba(255, 255, 255, 0.08), 0 18px 44px -12px rgba(0, 0, 0, 0.6);
  --shadow-thumb: 0 0 0 0.5px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.4);
  color: var(--text);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #c9ccd2; font-family: var(--font); color: var(--text); padding: 40px; }
svg { display: block; }
#host { display: flex; flex-direction: column; gap: 40px; }

.screen { position: relative; width: 1280px; height: 800px; overflow: hidden; color: var(--text); font-family: var(--font); font-size: 13px; letter-spacing: -0.006em; -webkit-font-smoothing: antialiased; }

/* Wallpaper: calm layered light, fine grain. */
.wall { position: absolute; inset: 0; overflow: hidden; }
.wall .layer { position: absolute; }
.wall .grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* Windows */
.win { position: absolute; background: var(--win); border-radius: var(--r-win); box-shadow: var(--shadow-win-2); overflow: hidden; }
.win.focused { box-shadow: var(--shadow-win); }
.titlebar { height: 32px; background: var(--bar); display: flex; align-items: center; justify-content: center; position: relative; color: var(--text-3); font-weight: 500; font-size: 12.5px; border-bottom: 0.5px solid var(--line); }
.win.focused .titlebar { background: var(--bar-focused); color: var(--text); }
.titlebar .buttons { position: absolute; right: 6px; top: 0; height: 32px; display: flex; align-items: center; gap: 2px; }
.titlebar.left .buttons { right: auto; left: 6px; flex-direction: row-reverse; }
.tb { width: 26px; height: 22px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--text-2); }
.win:not(.focused) .tb { color: var(--text-3); }
.tb.hot { background: var(--close); color: #fff; }
.titlebar .title { display: flex; align-items: center; gap: 7px; }
.winbody { position: absolute; top: 32px; left: 0; right: 0; bottom: 0; }

/* Panel */
.panel { position: absolute; left: 0; right: 0; height: 40px; display: flex; align-items: center; padding: 0 6px; gap: 2px; background: var(--material); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: inset 0 0.5px 0 var(--edge); }
.panel.bottom { bottom: 0; }
.panel.top { top: 0; height: 30px; box-shadow: inset 0 -0.5px 0 var(--edge); }
.fillet { position: absolute; width: 10px; height: 10px; }
.pbtn { height: 30px; min-width: 32px; border-radius: var(--r-ctl); display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 7px; color: var(--text); }
.pbtn.active { background: var(--fill-2); }
.sep { width: 0.5px; height: 18px; background: var(--edge); margin: 0 6px; }
.task { height: 30px; border-radius: var(--r-ctl); display: flex; align-items: center; gap: 8px; padding: 0 10px 0 7px; max-width: 200px; color: var(--text-2); position: relative; font-weight: 500; font-size: 12.5px; }
.task.focused { background: var(--fill); color: var(--text); }
.task .ind { position: absolute; bottom: 2px; left: 50%; width: 4px; height: 2px; border-radius: 1px; transform: translateX(-50%); background: var(--text-3); }
.task.focused .ind { width: 14px; background: var(--accent); }
.task span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tray { display: flex; align-items: center; gap: 2px; margin-left: auto; color: var(--text); }
.clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; padding: 0 8px 0 6px; }
.clock b { font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.clock small { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }

/* Workspaces: numbered buttons, Super+1 to 4. */
.desks { display: flex; gap: 2px; padding: 2px; border-radius: var(--r-ctl); background: var(--fill); }
.desk { width: 24px; height: 22px; border-radius: var(--r-sm); display: grid; place-items: center; font-size: 11.5px; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; position: relative; }
.desk.busy { color: var(--text-2); }
.desk.busy::after { content: ""; position: absolute; bottom: 2px; width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .7; }
.desk.on { background: var(--accent); color: var(--accent-text); }
.desk.on::after { background: var(--accent-text); }
/* Floating or tiling, for this workspace: Super+T. */
.seg { display: flex; gap: 2px; padding: 2px; border-radius: var(--r-ctl); background: var(--fill); }
.seg .s { width: 28px; height: 22px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--text-2); }
.seg .s.on { background: var(--thumb); color: var(--text); box-shadow: var(--shadow-thumb); }

/* App icons: one shape, one light from above, muted colours. */
.app { border-radius: 23%; display: grid; place-items: center; color: #fff; flex: none; box-shadow: inset 0 0.5px 0 rgba(255,255,255,.35), inset 0 -0.5px 0 rgba(0,0,0,.12), 0 0 0 0.5px rgba(0,0,0,.14), 0 1px 1.5px rgba(0,0,0,.12); }

/* Materials */
.menu { position: absolute; background: var(--material-strong); backdrop-filter: blur(34px) saturate(180%); -webkit-backdrop-filter: blur(34px) saturate(180%); border-radius: var(--r-menu); box-shadow: var(--shadow-menu); }
.search { height: 34px; border-radius: var(--r-ctl); background: var(--fill); display: flex; align-items: center; gap: 9px; padding: 0 11px; color: var(--text-3); }
.label { font-size: 12px; font-weight: 600; color: var(--text-2); }
.tile { border-radius: 10px; padding: 10px 11px; display: flex; align-items: center; gap: 10px; background: var(--fill); }
.tile .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-2); color: var(--text); flex: none; }
.tile.on .ic { background: var(--accent); color: var(--accent-text); }
.tile b { font-weight: 550; font-size: 12.5px; display: block; }
.tile small { display: block; font-size: 11.5px; color: var(--text-2); margin-top: 1px; }
.slider { height: 26px; display: flex; align-items: center; gap: 10px; color: var(--text-2); }
.slider .track { flex: 1; height: 6px; border-radius: 3px; background: var(--fill-2); position: relative; }
.slider .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.slider .knob { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); box-shadow: 0 0 0 0.5px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.2); }
.chip { height: 30px; width: 30px; border-radius: var(--r-ctl); display: grid; place-items: center; background: var(--fill); color: var(--text); }
.btn { height: 28px; padding: 0 12px; border-radius: var(--r-ctl); display: inline-flex; align-items: center; font-weight: 550; font-size: 12.5px; background: var(--fill-2); color: var(--text); }
.btn.primary { background: var(--accent); color: var(--accent-text); }

/* Files */
.side { position: absolute; top: 0; bottom: 0; left: 0; width: 184px; background: var(--win-2); border-right: 0.5px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 1px; }
.side .it { height: 28px; border-radius: var(--r-sm); display: flex; align-items: center; gap: 9px; padding: 0 9px; color: var(--text); }
.side .it svg { color: var(--accent); }
.side .it.sel { background: var(--fill-2); font-weight: 550; }
.side .hd { font-size: 11.5px; color: var(--text-3); font-weight: 600; padding: 14px 9px 4px; }
.thumbs { position: absolute; top: 52px; left: 200px; right: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 14px; }
.thumb { display: flex; flex-direction: column; gap: 7px; align-items: center; font-size: 11.5px; color: var(--text-2); }
.thumb .pic { width: 100%; aspect-ratio: 4/3; border-radius: 6px; box-shadow: 0 0 0 0.5px var(--edge); }
.crumbs { position: absolute; top: 12px; left: 200px; right: 18px; height: 28px; display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.crumbs b { color: var(--text); font-weight: 600; }

/* Terminal */
.term { position: absolute; inset: 0; background: #16181d; color: #d9dce1; font-family: var(--mono); font-size: 12px; line-height: 1.65; padding: 12px 14px; }
.term .p { color: #8fd6a9; }
.term .c { color: #8fb0f0; }
.term .m { color: #858c98; }
.term .cur { display: inline-block; width: 7px; height: 14px; background: #d9dce1; vertical-align: -2px; }

/* Settings */
.set-side { position: absolute; top: 0; bottom: 0; left: 0; width: 204px; background: var(--win-2); border-right: 0.5px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 1px; }
.set-side .it { height: 28px; border-radius: var(--r-sm); display: flex; align-items: center; gap: 9px; padding: 0 9px; }
.set-side .it.sel { background: var(--accent); color: var(--accent-text); font-weight: 550; }
.set-main { position: absolute; top: 0; bottom: 0; left: 204px; right: 0; padding: 22px 28px; overflow: hidden; }
.set-main h2 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 4px; }
.set-main p.sub { color: var(--text-2); margin-bottom: 18px; max-width: 60ch; line-height: 1.45; }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.preset { border-radius: 10px; padding: 7px; background: var(--win-2); box-shadow: 0 0 0 0.5px var(--edge); }
.preset.sel { box-shadow: 0 0 0 2px var(--accent); }
.preset .sk { height: 64px; border-radius: 6px; position: relative; overflow: hidden; }
.preset .nm { margin-top: 7px; font-weight: 550; font-size: 12px; display: flex; justify-content: space-between; align-items: center; padding: 0 2px; }
.rows { border-radius: 10px; background: var(--win-2); box-shadow: 0 0 0 0.5px var(--edge); overflow: hidden; }
.row { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 0.5px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row small { display: block; color: var(--text-3); font-size: 11.5px; margin-top: 1px; }
.switch { width: 36px; height: 21px; border-radius: 11px; background: var(--fill-2); position: relative; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 0.5px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.2); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 17px; }
.drop { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.drop.box { height: 26px; padding: 0 8px 0 10px; border-radius: var(--r-sm); background: var(--fill); color: var(--text); }

/* Comparison labels */
.tag { position: absolute; top: 16px; left: 16px; height: 24px; padding: 0 10px; border-radius: 6px; background: rgba(12, 14, 18, .66); color: #fff; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; backdrop-filter: blur(10px); }

/* Devices */
.phone { position: absolute; width: 390px; height: 844px; border-radius: 54px; padding: 11px; background: #101216; box-shadow: 0 40px 80px -24px rgba(20,24,32,.5), inset 0 0 0 1.5px #3a3e46, inset 0 0 0 3px #15171b; }
.phone .scr { position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-weight: 600; font-size: 14px; z-index: 3; font-variant-numeric: tabular-nums; }
.handle { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 128px; height: 5px; border-radius: 3px; background: var(--text); opacity: .8; z-index: 3; }
.tablet { position: absolute; border-radius: 30px; padding: 16px; background: #101216; box-shadow: 0 40px 80px -24px rgba(20,24,32,.5), inset 0 0 0 1.5px #3a3e46; }
.tablet .scr { position: relative; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; }
</style>
</head>
<body>
<div id="host"></div>
<script>
const st = (w, extra = '') => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"${extra}>`;
const I = {
  edel: s => `<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 2.8l8 4.6v9.2L12 21.2l-8-4.6V7.4z"/><path d="M12 8.2l3.3 1.9v3.8L12 15.8l-3.3-1.9v-3.8z" fill="currentColor" stroke="none"/></svg>`,
  search: s => `${st(s||15)}<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>`,
  wifi: s => `${st(s||17)}<path d="M3 9.5a13 13 0 0 1 18 0"/><path d="M6 12.8a8.5 8.5 0 0 1 12 0"/><path d="M9 16a4 4 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>`,
  vol: s => `${st(s||17)}<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>`,
  bat: s => `<svg width="${(s||17)*1.2}" height="${s||17}" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="7" width="20" height="10" rx="2.6"/><rect x="4.8" y="9.3" width="12.4" height="5.4" rx="1.3" fill="currentColor" stroke="none"/><path d="M25 10.5v3" stroke-linecap="round"/></svg>`,
  bell: s => `${st(s||17)}<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>`,
  bt: s => `${st(s||16)}<path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9"/></svg>`,
  moon: s => `${st(s||16)}<path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>`,
  sun: s => `${st(s||16)}<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>`,
  dnd: s => `${st(s||16)}<circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/></svg>`,
  power: s => `${st(s||15)}<path d="M12 3.5v8"/><path d="M7 6.5a7.5 7.5 0 1 0 10 0"/></svg>`,
  lock: s => `${st(s||15)}<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>`,
  gear: s => `${st(s||15)}<circle cx="12" cy="12" r="3"/><path d="M12 2.8l1.6 2.4 2.8-.6.6 2.8 2.4 1.6-1.2 2.6 1.2 2.6-2.4 1.6-.6 2.8-2.8-.6-1.6 2.4-1.6-2.4-2.8.6-.6-2.8-2.4-1.6 1.2-2.6-1.2-2.6 2.4-1.6.6-2.8 2.8.6z"/></svg>`,
  min: '<svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2.5 6h7"/></svg>',
  max: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="2.5" y="2.5" width="7" height="7" rx="1.2"/></svg>',
  close: '<svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>',
  chev: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3l3 3-3 3"/></svg>',
  updown: '<svg width="10" height="12" viewBox="0 0 10 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5L5 2l2.5 2.5M2.5 7.5L5 10l2.5-2.5"/></svg>',
  home: s => `${st(s||15)}<path d="M4 10.5L12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg>`,
  doc: s => `${st(s||15)}<path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/></svg>`,
  dl: s => `${st(s||15)}<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg>`,
  pic: s => `${st(s||15)}<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>`,
  note: s => `${st(s||15)}<path d="M9 18V5.5l10-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>`,
  trash: s => `${st(s||15)}<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></svg>`,
  drive: s => `${st(s||15)}<rect x="3.5" y="7" width="17" height="10" rx="2.5"/><circle cx="16.5" cy="12" r="1" fill="currentColor"/></svg>`,

  return `<div class="titlebar${opts.left ? ' left' : ''}"><div class="title">${icon ? app(icon, 16) : ''}<span>${title}</span></div><div class="buttons">${btns}</div></div>`;
}
function win(x, y, w, h, title, icon, body, opts = {}) {
  return `<div class="win${opts.focused ? ' focused' : ''}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${opts.style || ''}">${titlebar(title, icon, opts)}<div class="winbody">${body}</div></div>`;
}
function fillets(edge, colour, h) {
  const r = 10;
  const pathL = edge === 'bottom' ? `M0 0 V${r} H${r} A${r} ${r} 0 0 1 0 0Z` : `M0 ${r} V0 H${r} A${r} ${r} 0 0 0 0 ${r}Z`;
  const pathR = edge === 'bottom' ? `M${r} 0 V${r} H0 A${r} ${r} 0 0 0 ${r} 0Z` : `M${r} ${r} V0 H0 A${r} ${r} 0 0 1 ${r} ${r}Z`;
  const pos = edge === 'bottom' ? `bottom:${h}px` : `top:${h}px`;
  return `<svg class="fillet" style="left:0;${pos}" viewBox="0 0 10 10"><path d="${pathL}" fill="${colour}"/></svg><svg class="fillet" style="right:0;${pos}" viewBox="0 0 10 10"><path d="${pathR}" fill="${colour}"/></svg>`;
}

    </div>
  </div>${fillets('top', 'rgba(246,247,249,.76)', 30)}
  <div class="menu" style="left:50%;transform:translateX(-50%);bottom:8px;height:64px;padding:0 9px;border-radius:16px;display:flex;align-items:center;gap:9px">
    ${dockApps.map((k, i) => `<div style="position:relative">${app(k, 46)}${[0, 1, 8, 9].includes(i) ? '<div style="position:absolute;bottom:-7px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--text-2)"></div>' : ''}</div>`).join('')}
    <div style="width:0.5px;height:38px;background:var(--edge);margin:0 2px"></div>
    <div class="app" style="width:46px;height:46px;background:var(--fill-2);color:var(--text-2);box-shadow:none">${I.trash(24)}</div>
  </div>`]);

// 5. Windows-like, dark: a taskbar, the start button at the left.
screens.push(['windows-like', 'dark', `${wall(true)}
  ${win(70, 40, 700, 480, 'Terminal', 'term', termFor('windows-like'))}
  ${win(330, 90, 860, 580, 'Settings', 'settings', settings('Windows-like', true), { focused: true, hot: true })}
  <div class="panel bottom" style="height:46px;gap:4px;padding:0 8px">
    <div class="pbtn" style="width:38px;height:36px;color:var(--accent)">${I.edel(21)}</div>
    <div class="search" style="height:32px;width:220px;font-size:12.5px">${I.search(14)}<span>Search</span></div>
    <div class="desks" style="margin-left:6px">${[1, 2, 3, 4].map(n => `<div class="desk${n === 1 ? ' on' : n === 3 ? ' busy' : ''}">${n}</div>`).join('')}</div>
    <div style="display:flex;gap:2px;margin-left:auto;margin-right:auto">${['files', 'web', 'term', 'settings', 'mail', 'music'].map((k, i) => `<div class="task${i === 3 ? ' focused' : ''}" style="padding:0 8px;height:38px">${app(k, 24)}${[0, 2, 3].includes(i) ? '<div class="ind"></div>' : ''}</div>`).join('')}</div>
    <div class="tray" style="gap:2px;margin-left:0">
      <div class="seg"><div class="s on">${I.floating(15)}</div><div class="s">${I.tiling(15)}</div></div>
      <div class="pbtn" style="gap:9px;padding:0 9px">${I.wifi(16)}${I.vol(16)}${I.bat(15)}</div>
      <div class="clock" style="padding:0 8px"><b>14:05</b><small>03/10/2026</small></div>
      <div class="pbtn">${I.bell(16)}</div>
    </div>
  </div>`]);

// 6. Tiling, dark: gaps, a title bar with its close button on every tile.
const editor = `<div style="position:absolute;inset:0;background:var(--win);font-family:var(--mono);font-size:12px;line-height:1.7;padding:12px 0;color:var(--text-2)">${[
  ['format', ' = 1'], ['', ''], ['[shell]', ''], ['preset', ' = "tiling"'], ['title_bars', ' = "always"'], ['', ''], ['[appearance]', ''], ['color_scheme', ' = "dark"'], ['accent', ' = "wallpaper"'], ['radius', ' = 10'], ['motion', ' = "full"'], ['', ''], ['[shortcuts]', ''], ['terminal', ' = "Super+Return"'],
].map((l, i) => `<div style="display:flex"><span style="width:38px;text-align:right;padding-right:12px;color:var(--text-3)">${i + 1}</span><span style="color:${l[0].startsWith('[') ? 'var(--accent)' : 'var(--text)'}">${l[0]}</span><span style="color:#d6a271;white-space:pre">${l[1]}</span></div>`).join('')}</div>`;
screens.push(['tiling', 'dark', `${wall(true)}
  <div class="panel top" style="padding:0 8px;gap:8px;height:30px">
    <div class="desks" style="padding:1px">${[1, 2, 3, 4].map(n => `<div class="desk${n === 1 ? ' on' : n === 2 ? ' busy' : ''}" style="height:20px">${n}</div>`).join('')}</div>
    <div class="seg" style="padding:1px"><div class="s" style="height:20px;width:24px">${I.floating(14)}</div><div class="s on" style="height:20px;width:24px">${I.tiling(14)}</div></div>
    <span style="margin-left:8px;color:var(--text-2)">system.toml, Text Editor</span>
    <div class="tray" style="gap:12px;padding-right:6px">${I.wifi(15)}${I.vol(15)}${I.bat(14)}<span style="font-weight:600;font-variant-numeric:tabular-nums">14:05</span></div>
  </div>
  ${win(8, 38, 628, 754, 'Terminal', 'term', termFor('tiling'))}
  ${win(644, 38, 628, 373, 'system.toml', 'text', editor, { focused: true, style: 'box-shadow:0 0 0 1.5px var(--accent),var(--shadow-win)' })}
  ${win(644, 419, 628, 373, 'Pictures', 'files', files())}`]);

// 7. Tablet, light: the Tablet preset tiles by default; larger targets.
function tabletScreen() {
  return `${wall(false)}
  <div style="position:absolute;left:8px;top:8px;right:8px;bottom:60px;display:flex;gap:8px">
    <div class="win focused" style="position:relative;flex:1.35;height:100%">${titlebar('Pictures', 'files', {})}<div class="winbody">${files()}</div></div>
    <div class="win" style="position:relative;flex:1;height:100%">${titlebar('Notes for the release.md', 'text', {})}<div class="winbody" style="padding:22px 26px;line-height:1.6;color:var(--text)"><div style="font-size:20px;font-weight:650;letter-spacing:-0.02em;margin-bottom:10px">Release notes</div><div style="color:var(--text-2)">Workspaces arrive: four on the Classic preset, switched from the panel or with Super+1 to 4. Each one floats or tiles on its own.</div><div style="margin-top:12px;color:var(--text-2)">On a tablet, windows tile by default. The toggle in the panel floats them again.</div></div></div>
  </div>
  <div class="panel bottom" style="height:52px;padding:0 12px;gap:6px">
    <div class="pbtn" style="width:44px;height:40px">${I.edel(22)}</div>
    <div class="desks" style="padding:3px">${[1, 2, 3, 4].map(n => `<div class="desk${n === 1 ? ' on' : n === 2 ? ' busy' : ''}" style="width:34px;height:30px;font-size:13px">${n}</div>`).join('')}</div>
    <div style="display:flex;gap:6px;margin-left:auto;margin-right:auto">${['files', 'text', 'web', 'mail', 'music', 'settings'].map((k, i) => `<div class="task${i === 0 ? ' focused' : ''}" style="height:42px;padding:0 9px">${app(k, 30)}${i < 2 ? '<div class="ind"></div>' : ''}</div>`).join('')}</div>
    <div class="tray" style="margin-left:0;gap:6px">
      <div class="seg" style="padding:3px"><div class="s" style="width:38px;height:30px">${I.floating(18)}</div><div class="s on" style="width:38px;height:30px">${I.tiling(18)}</div></div>
      <div class="pbtn" style="gap:12px;padding:0 12px;height:40px">${I.wifi(18)}${I.vol(18)}${I.bat(17)}</div>
      <div class="clock"><b style="font-size:14px">14:05</b><small>Sat 3 Oct</small></div>
    </div>
  </div>`;
}
screens.push(['tablet', '', `<div style="position:absolute;inset:0;background:linear-gradient(170deg,#dfe3e9,#cfd4dc)"></div>
  <div class="tablet" style="left:80px;top:40px;width:1120px;height:720px"><div class="scr"><div style="position:absolute;left:0;top:0;width:1280px;height:800px;transform:scale(${(1120 - 32) / 1280});transform-origin:0 0">${tabletScreen()}</div></div></div>`]);

// 8. The three effect tiers, side by side.
function tierScene(kind) {
  const flat = kind === 'lite';
  const radius = flat ? 0 : 10;
  const menuBg = kind === 'full' ? 'rgba(250,251,252,.72)' : kind === 'balanced' ? 'rgba(250,251,252,.9)' : '#fafbfc';
  const panelBg = kind === 'full' ? 'rgba(246,247,249,.72)' : kind === 'balanced' ? 'rgba(246,247,249,.9)' : '#eef0f3';
  const blur = kind === 'full' ? 'backdrop-filter:blur(30px) saturate(180%);' : '';
  const pre = kind === 'balanced' ? `<div style="position:absolute;inset:0;overflow:hidden"><div style="position:absolute;left:-30px;right:-30px;bottom:-30px;height:520px;filter:blur(26px);background:linear-gradient(180deg,#9fb2cd,#7d93b5)"></div><div style="position:absolute;inset:0;background:rgba(246,247,249,.62)"></div></div>` : '';
  const edge = flat ? 'box-shadow:0 0 0 1px rgba(20,24,32,.16)' : '';
  return `<div style="position:absolute;top:0;bottom:0;width:426px;overflow:hidden;left:${kind === 'full' ? 0 : kind === 'balanced' ? 427 : 854}px">
    <div style="position:absolute;inset:0;transform:translateX(${kind === 'full' ? 0 : kind === 'balanced' ? -427 : -854}px);width:1280px">${wall(false)}</div>
    <div class="win focused" style="left:40px;top:70px;width:340px;height:300px;border-radius:${radius}px;${flat ? 'box-shadow:0 0 0 1px rgba(20,24,32,.2)' : ''}">${titlebar('Pictures', 'files', {})}<div class="winbody"><div class="thumbs" style="left:14px;right:14px;top:14px;grid-template-columns:repeat(3,1fr)">${pics.slice(0, 6).map(p => `<div class="thumb"><div class="pic" style="background:linear-gradient(160deg,${p[0]});border-radius:${flat ? 0 : 6}px"></div></div>`).join('')}</div></div></div>
    <div style="position:absolute;left:150px;top:200px;width:220px;height:226px;border-radius:${flat ? 0 : 12}px;background:${menuBg};${blur}${flat ? edge : 'box-shadow:var(--shadow-menu)'};padding:6px;overflow:hidden">${pre}<div style="position:relative">${['Open', 'Open with Photos', 'Rename', 'Copy', 'Move to Trash', 'Properties'].map((m, i) => `<div style="height:34px;display:flex;align-items:center;padding:0 12px;border-radius:${flat ? 0 : 6}px;${i === 1 ? 'background:var(--accent);color:#fff' : ''}">${m}</div>`).join('')}</div></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:40px;background:${panelBg};${blur}box-shadow:inset 0 ${flat ? 1 : 0.5}px 0 rgba(20,24,32,${flat ? .16 : .12});display:flex;align-items:center;padding:0 6px;gap:6px;overflow:hidden">${pre}<div style="position:relative;display:flex;align-items:center;gap:4px;width:100%"><div class="pbtn" style="width:34px">${I.edel(18)}</div><div class="desks" style="${flat ? 'border-radius:0' : ''}">${[1, 2, 3].map(n => `<div class="desk${n === 1 ? ' on' : ''}" style="${flat ? 'border-radius:0' : ''}">${n}</div>`).join('')}</div><div class="task focused" style="${flat ? 'border-radius:0' : ''}">${app('files', 20)}<span>Pictures</span><div class="ind"></div></div><div class="clock" style="margin-left:auto"><b>14:05</b><small>Sat 3 Oct</small></div></div></div>
    ${flat ? '' : fillets('bottom', kind === 'full' ? 'rgba(246,247,249,.72)' : 'rgba(232,235,240,.96)', 40)}
    <div class="tag">${kind === 'full' ? 'Full' : kind === 'balanced' ? 'Balanced' : 'Lite'}</div>
  </div>`;
}
screens.push(['tiers', '', `${tierScene('full')}${tierScene('balanced')}${tierScene('lite')}
  <div style="position:absolute;left:426px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.85)"></div>
  <div style="position:absolute;left:853px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.85)"></div>
  ${[['Full', 'Live blur behind menus and the panel, soft layered shadows, rounded corners, springs. For machines with a real GPU.'], ['Balanced', 'The wallpaper is blurred once, when it changes, so menus and the panel show it for free. Shadows and corners stay.'], ['Lite', 'Solid colours, hairlines instead of shadows, square corners, short fades. The same colours, sizes and layout, for old laptops.']].map((c, i) => `<div style="position:absolute;left:${i * 427 + 24}px;top:470px;width:378px;padding:14px 16px;border-radius:${i === 2 ? 0 : 10}px;background:rgba(255,255,255,.86);${i === 2 ? 'box-shadow:0 0 0 1px rgba(20,24,32,.16)' : 'box-shadow:0 0 0 0.5px rgba(20,24,32,.12),0 10px 30px -12px rgba(20,24,32,.25)'};line-height:1.5;color:#2a2e36"><b style="display:block;font-size:14px;margin-bottom:3px;color:#1c1e22">${c[0]}</b>${c[1]}</div>`).join('')}`]);

// 9. Phone: Settings, and the card switcher in the dark.
function phoneSettings() {
  return `<div style="position:absolute;inset:0;background:var(--win-2)"></div>
  <div class="status"><span>14:05</span><span style="display:flex;gap:6px;align-items:center">${I.wifi(16)}${I.bat(15)}</span></div>
  <div style="position:absolute;top:62px;left:18px;right:18px">
    <div style="font-size:28px;font-weight:700;letter-spacing:-0.025em;margin:0 4px 12px">Settings</div>
    <div class="search" style="margin-bottom:18px;height:36px;border-radius:10px">${I.search()}<span>Search</span></div>
    <div class="rows" style="margin-bottom:16px;background:var(--win)">${[['wifi', 'Wi-Fi', 'Home 5G'], ['bt', 'Bluetooth', 'Off'], ['bat', 'Battery', '82 percent']].map(r => `<div class="row" style="height:48px"><div style="display:flex;align-items:center;gap:12px">${I[r[0]](17)}<span>${r[1]}</span></div><div class="drop">${r[2]} ${I.chev}</div></div>`).join('')}</div>
    <div class="rows" style="background:var(--win)">${[['layout', 'Layout', 'Phone, tiling'], ['palette', 'Appearance', 'Automatic'], ['display', 'Display', ''], ['vol', 'Sound', ''], ['update', 'Updates', 'Up to date']].map(r => `<div class="row" style="height:48px"><div style="display:flex;align-items:center;gap:12px">${I[r[0]](17)}<span>${r[1]}</span></div><div class="drop">${r[2]} ${I.chev}</div></div>`).join('')}</div>
  </div>
  <div class="handle"></div>`;
}
function phoneSwitcher() {
  const card = (k, title, body, y, s, z, dim) => `<div style="position:absolute;left:28px;top:${y}px;width:310px;transform:scale(${s});transform-origin:top center;z-index:${z}">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#fff;font-weight:600;font-size:13px">${app(k, 22)}${title}</div>
    <div style="height:470px;border-radius:24px;overflow:hidden;position:relative;background:var(--win);color:var(--text);box-shadow:0 0 0 0.5px rgba(0,0,0,.5),0 -10px 40px -10px rgba(0,0,0,.55)">${body}<div style="position:absolute;inset:0;background:rgba(0,0,0,${dim})"></div></div></div>`;
  const photos = `<div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;align-content:start">${pics.concat(pics).slice(0, 15).map(p => `<div style="aspect-ratio:1;background:linear-gradient(160deg,${p[0]})"></div>`).join('')}</div>`;
  const music = `<div style="padding:24px 20px"><div style="height:200px;border-radius:12px;background:linear-gradient(160deg,#5d6f96,#2f3a58)"></div><div style="font-size:18px;font-weight:650;margin-top:16px">Morning dunes</div><div style="color:var(--text-2)">Edel Ensemble</div></div>`;
  const set = `<div style="padding:22px 18px"><div style="font-size:22px;font-weight:700;margin-bottom:12px">Settings</div>${['Wi-Fi', 'Bluetooth', 'Battery', 'Layout', 'Appearance', 'Display', 'Sound'].map(n => `<div style="height:44px;border-bottom:0.5px solid var(--line);display:flex;align-items:center;justify-content:space-between">${n}<span style="color:var(--text-3)">${I.chev}</span></div>`).join('')}</div>`;
  return `${wall(true)}<div style="position:absolute;inset:0;background:rgba(5,7,12,.35)"></div>
  <div class="status" style="color:#fff"><span>14:06</span><span style="display:flex;gap:6px;align-items:center">${I.wifi(16)}${I.bat(15)}</span></div>
  ${card('music', 'Music', music, 70, 0.84, 1, 0.35)}
  ${card('photos', 'Photos', photos, 140, 0.92, 2, 0.18)}
  ${card('settings', 'Settings', set, 220, 1, 3, 0)}
  <div class="handle" style="background:#fff"></div>`;
}
screens.push(['phone', '', `<div style="position:absolute;inset:0;background:linear-gradient(170deg,#dfe3e9,#cfd4dc)"></div>
  <div class="phone" style="left:150px;top:20px;transform:scale(.9);transform-origin:top center"><div class="scr">${phoneSettings()}</div></div>
  <div class="phone dark" style="left:740px;top:20px;transform:scale(.9);transform-origin:top center"><div class="scr">${phoneSwitcher()}</div></div>`]);

document.getElementById('host').innerHTML = screens.map(([id, cls, html]) => `<div class="screen ${cls}" id="${id}">${html}</div>`).join('');
</script>
</body>
</html>
