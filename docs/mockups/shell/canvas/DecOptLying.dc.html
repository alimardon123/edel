<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sliders lying in the grid, player inside, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#a9c3ff}
.scr{position:relative;width:390px;height:844px;overflow:hidden;border-radius:46px;font-family:Inter,system-ui,sans-serif;color:#eceef2;-webkit-font-smoothing:antialiased;background:radial-gradient(90% 60% at 20% 10%,#2b3a63 0%,#151a2a 60%,#0d1019 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.sheet{position:absolute;left:8px;right:8px;top:8px;border-radius:38px;padding:18px 14px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;background:rgba(28,31,39,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 60px -16px rgba(0,0,0,.7)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:88px 88px 88px 88px 60px 60px;gap:8px}
.pill{border:0;border-radius:40px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;padding:0 12px 0 10px;text-align:left;font:inherit;color:inherit;grid-column:span 2}
.pill .i{width:46px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);flex:none}
.pill.on{background:#a9c3ff;color:#0e1a33}
.pill.on .i{background:rgba(14,26,51,.12)}
.n{font-size:14px;font-weight:600;line-height:1.15}
.s{font-size:12px;opacity:.7}
.r{border:0;background:transparent;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.r .o{width:60px;height:60px;border-radius:30px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.09)}
.r.on .o{background:#a9c3ff;color:#0e1a33}
.r span.l{font-size:11px;font-weight:500;opacity:.78}
.hs{grid-column:span 4;display:flex;gap:10px;align-items:center}
.cap{flex:1;height:60px;border-radius:30px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.cap i{position:absolute;left:0;top:0;bottom:0;border-radius:30px;background:#eceef2}
.cap svg{position:absolute;left:19px;top:20px}
.cap b{position:absolute;right:16px;top:0;bottom:0;display:flex;align-items:center;font-size:13px;font-weight:600;color:#9aa0aa;font-variant-numeric:tabular-nums}
.more{width:60px;height:60px;border-radius:30px;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);color:#eceef2;flex:none}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#eceef2;padding:0}
/* unit grid */
.sheet{border-radius:50px;padding-left:16px !important;padding-right:16px !important}
.grid{grid-template-columns:repeat(4,69px) !important;grid-auto-rows:69px !important;grid-template-rows:none !important;gap:22px !important;justify-content:center;margin-bottom:22px}
.r{display:block !important;position:relative;height:69px;width:69px}
.r .o{position:absolute;left:0;top:0;width:69px !important;height:69px !important;border-radius:34px !important}
.r span.l{position:absolute;top:73px;left:-12px;right:-12px;text-align:center;white-space:nowrap;font-size:11px;line-height:1}
.pill{height:69px;border-radius:34px !important;padding:0 14px 0 9px !important;gap:10px !important}
.pill .i{width:51px !important;height:51px !important;border-radius:25px !important}
.grp{margin:0;padding:0 !important;background:transparent !important;box-shadow:none !important;display:grid !important;grid-template-columns:repeat(2,69px) !important;grid-template-rows:repeat(2,69px) !important;gap:22px !important;align-items:start !important;justify-items:start !important}
.grp .r{display:block !important;height:69px;width:69px}
.grp .r .o{width:69px !important;height:69px !important;border-radius:34px !important}
.grp .r span.l{position:absolute;top:73px}
.grp .r:not(.on) .o{background:rgba(255,255,255,.9) !important;box-shadow:0 0 0 .5px rgba(20,22,28,.06),0 1px 2px rgba(20,22,28,.06) !important}
.vs{width:69px !important;border-radius:34px !important;overflow:visible !important}
.vs i{border-radius:0 0 34px 34px}
.vs:after{content:attr(aria-label);position:absolute;top:calc(100% + 4px);left:-12px;right:-12px;text-align:center;white-space:nowrap;font-size:11px;line-height:1;font-weight:500;color:#3b4048}
.vs svg.ic{left:50% !important;margin-left:-10px;bottom:21px !important}
.vs .more{width:61px !important;height:61px !important;border-radius:30px !important}
.hs{gap:22px !important}
.cap{height:69px !important;border-radius:34px !important}
.cap i{border-radius:34px !important}
.cap svg{top:24px !important;left:21px !important}
.hs .more{width:69px !important;height:69px !important;border-radius:34px !important}
.play{height:69px;border-radius:34px !important}
.tile{border-radius:34px !important}
/* header actions */
.head{display:flex;flex-direction:column;gap:2px;padding:0 4px 0 6px;font-variant-numeric:tabular-nums}
.head .l1,.head .l2{display:flex;align-items:center;justify-content:space-between}
.head .acts{display:flex;gap:10px}
.head .acts .ib{width:32px !important;height:32px !important;border-radius:16px !important;background:rgba(255,255,255,.07) !important}
.head .acts .ib svg{width:15px;height:15px}
.head .bat{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.head .date{font-size:13px;opacity:.62}
.dots{display:flex;justify-content:center;gap:5px;margin:-8px 0 2px}
.dots i{display:block}
.pill .s,.pill .n{white-space:nowrap}
/* dark slider icons */
.cap svg{color:#1c1f27}
.shelf{position:relative;display:flex;flex-direction:column;gap:12px;padding:20px 0 4px}
.shelf:before{content:"";position:absolute;top:0;left:10px;right:10px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14) 18%,rgba(255,255,255,.14) 82%,transparent)}
.shelf .hs{display:flex;align-items:center;gap:12px !important}
.pill .chev{margin-left:auto;display:flex;opacity:.75}
</style>
</helmet>
<div class="scr">
  <div class="sheet">
    <div class="head"><div class="l1"><span style="font-size:30px;font-weight:600;letter-spacing:-.02em">14:05</span><span class="bat" aria-label="Battery 82 percent">82%<svg width="24" height="13" viewBox="0 0 28 15" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1" y="1.5" width="22" height="12" rx="3.6"/><rect x="3.4" y="3.9" width="14.6" height="7.2" rx="1.6" fill="currentColor" stroke="none"/><path d="M25.4 5.8v3.4" stroke-linecap="round"/></svg></span></div><div class="l2"><span class="date">Sat 3 Oct</span><span class="acts"><button class="ib" aria-label="Edit"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button><button class="ib" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l1.7 2.4 2.9-.5.9 2.8 2.7 1.2-.6 2.9 1.6 2.4-2.3 1.8.1 2.9-2.9.4-1.3 2.6L12 21.2l-2.7.9-1.3-2.6-2.9-.4.1-2.9-2.3-1.8 1.6-2.4-.6-2.9 2.7-1.2.9-2.8 2.9.5z"/></svg></button><button class="ib" aria-label="Power: lock, log out, restart or power off"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button></span></div></div>
    <div class="grid">
      <button class="pill on" aria-label="Wi-Fi, on, Home 5G"><span class="i"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.6 16a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19.2" r="1.1" fill="currentColor" stroke="none"/></svg></span><span><div class="n">Wi-Fi</div><div class="s">Home 5G</div></span><span class="chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></button>
      <button class="pill on" aria-label="Mobile data, on"><span class="i"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="14" width="3.2" height="6" rx="1"/><rect x="8.3" y="10.5" width="3.2" height="9.5" rx="1"/><rect x="13.6" y="7" width="3.2" height="13" rx="1"/><rect x="18.9" y="3.5" width="3.2" height="16.5" rx="1" opacity=".4"/></svg></span><span><div class="n">Mobile</div><div class="s">5G</div></span><span class="chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></button>
      <div style="grid-column:span 2;grid-row:span 2;border-radius:36px;padding:14px 12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;background:linear-gradient(160deg,#4a3a6e,#6b4a6b 60%,#8a5a58)" role="group" aria-label="Now playing">
        <span style="width:46px;height:46px;border-radius:23px;flex:none;background:linear-gradient(180deg,#2b2346 0%,#6d4f8f 55%,#f0a47a 100%);box-shadow:0 4px 14px rgba(0,0,0,.35)"></span>
        <span><div class="n">Night Drive</div><div class="s">Lumen</div></span>
        <div style="display:flex;justify-content:center;align-items:center;gap:12px">
          <button class="ib" aria-label="Previous" style="width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.12)"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5.5v13L9.5 12z"/></svg></button>
          <button class="ib" aria-label="Pause" style="width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.92);color:#2a1f3d"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
          <button class="ib" aria-label="Next" style="width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.12)"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.5v13L14.5 12z"/></svg></button>
        </div>
      </div>
      <button class="r on" aria-label="Bluetooth, on"><span class="o"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg></span><span class="l">Bluetooth</span></button>
      <button class="r" aria-label="Airplane mode, off"><span class="o"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M10.5 3.8c0-1 .7-1.8 1.5-1.8s1.5.8 1.5 1.8V9l7.5 4.5v2L13.5 13v5l2.5 2v1.5L12 20.5l-4 1V20l2.5-2v-5L3 15.5v-2L10.5 9z"/></svg></span><span class="l">Airplane</span></button>
      <button class="r on" aria-label="Do not disturb, on"><span class="o"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></span><span class="l">Do not disturb</span></button>
      <button class="r" aria-label="Torch, off"><span class="o"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M7 3h10v4l-3 4v10h-4V11L7 7z"/></svg></span><span class="l">Torch</span></button>
      <button class="r on" aria-label="Rotation lock, on"><span class="o"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4.5h-4.5"/></svg></span><span class="l">Rotation</span></button>
      <button class="r" aria-label="Hotspot, off"><span class="o"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M8.2 15.8a5.4 5.4 0 0 1 0-7.6M15.8 8.2a5.4 5.4 0 0 1 0 7.6"/></svg></span><span class="l">Hotspot</span></button>
      <button class="r" aria-label="Screen recording, off"><span class="o"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg></span><span class="l">Record</span></button>
      <button class="r" aria-label="Night light, off"><span class="o"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 7v-3M6.3 9.3L4.2 7.2M17.7 9.3l2.1-2.1M3 15h3M18 15h3M7 15a5 5 0 0 1 10 0M4 19h16"/></svg></span><span class="l">Night</span></button>
    </div>
    <div class="dots" aria-label="Page 1 of 2"><i style="width:14px;height:5px;border-radius:3px;background:#eceef2"></i><i style="width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)"></i></div>
    <div class="shelf" role="group" aria-label="Pinned">
      <div class="hs"><div class="cap" role="slider" aria-label="Brightness" aria-valuenow="62"><i style="width:62%"></i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><b>62</b></div></div>
      <div class="hs"><div class="cap" role="slider" aria-label="Volume" aria-valuenow="48"><i style="width:48%"></i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/></svg><b>48</b></div><button class="more" aria-label="Sound: outputs, apps and microphone"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
    </div>
  </div>
  <div style="position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.55)"></div>
</div>
</x-dc>

</html>
