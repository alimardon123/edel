body{margin:0}

.scr{position:relative;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#17191d;-webkit-font-smoothing:antialiased;background:radial-gradient(70% 60% at 85% 15%,#e8dccd 0%,rgba(232,220,205,0) 60%),radial-gradient(70% 70% at 10% 90%,#c7d4e6 0%,rgba(199,212,230,0) 60%),#dde0e5}

.card{border-radius:30px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.hd h4{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em}

.dnd .t{flex:1;min-width:0}
