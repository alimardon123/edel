<helmet>

<style>
body{margin:0}
.glass{background:rgba(242,243,246,.84);backdrop-filter:blur(32px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 0 0 .5px rgba(20,22,28,.09),0 22px 54px -18px rgba(28,34,48,.42)}
.card{width:352px;border-radius:24px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(4,64px);grid-auto-rows:64px;gap:8px}
.pill{border:0;border-radius:32px;background:rgba(255,255,255,.9);box-shadow:0 0 0 .5px rgba(20,22,28,.05);display:flex;align-items:center;gap:8px;padding:0 10px 0 8px;text-align:left;font:inherit;color:inherit;grid-column:span 2}
.pill .i{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:#eceef2;flex:none}
.pill.on{background:#2459c9;color:#fff}
.pill.on .i{background:rgba(255,255,255,.18)}
.n{font-size:12.5px;font-weight:600;line-height:1.15}
.s{font-size:11px;opacity:.68}
.r{border:0;background:transparent;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.r .o{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);box-shadow:0 0 0 .5px rgba(20,22,28,.06),0 1px 2px rgba(20,22,28,.06);color:#2b2f36}
.r.on .o{background:#2459c9;color:#fff;box-shadow:0 4px 12px -4px rgba(36,89,201,.6)}
.r span.l{font-size:10.5px;font-weight:500;color:#3b4048}
.grp{grid-column:span 2;grid-row:span 2;border-radius:22px;background:rgba(255,255,255,.62);box-shadow:0 0 0 .5px rgba(20,22,28,.05);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:center;justify-items:center;padding:4px}
.grp .r .o{width:38px;height:38px;border-radius:19px;background:#eceef2;box-shadow:none}
.grp .r.on .o{background:#2459c9}
.vs{grid-row:span 2;width:44px;justify-self:center;border-radius:22px;background:rgba(20,22,28,.07);position:relative;overflow:hidden}
.vs i{position:absolute;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -1px 3px rgba(20,22,28,.12)}
.vs svg.ic{position:absolute;left:13px;bottom:13px}
.more{width:36px;height:36px;border-radius:18px;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:#fff;color:#17191d;box-shadow:0 0 0 .5px rgba(20,22,28,.08),0 1px 2px rgba(20,22,28,.08)}
.ib{width:28px;height:28px;border-radius:14px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#2b2f36;padding:0}
/* unit grid */
.card{border-radius:50px;padding-left:18px !important;padding-right:18px !important}
.grid{grid-template-columns:repeat(4,64px) !important;grid-auto-rows:64px !important;grid-template-rows:none !important;gap:20px !important;justify-content:center;margin-bottom:20px}
.r{display:block !important;position:relative;height:64px;width:64px}
.r .o{position:absolute;left:0;top:0;width:64px !important;height:64px !important;border-radius:32px !important}
.r span.l{position:absolute;top:68px;left:-12px;right:-12px;text-align:center;white-space:nowrap;font-size:10.5px;line-height:1}
.pill{height:64px;border-radius:32px !important;padding:0 13px 0 8px !important;gap:9px !important}
.pill .i{width:48px !important;height:48px !important;border-radius:24px !important}
.grp{margin:0;padding:0 !important;background:transparent !important;box-shadow:none !important;display:grid !important;grid-template-columns:repeat(2,64px) !important;grid-template-rows:repeat(2,64px) !important;gap:20px !important;align-items:start !important;justify-items:start !important}
.grp .r{display:block !important;height:64px;width:64px}
.grp .r .o{width:64px !important;height:64px !important;border-radius:32px !important}
.grp .r span.l{position:absolute;top:68px}
.grp .r:not(.on) .o{background:rgba(255,255,255,.9) !important;box-shadow:0 0 0 .5px rgba(20,22,28,.06),0 1px 2px rgba(20,22,28,.06) !important}
.vs{width:64px !important;border-radius:32px !important;overflow:visible !important}
.vs i{border-radius:0 0 32px 32px}
.vs:after{content:attr(aria-label);position:absolute;top:calc(100% + 4px);left:-12px;right:-12px;text-align:center;white-space:nowrap;font-size:10.5px;line-height:1;font-weight:500;color:#3b4048}
.vs svg.ic{left:50% !important;margin-left:-10px;bottom:19px !important}
.vs .more{width:56px !important;height:56px !important;border-radius:28px !important}
.hs{gap:20px !important}
.cap{height:64px !important;border-radius:32px !important}
.cap i{border-radius:32px !important}
.cap svg{top:22px !important;left:19px !important}
.hs .more{width:64px !important;height:64px !important;border-radius:32px !important}
.play{height:64px;border-radius:32px !important}
.tile{border-radius:32px !important}
.card{padding-bottom:18px !important}
.pill{padding:0 10px 0 8px !important;gap:6px !important}
.pill > span:nth-child(2){min-width:0;overflow:hidden}
.pill .chev svg{width:12px;height:12px}
.pill .i{width:38px !important;height:38px !important;border-radius:19px !important}
.pill .n{font-size:12.5px;white-space:nowrap}
.pill .s{font-size:11px;white-space:nowrap}
.card > div:last-child{display:grid !important;grid-template-columns:148px 148px;column-gap:20px;justify-content:center;padding:0 !important}
.card > div:last-child .s{height:36px;box-sizing:border-box;padding:0 12px !important;gap:7px !important;border-radius:18px;background:rgba(20,22,28,.05);opacity:1 !important;color:#3b4048;font-size:11.5px;white-space:nowrap}
.card > div:last-child .s b{font-weight:600;color:#17191d}
.card > div:last-child .s em{font-style:normal;color:#6b7079}
.card > div:last-child > span:last-child{margin-left:0 !important;display:flex !important;justify-content:space-between;align-items:center;padding:0 14px}
.card > div:last-child .ib{width:36px;height:36px;border-radius:18px;background:rgba(20,22,28,.05)}
.wsv{width:94px;overflow:hidden;padding:4px 0;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 16px),transparent 100%)}
.wsr{display:flex;gap:4px;align-items:center;width:max-content}
.wp{height:24px;min-width:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;color:#3b4048;background:rgba(20,22,28,.07);box-sizing:border-box;padding:0 6px}
.wp.e{color:#9aa0aa;background:transparent;box-shadow:inset 0 0 0 1px rgba(20,22,28,.12)}
.wp.on{min-width:38px;background:#2459c9;color:#fff;box-shadow:0 3px 10px -4px rgba(36,89,201,.7)}
.wch{width:18px;height:24px;display:flex;align-items:center;justify-content:center;color:#5b6069}
.wch.off{opacity:.2}
.btn{height:28px;min-width:28px;border-radius:14px;border:0;display:flex;align-items:center;justify-content:center;background:rgba(20,22,28,.07);color:#2b2f36;padding:0;font:inherit}
.sep{width:1px;height:20px;background:rgba(20,22,28,.12);margin:0 4px}
.task{height:30px;border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;font-weight:500;position:relative}
.task.on{background:rgba(20,22,28,.06)}
.task.on:after{content:"";position:absolute;left:12px;right:12px;bottom:1px;height:2px;border-radius:1px;background:#2459c9}
.arw{width:26px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#3b4048}
.stp{height:28px;border-radius:14px;display:flex;align-items:center;gap:7px;padding:0 10px;background:#2459c9;color:#fff}
.win{position:absolute;border-radius:12px;overflow:hidden;background:#fbfbfc;box-shadow:0 0 0 .5px rgba(20,22,28,.14),0 18px 44px -18px rgba(16,24,40,.45)}
.tb{height:34px;display:flex;align-items:center;padding:0 8px 0 14px;font-size:12px;font-weight:600;background:#f1f2f5;border-bottom:.5px solid rgba(20,22,28,.08)}
.tb .x{margin-left:auto;display:flex;gap:6px}
.tb .x i{width:22px;height:22px;border-radius:11px;background:rgba(20,22,28,.06);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#5b6069}
.ln{height:9px;border-radius:5px;background:rgba(20,22,28,.07);margin:10px 16px}

.win{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(20,24,32,.14) !important;border-radius:0 !important;overflow:hidden}
.win .bar28{height:28px;position:relative;display:flex;align-items:center;justify-content:center;gap:7px;background:#f1f2f4;box-shadow:inset 0 -1px 0 rgba(20,24,32,.09);font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:400;color:#8d929b}
.win.focused .bar28{background:#f7f8f9;color:#1c1e22}
.win .bar28 .btns{position:absolute;right:0;top:0;display:flex}
.win .bar28 .btns span{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.win .ln{height:9px;border-radius:5px;background:rgba(20,22,28,.07);margin:10px 16px}

.scr{position:relative;width:1280px;height:800px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#17191d;-webkit-font-smoothing:antialiased;background:radial-gradient(70% 60% at 85% 15%,#e8dccd 0%,rgba(232,220,205,0) 60%),radial-gradient(70% 70% at 10% 90%,#c7d4e6 0%,rgba(199,212,230,0) 60%),#dde0e5}
.bar{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;background:rgba(246,247,249,.94);backdrop-filter:blur(20px);box-shadow:0 -.5px 0 rgba(20,22,28,.1)}

.dots{display:flex;justify-content:center;gap:5px;margin:2px 0 0}
.dots i{display:block}
.shelf{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px 0 2px}
.shelf:before{content:"";position:absolute;top:0;left:10px;right:10px;height:1px;background:linear-gradient(90deg,transparent,rgba(20,22,28,.14) 18%,rgba(20,22,28,.14) 82%,transparent)}
.shelf .hs{display:flex;align-items:center;gap:10px !important}
.shelf .cap{flex:1;height:36px !important;border-radius:18px !important;position:relative;overflow:hidden;background:rgba(20,22,28,.07)}
.shelf .cap i{position:absolute;left:0;top:0;bottom:0;border-radius:18px !important;background:#fff;box-shadow:0 1px 3px rgba(20,22,28,.14)}
.shelf .cap svg{position:absolute;top:9px !important;left:13px !important;color:#2b2f36}
.shelf .cap b{position:absolute;right:14px;top:0;bottom:0;display:flex;align-items:center;font-size:11.5px;font-weight:600;color:#5b6069;font-variant-numeric:tabular-nums}
.shelf .more{width:36px !important;height:36px !important;border-radius:18px !important;flex:none;background:#fff;color:#17191d;box-shadow:0 0 0 .5px rgba(20,22,28,.08),0 1px 2px rgba(20,22,28,.08)}
/* even rows */
.grid{grid-auto-rows:auto !important;row-gap:10px !important;margin-bottom:6px !important}
.grid > .r{height:74px !important}
.pill .s,.pill .n{white-space:nowrap}
.pill .chev{margin-left:auto;display:flex;opacity:.75}
</style>
</helmet>

="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 2.5L11.5 11.5M2.5 11.5L11.5 2.5"/></svg></span></span></div><div class="ln" style="width:90%"></div><div class="ln" style="width:77%"></div><div class="ln" style="width:64%"></div><div class="ln" style="width:51%"></div><div class="ln" style="width:88%"></div><div class="ln" style="width:75%"></div></div><div style="position:absolute;right:12px;bottom:50px;display:flex;flex-direction:column;gap:8px">

      <span style="width:64px;height:64px;border-radius:32px;flex:none;background:linear-gradient(180deg,#2b2346 0%,#6d4f8f 55%,#f0a47a 100%)"></span>
