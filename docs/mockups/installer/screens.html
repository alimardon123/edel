<!doctype html>
<html><head><meta charset="utf-8"><title>Installer mockups, second round</title>
<style>
:root{--glass:#b4c8ff24;--rim:#ffffff29;--text:#f4f6fa;--dim:#c3cbe0;--faint:#8e98b3;--ok:#7fdc96;--amber:#f5a524}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:Inter,sans-serif;color:var(--text)}
.i{width:16px;height:16px;flex:none}
.s{width:1280px;height:800px;position:relative;overflow:hidden;margin-bottom:20px;
 background:radial-gradient(700px 420px at 72% 32%,#3f63c099,transparent 70%),radial-gradient(600px 300px at 30% 80%,#5a3f8a66,transparent 70%),linear-gradient(#141c38,#1b2142 60%,#251f45)}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 10% 20%,#fff9,transparent),radial-gradient(1px 1px at 30% 60%,#fff6,transparent),radial-gradient(1px 1px at 55% 15%,#fff8,transparent),radial-gradient(1px 1px at 80% 70%,#fff6,transparent),radial-gradient(1px 1px at 90% 10%,#fff9,transparent),radial-gradient(1px 1px at 65% 85%,#fff5,transparent),radial-gradient(1px 1px at 15% 85%,#fff7,transparent)}
.panel{position:absolute;left:0;right:0;bottom:0;height:52px;background:#2a3870cc;border-top:1px solid #ffffff22;display:flex;align-items:center;padding:0 14px;gap:8px;backdrop-filter:blur(16px)}
.pbtn{height:38px;border-radius:12px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:14px;background:#ffffff14}
.pbtn.inst{background:linear-gradient(135deg,#7ea9ffaa,#4a7de8aa);border:1px solid #9bbcff88}
.pbtn .i{width:18px;height:18px}
.ws{margin-left:auto;display:flex;background:#ffffff14;border-radius:50px;padding:3px;font-size:13px}
.ws span{padding:5px 11px;border-radius:50px}.ws .on{background:#4a7de8}
.clock{text-align:right;font-size:13px;line-height:1.3;margin-left:12px}
.tray{display:flex;gap:10px;padding:8px 14px;border-radius:50px;background:#4a7de8;margin-left:10px}
.desk-icon{position:absolute;top:28px;left:28px;width:96px;text-align:center;font-size:13px;line-height:1.3;text-shadow:0 1px 3px #000}
.desk-icon .big{width:64px;height:64px;margin:0 auto 8px;border-radius:18px;background:linear-gradient(135deg,#7ea9ff,#3d6fe0);box-shadow:0 8px 24px #0006}
.desk-icon .big .i{width:34px;height:34px;color:#fff}
/* the installer's window */
.win{position:absolute;left:140px;top:34px;width:1000px;height:676px;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px #000a,0 0 0 1px #0009}
.tb{height:44px;background:#2b2e36;display:flex;align-items:center;justify-content:center;font-size:14px;gap:8px;position:relative}
.tb .icon{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#7ea9ff,#3d6fe0);display:flex;align-items:center;justify-content:center}
.tb .icon .i{width:14px;height:14px}
.tb .btns{position:absolute;right:14px;display:flex;gap:18px;color:#c3c9d4}
.body{position:relative;height:632px;background:radial-gradient(420px 300px at 18% 10%,#56688f88,transparent 70%),radial-gradient(380px 280px at 92% 40%,#45407988,transparent 70%),linear-gradient(#2f3c5e,#1f2b48 60%,#1a2440)}
.steps{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.step{padding:5px 12px;border-radius:50px;font-size:12.5px;color:var(--faint);background:#ffffff0a;border:1px solid #ffffff12;display:flex;gap:5px;align-items:center}
.step.on{color:var(--text);background:var(--glass);border-color:var(--rim)}
.step.done{color:var(--dim)}.step.done .i{width:12px;height:12px;color:var(--ok)}
.content{position:absolute;top:70px;left:0;right:0;bottom:84px;display:flex;flex-direction:column;align-items:center}
.foot{position:absolute;bottom:24px;left:32px;right:32px;display:flex;align-items:center;gap:12px}
.foot .grow{flex:1}
.foot .note{font-size:12.5px;color:var(--faint)}
h1{font-weight:200;font-size:52px;letter-spacing:-1px}
h2{font-weight:300;font-size:34px;letter-spacing:-.5px}
.sub{color:var(--dim);font-size:14.5px;margin-top:8px;text-align:center;line-height:1.5}
.card{background:var(--glass);border:1px solid var(--rim);border-radius:20px;box-shadow:0 16px 40px #0003}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid #ffffff12;font-size:14.5px}
.row:first-child{border-top:none}
.row .k{color:var(--dim);width:140px}.row .v{flex:1}.row .ch{color:var(--faint);font-size:13px}
.row .link{color:#9bbcff;font-size:13px}
.small{font-size:12.5px;color:var(--dim);margin-top:3px}
.btn{white-space:nowrap;border-radius:50px;padding:11px 24px;font-size:14.5px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.pri{background:linear-gradient(135deg,#7ea9ff,#4a7de8);color:#fff;box-shadow:0 8px 24px #4a7de855}
.sec{background:var(--glass);border:1px solid var(--rim);font-weight:500}
.ghost{color:var(--dim);font-weight:500;padding:11px 12px}
.field{background:#ffffff14;border:1px solid var(--rim);border-radius:50px;padding:11px 18px;font-size:14.5px;width:100%;display:flex;gap:10px;align-items:center}
.field.ph{color:var(--faint)}
.label{font-size:12.5px;color:var(--dim);margin:0 0 6px 16px}
.hint{font-size:12.5px;color:var(--faint);margin:6px 0 0 16px}
.hint.ok{color:var(--ok)}
.chip{white-space:nowrap;padding:8px 14px;border-radius:50px;background:#ffffff10;border:1px solid #ffffff1a;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:linear-gradient(135deg,#7ea9ffcc,#4a7de8cc);border-color:#9bbcff}
.switch{width:42px;height:24px;border-radius:12px;background:linear-gradient(135deg,#7ea9ff,#4a7de8);position:relative;flex:none}
.switch:after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.switch.off{background:#ffffff26}.switch.off:after{right:auto;left:3px}
.mono{font-family:"DejaVu Sans Mono",monospace;font-size:12.5px}
.tile{border-radius:18px;padding:16px;background:var(--glass);border:1px solid var(--rim)}
.tile.sel{border:2px solid #9bbcff;background:#b4c8ff33}
.tile.off{opacity:.45}
.tile .t{font-size:15px;font-weight:600;margin-top:10px}
.tile .d{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.ico{width:40px;height:40px;border-radius:12px;background:#ffffff14;display:flex;align-items:center;justify-content:center}
.ico .i{width:22px;height:22px}
.av .i{width:34px;height:34px;color:#fff}.av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#7ea9ff,#3d6fe0);border:3px solid #ffffff40;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600}
.warn{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:16px;background:#f5a52418;border:1px solid #f5a52455;font-size:14px;line-height:1.5;color:#ffe2b0}
.warn .i{color:var(--amber);margin-top:2px}
.bar{height:8px;border-radius:4px;background:#ffffff1a;overflow:hidden;width:460px}
.bar b{display:block;height:100%;width:64%;background:linear-gradient(90deg,#7ea9ff,#4a7de8)}
.preset{width:150px}
.preset .pic{height:80px;border-radius:10px;background:linear-gradient(#3a4f8a,#24305a);position:relative;overflow:hidden}
.preset .pic i{position:absolute;background:#ffffff40;border-radius:3px}
.map{width:560px;height:200px;border-radius:16px;overflow:hidden;position:relative;background:#16203d}
.scrim{position:absolute;inset:0;background:#0007}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;padding:26px;border-radius:24px;background:#2a3456f2;border:1px solid var(--rim);box-shadow:0 30px 80px #000a;text-align:center}
.term{position:absolute;left:520px;top:300px;width:700px;height:380px;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px #000a,0 0 0 1px #0009}
.term .b{background:#1e2026;height:336px;padding:14px 16px;line-height:1.7;color:#eceef1}
.cap{position:absolute;left:0;right:0;bottom:-1px}
</style></head><body>
<div id="out"></div>

<script>
const STEPS=['Language','Region','Internet','You','Look','Disk','Review'];
function steps(cur){const i=STEPS.indexOf(cur);if(i<0)return '';return '<div class="steps">'+STEPS.map((s,n)=>`<span class="step ${n<i?'done':n==i?'on':''}">${n<i?'<svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"> <path d="M3.5 8.25L6.75 11.5L12.5 4.75"/> </svg>':''}${s}</span>`).join('')+'</div>';}
const desktop=(inner)=>`<div class="stars"></div>${inner}<div class="panel"><div class="pbtn"><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="-1.5 -1.5 18 18"> <rect x="0" y="0" width="6" height="6" rx="1.8"/> <rect x="9" y="0" width="6" height="6" rx="1.8"/> <rect x="0" y="9" width="6" height="6" rx="1.8"/> <rect x="9" y="9" width="6" height="6" rx="1.8"/> </svg></div><div class="pbtn inst"><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="M8 1.75V8.25"/> <path d="M5.25 5.75L8 8.5L10.75 5.75"/> <rect x="2" y="10" width="12" height="4.25" rx="1.25"/> <path d="M11 12.1H11.01"/> </svg> Install Edel OS</div><div class="pbtn"><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"> <path d="M3.5 7a1.5 1.5 0 0 1 1.5-1.5h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z"/> <path d="M3.5 10.5h17"/> </svg> Files</div><div class="pbtn"><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"> <circle cx="12" cy="12" r="3"/> <path d="M12 2.8l1.6 2.4 2.8-.6.6 2.8 2.4 1.6-1.2 2.6 1.2 2.6-2.4 1.6-.6 2.8-2.8-.6-1.6 2.4-1.6-2.4-2.8.6-.6-2.8-2.4-1.6 1.2-2.6-1.2-2.6 2.4-1.6.6-2.8 2.8.6z"/> </svg> Settings</div><div class="ws"><span>1</span><span class="on">2</span><span>3</span><span>4</span></div><div class="tray"><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"> <path d="M3 9.5a13 13 0 0 1 18 0"/> <path d="M6 12.8a8.5 8.5 0 0 1 12 0"/> <path d="M9 16a4 4 0 0 1 6 0"/> <circle cx="12" cy="19" r="1" fill="currentColor"/> </svg><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"> <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/> <path d="M15.5 9a4.5 4.5 0 0 1 0 6"/> <path d="M18 6.5a8 8 0 0 1 0 11" stroke-opacity=".3"/> </svg><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"> <rect x="1.8" y="7" width="18.4" height="10" rx="2.6" stroke-width="1.5"/> <path d="M22.4 10.4v3.2" stroke-width="1.5"/> </svg></div><div class="clock">14:05<br><span style="color:var(--dim)">Sun 1 Nov</span></div></div>`;
const win=(body,title='Install Edel OS')=>`<div class="win"><div class="tb"><span class="icon"><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="M8 1.75V8.25"/> <path d="M5.25 5.75L8 8.5L10.75 5.75"/> <rect x="2" y="10" width="12" height="4.25" rx="1.25"/> <path d="M11 12.1H11.01"/> </svg></span>${title}<span class="btns"><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"> <path d="M2.5 7H11.5"/> </svg><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1"> <rect x="2.5" y="2.5" width="9" height="9"/> </svg><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"> <path d="M2.5 2.5L11.5 11.5M2.5 11.5L11.5 2.5"/> </svg></span></div><div class="body">${body}</div></div>`;
const TERM=`<div class="term"><div class="tb"><span class="icon" style="background:#3a3e48"><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"> <path d="M8.5 7.5 4 12l4.5 4.5"/> <path d="M15.5 7.5 20 12l-4.5 4.5"/> <path d="M13.5 5.5l-3 13"/> </svg></span>Terminal<span class="btns"><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"> <path d="M2.5 7H11.5"/> </svg><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1"> <rect x="2.5" y="2.5" width="9" height="9"/> </svg><svg class="i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"> <path d="M2.5 2.5L11.5 11.5M2.5 11.5L11.5 2.5"/> </svg></span></div><div class="b mono">live@edel:~$ doas edel install --list<br>nvme0n1  512 GB  Samsung SSD 970  Windows 11<br>sda      1 TB    WD Blue          empty<br>sdb      32 GB   SanDisk Ultra    this stick, not offered<br>live@edel:~$ doas edel install nvme0n1 --settings answers.toml --encrypt<br>Type nvme0n1 to erase it and install, or anything else to stop: <span style="background:#5b8ef5">&nbsp;</span></div></div>`;
const src=document.getElementById('screens').textContent.split('@@').slice(1);
let html='';
for(const part of src){const nl=part.indexOf('\n');const [id,step]=part.slice(0,nl).trim().split('|');let body=part.slice(nl+1);if(id==='terminal'){body=src.find(x=>x.startsWith('one-page')).split('\n').slice(1).join('\n');}
 if(id==='live-desktop'){html+=`<section class="s" id="${id}">${body}</section>`;continue;}
 let inner=win((step==='All on one page'?'<div class="steps"><span class="step on">All on one page</span></div>':steps(step))+body);
 if(id==='terminal'){inner+=TERM;}
 html+=`<section class="s" id="${id}">${desktop(inner)}</section>`;}
document.getElementById('out').innerHTML=html;
</script>
