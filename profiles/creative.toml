# Creative (M7.6): Krita for drawing with a pen and GIMP for photos, and
# sound with little delay for music and recording (sound.low_latency, M7.6b).
# Pens reach apps through the compositor's tablet protocol and screen capture
# through the portal on every desktop, so neither needs a line here. Laid under
# the machine's own file as gaming.toml says.
format = 1

[sound]
low_latency = true

[apps]
installed = ["org.kde.krita", "org.gimp.GIMP"]
