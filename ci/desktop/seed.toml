# Test only (roadmap M4.1, M4.2b): the seed settings file of CI's desktop
# image.
format = 1

# The person CI logs in to the compositor; edel settings apply puts them in
# the seat group, as it does everyone on a desktop.
[users.ci]
admin = false

# The second screen (M4.6c): the kernel turns it on with no list of
# modes it prefers, so it would get the largest, 5120x2160; this tests
# the resolution key too.
[displays.Virtual-2]
resolution = "1024x768"

# Low latency (M7.6b): the compositor links ci's PipeWire drop-in before
# it starts PipeWire; the sound case reads the quantum with pw-metadata,
# then resets the key.
[sound]
low_latency = true
