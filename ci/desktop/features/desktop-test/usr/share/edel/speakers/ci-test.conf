# A speaker profile for CI's virtual machine only (M6.15), shaped as a real
# one is: PipeWire's filter chain, a sink the speakers' sound passes
# through, here one flat peaking filter per channel, so it changes nothing
# a test could hear. A real profile tunes its laptop's speakers with the
# filters measured on it, and is the default sink (a high
# priority.session); this one keeps a low one, so the sound case's sink in
# use stays the virtual card.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "CI speaker profile"
      media.name = "CI speaker profile"
      filter.graph = {
        nodes = [
          {
            type = builtin
            name = flat
            label = bq_peaking
            control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = 0.0 }
          }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "edel-speakers"
        media.class = Audio/Sink
        priority.session = 100
      }
      playback.props = {
        node.name = "edel-speakers.output"
        node.passive = true
      }
    }
  }
]
