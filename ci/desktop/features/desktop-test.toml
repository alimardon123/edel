# CI only (roadmap M4.1, M4.2b, M4.6b). features/desktop-test/ holds the test
# service and greetd's CI config, which logs user ci in to the compositor
# at once.
format = 1
summary = "CI only: log in to the compositor at once and measure it"
why = "weston-presentation-shm times the frames the compositor presents, edel-testclient draws windows of known size and colour (M4.3), and wayland-info lists the protocols the compositor offers (M4.6b); the test service prints what it measured on the serial console."
packages = ["wayland-utils", "weston-clients"]
programs = ["edel-testclient"]

[services]
default = ["edel-desktop-test"]
