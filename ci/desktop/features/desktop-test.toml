# CI only (roadmap M4.1, M4.2b). features/desktop-test/ holds the test
# service and greetd's CI config, which logs user ci in to the compositor
# at once.
format = 1
summary = "CI only: log in to the compositor at once and measure it"
why = "weston-presentation-shm times the frames the compositor presents; the test service prints what it measured on the serial console."
packages = ["weston-clients"]

[services]
default = ["edel-desktop-test"]
