# CI only (roadmap M4.1, M4.2b): the desktop image plus the desktop test,
# which logs user ci in to the compositor at once and measures it
# (ci/desktop-test.sh).
# The gaming, printing, containers and ai-agents add-ons are built in here (M7.6b, M7.9),
# as the desktop test mounts only the desktop, so the profiles case sees the
# gaming add-on's controllers' rule and uinput, profile-office runs CUPS
# and profile-developer runs podman. Printing ships off (off), so no other
# case's VM runs cupsd; the case turns it on with services.printing, as
# mounting the add-on would.
# ai-agents brings its apps only while addons.installed names it, which the ai-agents case does.
# Release images never use them.
format = 2
name = "edel-desktop"
variant = "vm"
arch = "x86_64"
hostname = "edel"
features = ["base", "machine", "udev", "ab-boot", "ssh", "kernel", "laptop", "completion", "network", "firewall", "gaming", "printing", "containers", "ai-agents", "desktop-test"]
# The desktop is the add-on the one image carries (M8.17c), so every case
# runs on a machine with it, as a person's stick does.
addons = ["desktop"]
off = ["ssh", "printing"]

[vm]
kernel = "lts"
# Room for the add-ons built in for the profile cases (M7.6b).
slot_mib = 2048
# The screen and the serial port both show the kernel; the serial port,
# listed last, also gets the boot messages, as the CI tests read them.
# QEMU shows only the first of virtio-vga's two screens as plugged in
# when it has no window to show the second in, so the kernel is told the
# second is plugged in too (M4.6c); the seed settings file sets its mode.
cmdline = "console=tty0 console=ttyS0,115200 video=Virtual-2:e"
carry = ["desktop"]
