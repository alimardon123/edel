# CI only (roadmap M4.1, M4.2b): the desktop image plus the desktop test,
# which logs user ci in to the compositor at once and measures it
# (ci/desktop-test.sh).
# The gaming add-on is built in here (M7.6b), as the desktop test mounts
# no add-ons, so the profiles case sees its controllers' rule and uinput.
# Release images never use it.
format = 2
name = "edel-desktop"
variant = "vm"
arch = "x86_64"
hostname = "edel"
features = ["base", "machine", "udev", "ab-boot", "ssh", "laptop", "completion", "graphics", "seat", "login", "fonts", "input-method", "terminal", "compositor", "shell", "settings", "xwayland", "flatpak", "sound", "network", "bluetooth", "power", "capture", "location", "gaming", "desktop-test"]
off = ["ssh"]

[vm]
kernel = "lts"
slot_mib = 1536
# The screen and the serial port both show the kernel; the serial port,
# listed last, also gets the boot messages, as the CI tests read them.
# QEMU shows only the first of virtio-vga's two screens as plugged in
# when it has no window to show the second in, so the kernel is told the
# second is plugged in too (M4.6c); the seed settings file sets its mode.
cmdline = "console=tty0 console=ttyS0,115200 video=Virtual-2:e"
