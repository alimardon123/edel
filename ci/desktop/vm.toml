# CI only (roadmap M4.1): the desktop image plus the desktop test, which
# logs user ci in to sway at once and measures it (ci/desktop-test.sh).
# Release images never use it.
format = 2
name = "edel-desktop"
variant = "vm"
arch = "x86_64"
hostname = "edel"
features = ["base", "machine", "udev", "ab-boot", "ssh", "laptop", "graphics", "seat", "login", "fonts", "terminal", "sway-baseline", "desktop-test"]
off = ["ssh"]

[alpine]
branch = "v3.24"
mirror = "https://dl-cdn.alpinelinux.org/alpine"
repositories = ["main", "community"]

[vm]
kernel = "lts"
slot_mib = 1536
# The screen and the serial port both show the kernel; the serial port,
# listed last, also gets the boot messages, as the CI tests read them.
cmdline = "console=tty0 console=ttyS0,115200"
