# CI only (roadmap M1.9): the VM image plus Flatpak, to check that glibc
# runtimes from Flathub run on the musl base. Release images never use it.
format = 2
name = "edel-flatpak"
variant = "vm"
arch = "x86_64"
hostname = "edel"
features = ["base", "machine", "mdev", "ab-boot", "ssh", "vm", "flatpak-test"]

[vm]
kernel = "virt"
slot_mib = 1024
cmdline = "console=ttyS0"
