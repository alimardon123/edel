# Budgets (roadmap M3.2): ci/sizes.sh fails the job when a measurement is
# over its budget. The first values are the measurements of 2026-10-02 plus
# 20 percent: container 6.5 MiB, root 91 MiB, boot 6.42 s and memory 63 MiB,
# medians of three boots with KVM on a GitHub runner. Lowering a budget is
# a reviewed change; a budget is never raised to make a pull request pass.
# Each key is one number.

# The container image, out/edel-container-x86_64.tar.gz, in MiB.
container_mib = 7.8

# Used space on the VM's root (`df -Pm /` in the guest), in MiB.
vm_root_mib = 110

# Seconds from the kernel's start to the confirmed slot (`/proc/uptime`
# when edel-boot-ok runs), median of three boots with KVM.
vm_boot_seconds = 7.7

# Memory in use at that moment (MemTotal minus MemAvailable), in MiB,
# median of three boots with 512 MiB.
vm_memory_mib = 76

# The desktop (roadmap M4.2a), from the sway baseline CI measured on
# 2026-10-03 in PR #41 (ci/desktop-test.sh baseline, sway under llvmpipe
# with KVM) plus 20 percent: ready 7.67 s, sway 141.0 MiB, 292 MiB in use,
# frames p99 3.7 ms. desktop-test checks them from M4.2b on, when our
# compositor takes sway's place; shell-ui's row comes with shell-ui (M5.1).

# Seconds from the kernel's start to the session's first client.
desktop_ready_seconds = 9.2

# Memory in use with the session idle (MemTotal minus MemAvailable), MiB.
desktop_memory_mib = 350

# The compositor's resident memory (VmRSS), MiB.
compositor_rss_mib = 169

# 99th percentile of the time between frames presented to a client that
# draws whenever asked (weston-presentation-shm, 10 s), milliseconds.
frame_p99_ms = 4.4

# Frames the compositor draws while nothing on screen changes.
idle_frames = 0

# What shell-ui holds of its own with the session idle and no screen
# reader (RssAnon plus RssShmem: its heap and the buffers it shares with
# the compositor), MiB (M5.1b): 1.5 MiB measured on 2026-10-04 in PR #96
# (both desktop-test boots) plus 20 percent. Until then this budgeted all
# of its resident memory (VmRSS) as shell_ui_rss_mib, 11.2 MiB, the
# 9.3 MiB measured with AccessKit's D-Bus link (M5.1d) plus 20 percent,
# which Alimardon chose (option A in PR #62) over keeping 7.2 MiB. VmRSS
# also counts the pages shell-ui maps from its binary, libraries and
# fonts, 8.8 to 10.7 MiB of it, which the kernel shares with the page
# cache and maps more or fewer of from run to run: VmRSS read 9.8 to
# 12.2 MiB on the same code, so the gate failed changes that had not
# touched shell-ui. The test still reports VmRSS and the file pages.
shell_ui_own_mib = 1.8

# What Settings holds of its own while open (desktop-test settings,
# M5.6a), read as shell-ui's is: RssAnon plus RssShmem, MiB. 12.8 MiB
# measured on 2026-10-07 in a nested session with GTK's Cairo renderer,
# which Settings uses unless GSK_RENDERER says otherwise, plus 20 percent;
# with GL under llvmpipe it held 88.3 MiB there and 107.4 MiB in CI's VM
# (PR #113), which is why it draws with Cairo. Nothing of it is held
# while Settings is closed.
settings_own_mib = 16

# What the animations add, in milliseconds, to the 99th percentile of the
# time between frames while ten windows open and close one after another
# (desktop-test animations, M5.11b): with motion full, less the same with
# motion off, on the same runner and tier. The largest of 23 CI runs up to
# 2026-10-04 was 1.2 ms, plus 20 percent, rounded up to the tenth. It
# replaced frame_p99_ms for that check in PR #99: with motion off alone
# those runs took 1.7 to 3.8 ms, so the absolute budget measured the
# runner (4.5 and 4.8 ms failed changes that had not touched the
# compositor) more than the animations (0.5 to 1.2 ms).
animation_p99_ms = 1.5

# shell-ui's resident memory (VmRSS) with the session idle and no screen
# reader, MiB (M5.1b): 9.3 MiB measured on 2026-10-04 (desktop-test, both
# boots) with AccessKit's D-Bus link (M5.1d) plus 20 percent. Alimardon
# chose this (option A in PR #62) over keeping 7.2 MiB: that budget was
# set before the D-Bus that screen readers, the tray (M5.2), the portal
# (M5.5) and notifications (M5.9) all need.
shell_ui_rss_mib = 11.2
