# Budgets (roadmap M3.2): ci/sizes.sh fails the job when a measurement is
# over its budget. The first values are the measurements of 2026-10-02 plus
# 20 percent: container 6.5 MiB, root 91 MiB, boot 6.42 s and memory 63 MiB,
# medians of three boots with KVM on a GitHub runner. Lowering a budget is
# a reviewed change; a budget is never raised to make a pull request pass.
# Each key is one number.

# The container image, out/edel-container-x86_64.tar.gz, in MiB.
container_mib = 7.8

# What a person downloads to update the system, out/edel-x86_64.ext4.gz,
# in MiB (M5.10c4c): 583.0 measured in CI on 2026-10-11, plus 20 percent.
update_image_mib = 700

# The one image's initramfs (`/boot/initramfs-lts`), in MiB, checked by
# ci/initramfs-check.sh (M8.17e): it only finds and checks the root slot.
# 19.3 MiB measured with Alpine 3.24's linux-lts and the image's mkinitfs
# features on 2026-10-25, without kms, plus 10 percent; `du -m` rounds up.
initramfs_mib = 22

# What a person downloads to write a stick (M8.17f): the one image,
# `out/edel-x86_64.img.gz`, its slot, the add-ons it carries and the
# default apps on its data partition, in MiB. 2155 MiB measured on `main`
# on 2026-10-25 (the `edel-try-x86_64` download); the first value is that,
# to be lowered to this lane's first measurement plus 5 percent.
stick_mib = 2155

# The one image (images/edel.toml, M8.17) booted with no screen: CI's first
# measurement on 2026-10-17 (1099 MiB, 4.34 s, 85 MiB) plus 20 percent. The
# VM image it replaced measured 91 MiB, 6.42 s and 63 MiB on 2026-10-02.
# Since the desktop became an add-on (M8.17c) the root and memory are CI's
# median on 2026-10-23 (461 MiB, 72 MiB) plus 20 percent; the boot keeps
# its budget, as the VM's boot swings with the runner (3.2 to 3.7 s that day).
# Since the laptops' firmware became hardware packs (M8.17d) the root is
# CI's 355 MiB of 2026-10-24, AMD's graphics firmware in the base and in
# the initramfs included, plus 5 percent, as `df` on one image does not
# swing.
#
# Used space on the root (`df -Pm /` in the guest), in MiB.
headless_root_mib = 373

# Seconds from the kernel's start to the confirmed slot (`/proc/uptime`
# when edel-boot-ok runs), median of three boots with KVM.
headless_boot_seconds = 5.2

# Memory in use at that moment (MemTotal minus MemAvailable), in MiB,
# median of three boots with 512 MiB.
headless_memory_mib = 87

# The desktop (roadmap M4.2a), from the sway baseline CI measured on
# 2026-10-03 in PR #41 (ci/desktop-test.sh baseline, sway under llvmpipe
# with KVM) plus 20 percent: ready 7.67 s, sway 141.0 MiB, 292 MiB in use,
# frames p99 3.7 ms. desktop-test checks them from M4.2b on, when our
# compositor takes sway's place; shell-ui's row comes with shell-ui (M5.1).

# Seconds from the kernel's start to the session's first client.
desktop_ready_seconds = 9.2

# Memory the desktop holds with the session idle, MiB: AnonPages, Shmem,
# SUnreclaim, KernelStack and PageTables from /proc/meminfo, the middle of
# three reads. It replaced desktop_memory_mib (MemTotal less MemAvailable,
# 350) on 2026-10-08: that number swung by up to 19 MiB between runs of
# the same image (332 and 351 MiB) because MemAvailable estimates the
# cache the kernel could free, while this one moved by 6 (142, 147 and
# 148 MiB in the runs of #144, #145 and #147). The highest plus 10
# percent, rounded up to 5: the old budget left about that much room.
desktop_held_mib = 165

# The compositor's resident memory (VmRSS), MiB.
compositor_rss_mib = 169

# 99th percentile of the time between frames presented to a client that
# draws whenever asked (weston-presentation-shm, 10 s), milliseconds.
frame_p99_ms = 4.4

# Frames the compositor draws while nothing on screen changes.
idle_frames = 0

# What shell-ui holds of its own with the session idle and no screen
# reader (RssAnon plus RssShmem: its heap and the buffers it shares with
# the compositor), MiB (M5.1b): 1.5 MiB measured on 2026-10-04 in PR #96
# (both desktop-test boots) plus 20 percent. Until then this budgeted all
# of its resident memory (VmRSS) as shell_ui_rss_mib, 11.2 MiB, the
# 9.3 MiB measured with AccessKit's D-Bus link (M5.1d) plus 20 percent,
# which Alimardon chose (option A in PR #62) over keeping 7.2 MiB. VmRSS
# also counts the pages shell-ui maps from its binary, libraries and
# fonts, 8.8 to 10.7 MiB of it, which the kernel shares with the page
# cache and maps more or fewer of from run to run: VmRSS read 9.8 to
# 12.2 MiB on the same code, so the gate failed changes that had not
# touched shell-ui. The test still reports VmRSS and the file pages.
shell_ui_own_mib = 1.8

# What the compositor and shell-ui use of one CPU together, in percent,
# over 30 s while a fullscreen game plays (desktop-test fullscreen, M7.7c):
# the desktop steps aside, so its timers and frames stop. No CI run has
# measured it yet: 1 percent is the first value, to be checked against the
# first CI measurement, and a later reviewed change may lower it.
desktop_behind_game_cpu_percent = 1

# The smoothness gate (M7.7e, desktop-test smoothness): a fullscreen game
# stand-in, edel-testclient --busy --smooth 1200, in game mode. The 99th
# percentile of the time between the frames the screen presented, as a
# multiple of their median, and the share of its frames that went
# straight to the screen, in percent, which must not fall below the
# floor. A change that makes either more than 10 percent worse does not
# merge, so each is the first CI measurements made 10 percent worse.
# Until 2026-10-24 the gate was the p99 alone, game_frame_p99_ms = 16.4
# (PR #403): it measured the runner, as CI's VM has no screen refresh, so
# a frame takes as long as the runner's processor needs. Over 14 runs of
# the same code it gave 11.2 to 19.1 ms, and 12.5 and 19.1 ms in two runs
# in one boot, with render p50 0.59 ms on AMD runners at 2.6 GHz and
# 0.98 ms on an Intel runner at 2.8 GHz. The ratio takes the runner's
# pace out, as animation_p99_ms does for the animations. Its first
# measurement, on 2026-10-24, was 1.12 (median 8.9 ms, p99 10.0 ms over
# 1200 frames); the limit is that plus 10 percent, as M7.7e asks.
# CI's VM gives the client shared memory buffers, which cannot go
# straight to the screen, so the floor stays 0 there.
game_frame_p99_ratio = 1.24
game_direct_percent_floor = 0

# The compositor's and shell-ui's wakeups per second together, from their
# voluntary context switches, over 60 s with the desktop idle (desktop-test
# wakeups, M7.16a). CI's VM draws in software, so its number is not a
# laptop's. CI measured 2.43 and 2.50 on 2026-10-18 (shell-ui about 2.4,
# the compositor 0.1); the budget is that plus 20 percent.
desktop_idle_wakeups_per_second = 3

# What Settings holds of its own while open (desktop-test settings,
# M5.6a), read as shell-ui's is: RssAnon plus RssShmem, MiB. 18.6 and
# 20.6 MiB measured on 2026-10-07 in CI's VM (PR #113) with GTK's Cairo
# renderer, which Settings uses unless GSK_RENDERER says otherwise; the
# higher plus 20 percent, as the reads swing by 2 MiB from run to run; with GL under llvmpipe it held 107.4 MiB there (12.8 against
# 88.3 MiB in a nested session), which is why it draws with Cairo.
# Nothing of it is held while Settings is closed.
settings_own_mib = 25

# The Welcome (desktop-test welcome, M6.12): what Settings holds of its
# own while the Welcome shows its first page, read as settings_own_mib
# is, MiB; and the time from `edel-settings --welcome` to its first page's
# places in its log, which it writes once two frames agree, ms, the part
# of the first start's time from login to the desktop that the Welcome
# adds. Measured in CI's VM on 2026-10-14 (PR #335): 17.8 MiB and 260 ms;
# the memory plus 20 percent, as Settings' is, the reads swinging by 2 MiB,
# and the time about four times over, as the runner's speed moves it.
welcome_own_mib = 22
welcome_shown_ms = 1000

# What the animations add, in milliseconds, to the 99th percentile of the
# time between frames while ten windows open and close one after another
# (desktop-test animations, M5.11b): with motion full, less the same with
# motion off, on the same runner and tier. The largest of 23 CI runs up to
# 2026-10-04 was 1.2 ms, plus 20 percent, rounded up to the tenth. It
# replaced frame_p99_ms for that check in PR #99: with motion off alone
# those runs took 1.7 to 3.8 ms, so the absolute budget measured the
# runner (4.5 and 4.8 ms failed changes that had not touched the
# compositor) more than the animations (0.5 to 1.2 ms). Since 2026-10-08
# it is the smaller of two pairs (off then full), as one busy moment of
# the runner lifted one run to 1.8 ms added on a change that did not
# touch the compositor.
animation_p99_ms = 1.5

# shell-ui's resident memory (VmRSS) with the session idle and no screen
# reader, MiB (M5.1b): 9.3 MiB measured on 2026-10-04 (desktop-test, both
# boots) with AccessKit's D-Bus link (M5.1d) plus 20 percent. Alimardon
# chose this (option A in PR #62) over keeping 7.2 MiB: that budget was
# set before the D-Bus that screen readers, the tray (M5.2), the portal
# (M5.5) and notifications (M5.9) all need.
shell_ui_rss_mib = 11.2

# Flatpak apps quick and light (roadmap M6.2a), desktop-test's default-apps
# case: the test app org.edel.TestA started as ci with flatpak run, from
# the command to its window mapped, first with the page cache dropped
# (cold) and then again (warm), in ms; its own process's memory (PSS) in
# MiB; and the settings portal's second ReadAll, in ms. CI measured on
# 2026-10-13 (PR #324): cold 50 ms, warm 30 ms, 3.0 MiB, ReadAll 10 ms, in
# 10 ms steps; the start budgets leave room for the runner's noise, and
# ReadAll's is the roadmap's 50 ms.
flatpak_cold_ms = 500
flatpak_warm_ms = 300
flatpak_app_pss_mib = 6
portal_readall_ms = 50

# How much slower the desktop's frames may be at p99 while memory is full
# past what was available and pages go to zram, than with it idle (desktop-test
# memory, M7.15). A difference, as animation_p99_ms is, so the runner's own
# speed does not count. No CI run has measured it yet: 8 is the first value,
# to be lowered to CI's first measurement plus 20 percent in the same pull
# request.
memory_full_p99_ms = 8
# The walks a newcomer takes (M8.15a, docs/REVIEW-experience.md): for
# each, the seconds the machine makes a person wait, timed by the machine
# itself (a boot's seconds from the kernel running /init to its `Started
# in`, or the guest's clock across a restart), and the steps a person
# takes (each key, typed word or click). Seconds
# are the first CI measurement (2026-10-18, PR #403) plus 20 percent,
# rounded up to a whole second: try 11.95, first setup 3.88, install 12,
# update 14, rollback 12, broken update 51; steps are exact. A walk that
# must grow changes its budget in a reviewed change that says why. Since
# 2026-10-24 try and first-setup start at /init, as the kernel's part
# before it is Alpine's and what a slow runner stretches most; their
# budgets lost the kernel's usual part (1.36 s on the stick, 1.15 s on a
# disk, docs/REVIEW-experience.md), so they allow no more than before.
walk_try_seconds = 13.64
walk_install_page_steps = 9
walk_install_seconds = 15
walk_install_steps = 1
walk_first_setup_seconds = 3.85
walk_first_setup_steps = 12
walk_update_seconds = 17
walk_update_steps = 2
walk_rollback_seconds = 15
walk_rollback_steps = 2
walk_broken_update_seconds = 62
walk_broken_update_steps = 1

# Files the compositor and shell-ui may hold open beyond what they held
# before twenty test windows opened and closed (M8.11, desktop case
# descriptors). Not a measured budget but a leak check: a file kept per
# window adds twenty, so anything at or over this fails.
window_descriptors_left = 10
