# Classic (M5.1c): Edel's default layout, like Cinnamon: one panel
# along the bottom with the menu button and the window list at its
# start and the workspace switcher, the layout toggle, the tray
# (M5.2e) and the clock at its end, floating windows and four
# workspaces. Presets are built into edel, the compositor and
# shell-ui; the settings file picks one by name with layout.preset,
# and its own keys win over the preset's (ADR-008). Keys join this
# file with the steps that read them: the session's services (M5.7).
format = 1

[windows]
# The policy a workspace starts in when layout.tiling is not set:
# floating or tiling.
policy = "floating"
# The side of the title bar its buttons sit on when
# layout.window_buttons is not set: left or right.
buttons = "right"

[workspaces]
# How many workspaces, 1 to 9, one for each of Super+1 to Super+9; their
# number stays as it is.
count = 4

[launcher]
# What Super, tapped alone, and the menu button open: menu, a search
# line over the apps beside the panel's start.
style = "menu"

# The tiles of quick settings, which the status area's click opens
# (M5.9a), in two columns in this order: wifi, bluetooth, airplane
# (every radio off), do_not_disturb (notifications.do_not_disturb,
# M5.9b) and dark_style (appearance.mode). A tile whose feature or
# hardware this machine lacks is left out. Left out, the table shows
# these five.
[quick]
tiles = ["wifi", "bluetooth", "airplane", "do_not_disturb", "dark_style"]

# Each panel is one layer-shell surface along a screen's edge, top or
# bottom, holding shell-ui's widgets by name: from its start, in its
# centre and towards its end. It is a bar along the whole edge, or with
# style = "dock" a card as wide as what it holds (M5.4d), which with
# hide = "covered" steps aside while a window covers it (M5.4f). Its
# size = "small", "medium" (the default) or "large" sets its height from
# the tokens, floating = true makes a bar float with a gap round it, and
# screens = "every" puts one on each screen; a panel leaves out what it
# does not change (M5.31c).
[[panels]]
edge = "bottom"
start = ["menu", "separator", "windows"]
centre = []
end = ["workspaces", "layout", "separator", "tray", "keyboard", "status", "clock"]

# What the session starts with the compositor and shell-ui (M5.7b), as
# commands: a program on the PATH or an absolute path, then its arguments.
# They start one after the other, once. This table is left out here, as in
# every preset, and then the release's list holds (edel::presets::
# SESSION_START, the sound system of the sound feature). A preset names its
# own only to start others, and start = [] starts nothing:
#
#   [session]
#   start = ["PROGRAM ARGUMENT...", "ANOTHER-PROGRAM"]
