# Hive (M5.4a): tiling, for people who live on the keyboard. Windows
# tile from the start, side by side with their title bars and close
# buttons, and one slim bar along the top holds the menu button and
# the focused window's title at its start and the workspace buttons,
# the layout toggle, the tray (M5.2e) and the clock at its end.
# Super+T, or the toggle, still floats a workspace; minimized windows
# come back with Alt+Tab.
format = 1

[windows]
policy = "tiling"
buttons = "right"

[workspaces]
count = 4

[launcher]
style = "menu"

# The tiles of quick settings, which the status area's click opens
# (M5.9a), in two columns in this order: wifi, bluetooth, airplane
# (every radio off) and dark_style (appearance.mode). A tile whose
# feature or hardware this machine lacks is left out. Left out, the
# table shows these four.
[quick]
tiles = ["wifi", "bluetooth", "airplane", "dark_style"]

[[panels]]
edge = "top"
start = ["menu", "title"]
centre = []
end = ["workspaces", "layout", "tray", "status", "clock"]
