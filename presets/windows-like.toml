# Windows-like (M5.4c): one taskbar along the bottom, as Windows has:
# the menu button at its left edge and the search field beside it, the
# apps in its centre, pinned ones first and then every other app with
# a window open, and the workspace buttons, the layout toggle, the
# tray (M5.2e) and the clock at its end. Windows float, with their
# buttons on the right.
format = 1

[windows]
policy = "floating"
buttons = "right"

[workspaces]
count = 4

[launcher]
style = "menu"

[apps]
# The apps the apps widget shows first, by role (files, browser, mail,
# editor, terminal, music, settings: the installed app for it) or by
# desktop file id; one this machine lacks is left out.
pinned = ["files", "browser", "terminal", "mail", "music"]

# The tiles of quick settings, which the status area's click opens
# (M5.9a), in two columns in this order: wifi, bluetooth, airplane
# (every radio off) and dark_style (appearance.mode). A tile whose
# feature or hardware this machine lacks is left out. Left out, the
# table shows these four.
[quick]
tiles = ["wifi", "bluetooth", "airplane", "dark_style"]

[[panels]]
edge = "bottom"
start = ["menu", "search"]
centre = ["apps"]
end = ["workspaces", "layout", "tray", "status", "clock"]
