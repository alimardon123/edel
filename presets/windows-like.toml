# Windows-like (M5.4c): one taskbar along the bottom, as Windows has: the
# menu button at its left edge and the search field beside it, the apps
# in its centre, pinned ones first and then every other app with a
# window open, and the workspace buttons, the layout toggle, the tray
# (M5.2e) and the clock at its end. Windows float, with their buttons on the right.
format = 1

[windows]
policy = "floating"
buttons = "right"

[workspaces]
count = 4

[launcher]
style = "menu"

[apps]
# The apps the apps widget shows first, by role (files, browser, mail,
# editor, terminal, music, settings: the installed app for it) or by
# desktop file id; one this machine lacks is left out.
pinned = ["files", "browser", "terminal", "mail", "music"]

[[panels]]
edge = "bottom"
start = ["menu", "search"]
centre = ["apps"]
end = ["workspaces", "layout", "tray", "clock"]
