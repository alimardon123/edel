# Tiling (M5.4a): for people who live on the keyboard. Windows tile from
# the start, side by side with their title bars and close buttons, and
# one slim bar along the top holds the menu button and the focused
# window's title at its start and the workspace buttons, the layout
# toggle and the clock at its end. Super+T, or the toggle, still floats
# a workspace; minimized windows come back with Alt+Tab.
format = 1

[windows]
policy = "tiling"
buttons = "right"

[workspaces]
count = 4

[launcher]
style = "menu"

[[panels]]
edge = "top"
start = ["menu", "title"]
centre = []
end = ["workspaces", "layout", "clock"]
