name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every push to main
# or of a tag keeps its own run, even when main and a tag point at the same
# commit, so no publish is ever cancelled halfway.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Image definitions are valid
        run: for def in images/*.toml; do cargo run --quiet --locked -- image check "$def"; done
      - name: The system file library builds without the command's dependencies
        run: cargo build --locked --lib --no-default-features
      - name: No system file key removed within a format
        run: sh ci/keys-check.sh

  images:
    name: Build and boot images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep the Rust build between runs
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: alpine-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: alpine-cargo-

      - name: Number this build
        # YYYY.MM.N, with N the run number, so later runs are newer (M3.1);
        # the month is the commit's, so a run re-run next month keeps its
        # version and never beats newer code. A v* tag is its own version. The channel and the tag a release
        # would go to (M3.4): a pull request checks the tag path, main
        # makes the preview, a tag makes a stable release.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "EDEL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "EDEL_CHANNEL=stable" >> "$GITHUB_ENV"
            echo "EDEL_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            version=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y.%m).$GITHUB_RUN_NUMBER
            echo "EDEL_VERSION=$version" >> "$GITHUB_ENV"
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "EDEL_CHANNEL=preview" >> "$GITHUB_ENV"
              echo "EDEL_TAG=preview" >> "$GITHUB_ENV"
            else
              echo "EDEL_CHANNEL=ci" >> "$GITHUB_ENV"
              echo "EDEL_TAG=v$version" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build images inside Alpine 3.24
        run: docker run --rm --privileged -e EDEL_VERSION -e EDEL_CHANNEL -e EDEL_TAG -v "$PWD:/src" -w /src alpine:3.24 sh ci/build.sh

      - name: Sign the release in a container of its own
        env:
          # Empty until Alimardon adds the secret (docs/RELEASE.md), and
          # always empty for pull requests: only this step of a push to
          # main or of a tag sees the key; the rest sign with a throwaway.
          EDEL_RELEASE_KEY: ${{ github.event_name == 'push' && secrets.EDEL_RELEASE_KEY || '' }}
        run: docker run --rm -e EDEL_RELEASE_KEY -v "$PWD:/src" -w /src alpine:3.24 sh ci/sign.sh

      - name: Test the container image
        run: sh ci/container-test.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and UEFI firmware
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf cpio zstd

      - name: Check the kernels and the initramfs of the bootable images
        run: sh ci/initramfs-check.sh

      - name: Run the VM tests, installed-disk lane and other lane at once
        # install-test then ab-test, beside boot-test, system-test and
        # flatpak-test; ci/vm-tests.sh says why they can share the runner.
        run: sh ci/vm-tests.sh

      - name: Check the release, and show what would be published
        run: |
          sh ci/release.sh dry-run preview
          case "$EDEL_TAG" in v*) sh ci/release.sh dry-run "$EDEL_TAG" && sh ci/channel.sh dry-run "$EDEL_TAG" ;; esac

      - name: Keep the release for the publish job
        if: github.event_name == 'push' && vars.EDEL_PUBLISH == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: edel-release
          path: |
            out/release
            out/channel

      - name: Check the budgets and report image sizes
        if: always()
        run: sh ci/sizes.sh

      - name: Report package changes against the preview
        if: always()
        run: sh ci/package-report.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the container image and boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edel-images
          if-no-files-found: ignore
          path: |
            out/*.tar.gz
            out/*.log
            out/*.packages

  # Publishes what the images job built and tested (M3.4): the preview on
  # every merge to main, a draft release for a v* tag. Off until Alimardon
  # sets the repository variable EDEL_PUBLISH to yes (docs/RELEASE.md).
  publish:
    name: Publish the release
    needs: [rust, images]
    if: github.event_name == 'push' && vars.EDEL_PUBLISH == 'yes'
    # One publish per ref at a time, never cancelled halfway: two merges in
    # a row upload one after the other, and ci/release.sh keeps the newer.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edel-release
          path: out
      - name: Upload to the preview, or to a draft release for a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh ci/release.sh publish "${{ github.ref_type == 'tag' && github.ref_name || 'preview' }}"
