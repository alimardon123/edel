name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # ready_for_review: a draft runs Rust checks only (ci/changes.sh), so
    # marking it ready starts the rest.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes to main take
# turns: one run at a time, and a newer merge replaces an older one still
# waiting, so a burst of merges costs two full runs, not one each (faster
# PRs, 2026-10-17); a run that started is never cancelled, so no publish
# stops halfway, and the newest run tests every merge before it. Every tag
# keeps its own run, even when main and a tag point at the same commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref == 'refs/heads/main' && 'main' || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the change can affect (CI speed-ups, 2026-10-16): ci/changes.sh
  # answers for the image build and VM tests and for the desktop tests, and
  # names the VM test lanes. A job it skips ends as skipped; the checks
  # "Build and boot images" and "Desktop tests" join them and pass, so a
  # pull request stays mergeable.
  changes:
    name: What this change can affect
    runs-on: ubuntu-latest
    # actions: read lets changes.sh see whether the run before a push passed.
    permissions:
      contents: read
      actions: read
    outputs:
      images: ${{ steps.changes.outputs.images }}
      desktop: ${{ steps.changes.outputs.desktop }}
      lanes: ${{ steps.changes.outputs.lanes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A pull request's merge commit and its base, for the diff.
          fetch-depth: 2
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          BASE_REF: ${{ github.base_ref }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: sh ci/changes.sh

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    env:
      # Incremental files only help a later build on the same machine;
      # here they would only grow the cache.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the libraries the compositor links
        # libxkbcommon for the keyboard; libudev, libinput, libgbm and
        # libseat for the GPU backend (M4.2b); GTK4 and libadwaita for
        # Settings (M5.6a). EGL is loaded at run time.
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libudev-dev libinput-dev libgbm-dev libseat-dev libgtk-4-dev libadwaita-1-dev
      - name: Keep the crates and their builds between runs
        # Keyed on Cargo.lock, as the other jobs' builds are (faster PRs,
        # 2026-10-17): a pull request reads main's, so only our own crates
        # build again.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-checks-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-checks-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p edel-compositor --all-targets --locked --features winit -- -D warnings
      - run: cargo test --workspace --locked
      - name: Image definitions are valid
        run: for def in images/*.toml; do cargo run --quiet --locked -- image check "$def"; done
      - name: The system file library builds without the command's dependencies
        run: cargo build --locked --lib --no-default-features
      - name: No settings file key removed within a format
        # Against main, and against every kept release vVERSION (M6.11).
        run: sh ci/keys-check.sh
      - name: What a change can affect is classified right
        # The path lists that let a change skip the image build and the
        # desktop tests (ci/changes.sh), checked on fixed lists.
        run: sh ci/changes.sh --self-test
      - name: Visible defaults changed
        # The diff of design/, presets/ and docs/defaults.md against the
        # last kept release, or main before there is one, in the run's
        # summary (M6.11): a record, never a gate.
        run: sh ci/defaults-diff.sh
      - name: Every fact is written at its owner
        # ADR-010's one owner decision (M5.27): places, colours and the
        # Alpine branch only at their owners, and the check catching one
        # of each planted elsewhere.
        run: sh ci/one-place.sh && sh ci/one-place.sh --self-test
      - name: Every part stands alone
        # ADR-010's seams (M8.13): the library uses no binary, the desktop
        # parts stand apart, nothing uses the test client, the desktop
        # parts take edel without its cli feature, and the settings file is
        # written by edel::settings, with the check catching one planted of
        # each kind. Cargo only; the registry the steps above fetched.
        run: sh ci/seams.sh && sh ci/seams.sh --self-test
      - name: Keep cargo-audit between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ hashFiles('ci/audit.sh') }}
      - name: No known vulnerability in the dependencies
        # cargo-audit, at the version ci/audit.sh names, checks Cargo.lock
        # against the RustSec advisories (M3.9): a vulnerability fails the
        # pull request unless ci/audit-exceptions.toml accepts it with a
        # reason; an unmaintained crate is listed in this job's summary.
        run: sh ci/audit.sh
      - name: Keep mdBook between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ hashFiles('ci/site.sh') }}
      - name: The docs site builds and its links land
        # mdBook, at the version ci/site.sh names, builds docs/ into
        # out/site (M8.10a); publishing it waits for EDEL_SITE below.
        run: sh ci/site.sh build


  elsewhere:
    name: Desktop on another distribution
    # M5.15a: the compositor and shell-ui built against Ubuntu's own
    # libraries, outside the Alpine build, and run nested under Xvfb with
    # none of Edel OS's folders, so the desktop stays one that other
    # distributions could ship (ADR-002's separable desktop decision).
    needs: changes
    runs-on: ubuntu-latest
    # Each step runs only when the change can affect the desktop's build,
    # so the check still passes when it cannot (ci/changes.sh).
    env:
      RUN: ${{ needs.changes.outputs.images == 'yes' || needs.changes.outputs.desktop == 'yes' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.RUN == 'true'
      - name: Install the libraries, Xvfb and Mesa's software renderer
        if: env.RUN == 'true'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libudev-dev libinput-dev libgbm-dev libseat-dev xvfb imagemagick libegl1 libgl1-mesa-dri libxkbcommon-x11-0
      - name: Keep the desktop's build between runs
        if: env.RUN == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: elsewhere-${{ hashFiles('Cargo.lock') }}
          restore-keys: elsewhere-
      - name: Build the compositor, shell-ui and the test client
        if: env.RUN == 'true'
        run: cargo build --locked -p edel-compositor -p edel-shell-ui -p edel-testclient --features edel-compositor/winit
      - name: The desktop runs without Edel OS's folders
        if: env.RUN == 'true'
        run: sh ci/elsewhere-test.sh

  build:
    name: Build images
    needs: changes
    if: needs.changes.outputs.images == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Keep the Rust build between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cargo-home
            target
          key: alpine-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: alpine-cargo-

      - name: Number this build
        # YYYY.MM.N, with N the run number, so later runs are newer (M3.1);
        # the month is the commit's, so a run re-run next month keeps its
        # version and never beats newer code. A v* tag is its own version. The channel and the tag a release
        # would go to (M3.4): a pull request checks the tag path, main
        # makes the preview, a tag makes a stable release.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "EDEL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "EDEL_CHANNEL=stable" >> "$GITHUB_ENV"
            echo "EDEL_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            version=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y.%m).$GITHUB_RUN_NUMBER
            echo "EDEL_VERSION=$version" >> "$GITHUB_ENV"
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "EDEL_CHANNEL=preview" >> "$GITHUB_ENV"
              echo "EDEL_TAG=preview" >> "$GITHUB_ENV"
            else
              echo "EDEL_CHANNEL=ci" >> "$GITHUB_ENV"
              echo "EDEL_TAG=v$version" >> "$GITHUB_ENV"
            fi
          fi

      - name: The Alpine release to build in
        # The base feature owns the Alpine branch (M5.27) and the digest
        # of its image (M3.9): the build and signing containers are that
        # image, so nothing else names either.
        run: echo "ALPINE=alpine:$(sed -n 's/^branch = "v\(.*\)"$/\1/p' features/base.toml)@$(sed -n 's/^image_digest = "\(.*\)"$/\1/p' features/base.toml)" >> "$GITHUB_ENV"

      - name: Pull the Alpine image
        run: sh ci/pull-alpine.sh

      - name: Date the build by its commit
        # M8.6: every file of the container image is dated by the commit, so a rebuild of it gives the same bytes.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build images inside Alpine
        run: docker run --rm --privileged -e EDEL_VERSION -e EDEL_CHANNEL -e EDEL_TAG -e SOURCE_DATE_EPOCH -v "$PWD:/src" -w /src "$ALPINE" sh ci/build.sh

      - name: Every image carries the release's public keys
        # The sign job, which holds the key, never sees the images (M3.7).
        run: sh ci/keys-carried.sh

      - name: Hand the release lists to the sign job
        # Only the two lists: the signer never touches what the build made.
        uses: actions/upload-artifact@v4
        with:
          name: edel-lists
          path: |
            out/release/release.toml
            out/channel/release.toml

      - name: Test the container image
        run: sh ci/container-test.sh

      - name: The container image builds the same twice
        run: sh ci/repro-check.sh

      - name: Every image has a valid bill of materials
        # M8.12: out/IMAGE.cdx.json, CycloneDX, beside each package list.
        run: sh ci/bom.sh validate >> "$GITHUB_STEP_SUMMARY"

      - name: No image lacks a security fix Alpine ships
        # M8.12: in the build container, as apk compares the versions;
        # the self-test first, so the check is proven where it runs. The
        # shell is named, so bash runs with pipefail and tee keeps a failure.
        shell: bash
        run: docker run --rm -v "$PWD:/src" -w /src "$ALPINE" sh -c 'sh ci/bom.sh --self-test && sh ci/bom.sh advisories' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and UEFI firmware
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf cpio zstd

      - name: Check the kernels and the initramfs of the bootable images
        run: sh ci/initramfs-check.sh

      - name: Pack each VM test lane's images
        # One sparse archive each, without the builds' work/ folders, for
        # the lanes' own runners (ci/vm-tests.sh). One artifact per archive,
        # so a lane downloads only its own; changes.sh --self-test checks
        # there is a step below for each of `vm-tests.sh archives`.
        run: for name in $(sh ci/vm-tests.sh archives); do sh ci/vm-tests.sh pack "$name"; done

      - name: Hand the installed archive to its lanes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-vm-images-installed
          retention-days: 1
          # Already zstd: zipping it again gains nothing.
          compression-level: 0
          path: out/vm-installed.tar.zst

      - name: Hand the system archive to its lanes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-vm-images-system
          retention-days: 1
          # Already zstd: zipping it again gains nothing.
          compression-level: 0
          path: out/vm-system.tar.zst

      - name: Hand the live archive to its lanes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-vm-images-live
          retention-days: 1
          # Already zstd: zipping it again gains nothing.
          compression-level: 0
          path: out/vm-live.tar.zst

      - name: Hand the fleet archive to its lanes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-vm-images-fleet
          retention-days: 1
          # Already zstd: zipping it again gains nothing.
          compression-level: 0
          path: out/vm-fleet.tar.zst

      - name: List the desktop image to try
        # The image the live lane boots as a USB stick in desktop-test live
        # (M3.6). A push to main keeps it as a download; every run lists
        # it with its size.
        run: |
          mkdir -p out/try
          ln -f out/edel-desktop-x86_64.img.gz out/try/
          (cd out/try && sha256sum *.img.gz >SHA256SUMS)
          {
            echo "### Images to try"
            echo
            echo "A push to main keeps these for 14 days as the artifact \`edel-try-x86_64\` (docs/TRY-IT.md)."
            echo
            echo "| Image | Size | sha256 |"
            echo "|---|---|---|"
            for f in out/try/*.img.gz; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)...\` |"
            done
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the desktop image to try
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-try-x86_64
          retention-days: 14
          # Already gzipped: zipping them again gains nothing.
          compression-level: 0
          path: out/try/

      - name: Check the release, and show what would be published
        run: |
          sh ci/release.sh dry-run preview
          case "$EDEL_TAG" in v*) sh ci/release.sh dry-run "$EDEL_TAG" && sh ci/channel.sh dry-run "$EDEL_TAG" ;; esac

      - name: Keep the release for the publish job
        if: github.event_name == 'push' && vars.EDEL_PUBLISH == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-release
          path: |
            out/release
            out/channel

      - name: Check the budgets and report image sizes
        if: always()
        run: sh ci/sizes.sh

      - name: Report package changes against the preview
        if: always()
        run: sh ci/package-report.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the container image, the logs and the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-images
          if-no-files-found: ignore
          path: |
            out/*.tar.gz
            out/*.log
            out/*.packages
            out/*.cdx.json
            out/desktop-live/*.png

  # The VM tests, a lane per runner (CI speed-ups, 2026-10-16), each fed its
  # images by the build job's archive; ci/vm-tests.sh names the lanes and
  # what each needs.
  vm:
    name: VM tests ${{ matrix.lane }}
    needs: [changes, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.changes.outputs.lanes) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Number this build
        # As the build job numbered it: boot-test wants the version.
        run: echo "EDEL_VERSION=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y.%m).$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Name this lane's archive
        id: archive
        run: echo "name=$(sh ci/vm-tests.sh archive ${{ matrix.lane }})" >> "$GITHUB_OUTPUT"

      - name: Take this lane's images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: edel-vm-images-${{ steps.archive.outputs.name }}
          path: out

      - name: Unpack this lane's images
        run: sh ci/vm-tests.sh unpack ${{ steps.archive.outputs.name }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and UEFI firmware
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf

      - name: Run the ${{ matrix.lane }} lane
        run: sh ci/vm-tests.sh ${{ matrix.lane }}

      - name: Keep the lane's logs and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-vm-${{ matrix.lane }}
          if-no-files-found: ignore
          path: |
            out/*.log
            out/desktop-live/*.png

  # Joins the build and its VM test lanes into the one check a merge waits
  # for, which passes when ci/changes.sh found nothing they could test.
  images:
    name: Build and boot images
    needs: [changes, build, vm]
    # Not on a cancelled run, which a newer one replaces.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: The images were built and every VM test lane passed
        run: |
          build=${{ needs.build.result }} vm=${{ needs.vm.result }}
          if [ "${{ needs.changes.outputs.images }}" != yes ] && [ "${{ needs.changes.result }}" = success ]; then
            echo "Nothing to build: ci/changes.sh found nothing the images could test (build $build, VM tests $vm)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$build" = success ] && [ "$vm" = success ] || { echo "FAIL: build $build, VM tests $vm"; exit 1; }

  # The desktop tests on runners of their own, beside the VM tests, in four
  # parts at once (M6.17). Each part builds the desktop test image and boots
  # its own VM, so each part has its runner to itself, and the frame times
  # and memory it checks against ci/budgets.toml are still measured on a
  # quiet machine. The parts keep the cases' order, and a part holds every
  # case a case relies on (see ci/CLAUDE.md, "Desktop test cases").
  desktop-part:
    name: Desktop part ${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.desktop == 'yes'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: A
            cases: >-
              background floating titlebar tiling shape depth text cursor console pointer dmabuf outputs compositor
              panel xwayland layers animations shortcuts workspaces windows launcher quick notify osd player
              fallback switcher presets own-presets buttons styles scroll sandbox everyday scale
          - part: B
            cases: >-
              titlebar console one-screen taskbar app-windows dock pins panels panel-edit dockhide fullscreen clipboard
              keyboard settings settings-panels settings-workspaces settings-appearance settings-wallpaper
              settings-theme settings-accent settings-shape settings-shortcuts settings-unknown welcome display
              sound network power updates portal own-bars capture tray
          - part: C
            cases: >-
              one-screen scheme sun terminal accent contrast wallpaper glass desktop-widgets completion lock lock-edit lock-looks
              default-apps-keys respawn workspaces-dynamic app-workspaces overview web-app input-method
              default-apps app-permissions in-use location profiles flatpak suspend lid
          - part: D
            cases: one-screen wakeups device-power language settings-tour theme office-fonts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Keep the Rust build between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cargo-home
            target
          key: alpine-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: alpine-cargo-

      - name: Number this build
        # Numbered as the images job numbers a pull request or main.
        run: echo "EDEL_VERSION=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y.%m).$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: The Alpine release to build in
        # The base feature owns the Alpine branch and its image's digest.
        run: echo "ALPINE=alpine:$(sed -n 's/^branch = "v\(.*\)"$/\1/p' features/base.toml)@$(sed -n 's/^image_digest = "\(.*\)"$/\1/p' features/base.toml)" >> "$GITHUB_ENV"

      - name: Pull the Alpine image
        run: sh ci/pull-alpine.sh

      - name: Build the desktop test image inside Alpine
        run: docker run --rm --privileged -e EDEL_VERSION -v "$PWD:/src" -w /src "$ALPINE" sh ci/build.sh desktop-test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and UEFI firmware
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf

      # A failed case's part runs once more; a pass then names it flaky (M6.17).
      - name: Test part ${{ matrix.part }} of the desktop image on a virtual GPU
        run: sh ci/desktop-part.sh ${{ matrix.cases }}

      - name: Keep the part's log, screenshots and passed cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-desktop-test-${{ matrix.part }}
          if-no-files-found: ignore
          path: |
            out/desktop-test.log
            out/desktop-test-first.log
            out/desktop-test/*.png
            out/desktop-test/first/
            out/desktop-test/passed

  # Joins the four parts, so one check says whether the desktop tests passed,
  # and prints the basics checklist from every part's passed cases.
  desktop:
    name: Desktop tests
    needs: [changes, desktop-part]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Nothing to test
        # ci/changes.sh found nothing the desktop tests could test.
        if: needs.changes.result == 'success' && needs.changes.outputs.desktop != 'yes'
        run: |
          echo "Nothing to test: ci/changes.sh found nothing the desktop tests could test (parts ${{ needs.desktop-part.result }})." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gather the parts' passed cases
        if: needs.changes.outputs.desktop == 'yes' || needs.changes.result != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: edel-desktop-test-*
          path: out/parts

      - name: Every part passed
        if: always() && (needs.changes.outputs.desktop == 'yes' || needs.changes.result != 'success')
        run: |
          mkdir -p out/desktop-test
          find out/parts -name passed ! -path '*/first/*' -exec cat {} + >out/desktop-test/passed 2>/dev/null || true
          [ "${{ needs.desktop-part.result }}" = success ] || { echo "FAIL: a part of the desktop tests failed: ${{ needs.desktop-part.result }}"; exit 1; }

      - name: Print the basics checklist
        # The rows of every feature's [[basics]] (M6.7): PASS for a case
        # that passed in any part, needs hardware, or the step that brings it.
        if: always() && (needs.changes.outputs.desktop == 'yes' || needs.changes.result != 'success')
        run: sh ci/basics-test.sh

  # Publishes the docs site to the gh-pages branch, which GitHub Pages
  # serves at https://alimardon123.github.io/edel/ (M8.10a), after every
  # merge to main whose checks passed. Off until Alimardon sets the
  # repository variable EDEL_SITE to yes (docs/RELEASE.md).
  site:
    name: Publish the docs site
    needs: [rust, images, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EDEL_SITE == 'yes'
    concurrency:
      group: site
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Keep mdBook between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ hashFiles('ci/site.sh') }}
      - run: sh ci/site.sh publish

  # Signs the release lists (M3.7) on a runner of its own, after the build:
  # only the two lists come from the build, and the signer is built here
  # from the locked sources (Cargo.lock's checksums pin every crate), with
  # nothing cached, so nothing the build made runs while the key is here.
  # Only a push gets the key, in the GitHub environment "release", which
  # Alimardon can make wait for their approval; pull requests sign with a
  # throwaway key, which proves the path.
  sign:
    name: Sign the release
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edel-lists
          path: out
      - name: Build the signer from the locked sources
        run: cargo build --release --locked -p edel --bin edel
      - name: Sign and verify both lists
        env:
          # Empty until Alimardon adds the secret (docs/RELEASE.md), and
          # always empty for pull requests.
          EDEL_RELEASE_KEY: ${{ github.event_name == 'push' && secrets.EDEL_RELEASE_KEY || '' }}
          EDEL: target/release/edel
        run: sh ci/sign.sh
      - name: Hand the signed lists to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: edel-signed
          path: |
            out/release/release.toml
            out/release/release.toml.sig
            out/channel/release.toml
            out/channel/release.toml.sig
            out/channel/signer

  # Publishes what the images job built and tested (M3.4): the preview on
  # every merge to main, a draft release for a v* tag. Off until Alimardon
  # sets the repository variable EDEL_PUBLISH to yes (docs/RELEASE.md).
  publish:
    name: Publish the release
    needs: [rust, images, desktop, sign]
    if: github.event_name == 'push' && vars.EDEL_PUBLISH == 'yes'
    # One publish per ref at a time, never cancelled halfway: two merges in
    # a row upload one after the other, and ci/release.sh keeps the newer.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: edel-release
          path: out
      # The lists as the sign job signed them, over the build's unsigned
      # ones (M3.7).
      - uses: actions/download-artifact@v4
        with:
          name: edel-signed
          path: out
      - name: Upload to the preview, or to a draft release for a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh ci/release.sh publish "${{ github.ref_type == 'tag' && github.ref_name || 'preview' }}"
