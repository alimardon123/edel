name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every push to main
# or of a tag keeps its own run, even when main and a tag point at the same
# commit, so no publish is ever cancelled halfway.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the libraries the compositor links
        # libxkbcommon for the keyboard; libudev, libinput, libgbm and
        # libseat for the GPU backend (M4.2b); GTK4 and libadwaita for
        # Settings (M5.6a). EGL is loaded at run time.
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libudev-dev libinput-dev libgbm-dev libseat-dev libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Image definitions are valid
        run: for def in images/*.toml; do cargo run --quiet --locked -- image check "$def"; done
      - name: The system file library builds without the command's dependencies
        run: cargo build --locked --lib --no-default-features
      - name: No settings file key removed within a format
        run: sh ci/keys-check.sh
      - name: Every fact is written at its owner
        # ADR-010's one owner decision (M5.27): places, colours and the
        # Alpine branch only at their owners, and the check catching one
        # of each planted elsewhere.
        run: sh ci/one-place.sh && sh ci/one-place.sh --self-test
      - name: Keep cargo-audit between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ hashFiles('ci/audit.sh') }}
      - name: No known vulnerability in the dependencies
        # cargo-audit, at the version ci/audit.sh names, checks Cargo.lock
        # against the RustSec advisories (M3.9): a vulnerability fails the
        # pull request unless ci/audit-exceptions.toml accepts it with a
        # reason; an unmaintained crate is listed in this job's summary.
        run: sh ci/audit.sh
      - name: Keep mdBook between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ hashFiles('ci/site.sh') }}
      - name: The docs site builds and its links land
        # mdBook, at the version ci/site.sh names, builds docs/ into
        # out/site (M8.10a); publishing it waits for EDEL_SITE below.
        run: sh ci/site.sh build

  images:
    name: Build and boot images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Keep the Rust build between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cargo-home
            target
          key: alpine-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: alpine-cargo-

      - name: Number this build
        # YYYY.MM.N, with N the run number, so later runs are newer (M3.1);
        # the month is the commit's, so a run re-run next month keeps its
        # version and never beats newer code. A v* tag is its own version. The channel and the tag a release
        # would go to (M3.4): a pull request checks the tag path, main
        # makes the preview, a tag makes a stable release.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "EDEL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "EDEL_CHANNEL=stable" >> "$GITHUB_ENV"
            echo "EDEL_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            version=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y.%m).$GITHUB_RUN_NUMBER
            echo "EDEL_VERSION=$version" >> "$GITHUB_ENV"
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "EDEL_CHANNEL=preview" >> "$GITHUB_ENV"
              echo "EDEL_TAG=preview" >> "$GITHUB_ENV"
            else
              echo "EDEL_CHANNEL=ci" >> "$GITHUB_ENV"
              echo "EDEL_TAG=v$version" >> "$GITHUB_ENV"
            fi
          fi

      - name: The Alpine release to build in
        # The base feature owns the Alpine branch (M5.27) and the digest
        # of its image (M3.9): the build and signing containers are that
        # image, so nothing else names either.
        run: echo "ALPINE=alpine:$(sed -n 's/^branch = "v\(.*\)"$/\1/p' features/base.toml)@$(sed -n 's/^image_digest = "\(.*\)"$/\1/p' features/base.toml)" >> "$GITHUB_ENV"

      - name: Build images inside Alpine
        run: docker run --rm --privileged -e EDEL_VERSION -e EDEL_CHANNEL -e EDEL_TAG -v "$PWD:/src" -w /src "$ALPINE" sh ci/build.sh

      - name: Every image carries the release's public keys
        # The sign job, which holds the key, never sees the images (M3.7).
        run: sh ci/keys-carried.sh

      - name: Hand the release lists to the sign job
        # Only the two lists: the signer never touches what the build made.
        uses: actions/upload-artifact@v4
        with:
          name: edel-lists
          path: |
            out/release/release.toml
            out/channel/release.toml

      - name: Test the container image
        run: sh ci/container-test.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and UEFI firmware
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf cpio zstd

      - name: Check the kernels and the initramfs of the bootable images
        run: sh ci/initramfs-check.sh

      - name: Run the VM tests, installed-disk lane and other lane at once
        # install-test then ab-test, beside boot-test, system-test and
        # flatpak-test; ci/vm-tests.sh says why they can share the runner.
        run: sh ci/vm-tests.sh

      - name: List the desktop image to try
        # The image CI just booted as a USB stick in desktop-test live
        # (M3.6). A push to main keeps it as a download; every run lists
        # it with its size.
        run: |
          mkdir -p out/try
          ln -f out/edel-desktop-x86_64.img.gz out/try/
          (cd out/try && sha256sum *.img.gz >SHA256SUMS)
          {
            echo "### Images to try"
            echo
            echo "A push to main keeps these for 14 days as the artifact \`edel-try-x86_64\` (docs/TRY-IT.md)."
            echo
            echo "| Image | Size | sha256 |"
            echo "|---|---|---|"
            for f in out/try/*.img.gz; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)...\` |"
            done
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the desktop image to try
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-try-x86_64
          retention-days: 14
          # Already gzipped: zipping them again gains nothing.
          compression-level: 0
          path: out/try/

      - name: Check the release, and show what would be published
        run: |
          sh ci/release.sh dry-run preview
          case "$EDEL_TAG" in v*) sh ci/release.sh dry-run "$EDEL_TAG" && sh ci/channel.sh dry-run "$EDEL_TAG" ;; esac

      - name: Keep the release for the publish job
        if: github.event_name == 'push' && vars.EDEL_PUBLISH == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-release
          path: |
            out/release
            out/channel

      - name: Check the budgets and report image sizes
        if: always()
        run: sh ci/sizes.sh

      - name: Report package changes against the preview
        if: always()
        run: sh ci/package-report.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the container image, the logs and the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-images
          if-no-files-found: ignore
          path: |
            out/*.tar.gz
            out/*.log
            out/*.packages
            out/desktop-live/*.png

  # The desktop tests on a runner of their own, beside the VM tests, so a
  # run takes about 3 minutes less (Alimardon asked for faster CI on
  # 2026-10-06). It builds only the programs and the desktop test image,
  # and has the runner to itself, so the frame times and memory it
  # checks against ci/budgets.toml are measured on a quiet machine.
  desktop:
    name: Desktop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Keep the Rust build between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cargo-home
            target
          key: alpine-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: alpine-cargo-

      - name: Number this build
        # Numbered as the images job numbers a pull request or main.
        run: echo "EDEL_VERSION=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y.%m).$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: The Alpine release to build in
        # The base feature owns the Alpine branch and its image's digest.
        run: echo "ALPINE=alpine:$(sed -n 's/^branch = "v\(.*\)"$/\1/p' features/base.toml)@$(sed -n 's/^image_digest = "\(.*\)"$/\1/p' features/base.toml)" >> "$GITHUB_ENV"

      - name: Build the desktop test image inside Alpine
        run: docker run --rm --privileged -e EDEL_VERSION -v "$PWD:/src" -w /src "$ALPINE" sh ci/build.sh desktop-test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and UEFI firmware
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf

      - name: Test the desktop image on a virtual GPU
        run: sh ci/desktop-test.sh floating titlebar tiling console pointer dmabuf outputs compositor panel xwayland layers animations shortcuts workspaces windows launcher quick switcher presets buttons styles scroll sandbox everyday language taskbar dock panels dockhide fullscreen keyboard settings display sound network power updates portal tray scheme completion scale respawn

      - name: Keep the log and the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edel-desktop-test
          if-no-files-found: ignore
          path: |
            out/desktop-test.log
            out/desktop-test/*.png

  # Publishes the docs site to the gh-pages branch, which GitHub Pages
  # serves at https://alimardon123.github.io/edel/ (M8.10a), after every
  # merge to main whose checks passed. Off until Alimardon sets the
  # repository variable EDEL_SITE to yes (docs/RELEASE.md).
  site:
    name: Publish the docs site
    needs: [rust, images, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EDEL_SITE == 'yes'
    concurrency:
      group: site
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Keep mdBook between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ hashFiles('ci/site.sh') }}
      - run: sh ci/site.sh publish

  # Signs the release lists (M3.7) on a runner of its own, after the build:
  # only the two lists come from the build, and the signer is built here
  # from the locked sources (Cargo.lock's checksums pin every crate), with
  # nothing cached, so nothing the build made runs while the key is here.
  # Only a push gets the key, in the GitHub environment "release", which
  # Alimardon can make wait for their approval; pull requests sign with a
  # throwaway key, which proves the path.
  sign:
    name: Sign the release
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edel-lists
          path: out
      - name: Build the signer from the locked sources
        run: cargo build --release --locked -p edel --bin edel
      - name: Sign and verify both lists
        env:
          # Empty until Alimardon adds the secret (docs/RELEASE.md), and
          # always empty for pull requests.
          EDEL_RELEASE_KEY: ${{ github.event_name == 'push' && secrets.EDEL_RELEASE_KEY || '' }}
          EDEL: target/release/edel
        run: sh ci/sign.sh
      - name: Hand the signed lists to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: edel-signed
          path: |
            out/release/release.toml
            out/release/release.toml.sig
            out/channel/release.toml
            out/channel/release.toml.sig
            out/channel/signer

  # Publishes what the images job built and tested (M3.4): the preview on
  # every merge to main, a draft release for a v* tag. Off until Alimardon
  # sets the repository variable EDEL_PUBLISH to yes (docs/RELEASE.md).
  publish:
    name: Publish the release
    needs: [rust, images, desktop, sign]
    if: github.event_name == 'push' && vars.EDEL_PUBLISH == 'yes'
    # One publish per ref at a time, never cancelled halfway: two merges in
    # a row upload one after the other, and ci/release.sh keeps the newer.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: edel-release
          path: out
      # The lists as the sign job signed them, over the build's unsigned
      # ones (M3.7).
      - uses: actions/download-artifact@v4
        with:
          name: edel-signed
          path: out
      - name: Upload to the preview, or to a draft release for a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh ci/release.sh publish "${{ github.ref_type == 'tag' && github.ref_name || 'preview' }}"
