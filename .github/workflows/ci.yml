name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Image definitions are valid
        run: for def in images/*.toml; do cargo run --quiet --locked -- image check "$def"; done
      - name: The system file library builds without the command's dependencies
        run: cargo build --locked --lib --no-default-features
      - name: No system file key removed within a format
        run: sh ci/keys-check.sh

  images:
    name: Build and boot images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep the Rust build between runs
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: alpine-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: alpine-cargo-

      - name: Build images inside Alpine 3.24
        run: docker run --rm --privileged -v "$PWD:/src" -w /src alpine:3.24 sh ci/build.sh

      - name: Test the container image
        run: sh ci/container-test.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and UEFI firmware
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf

      - name: Boot the VM image
        run: sh ci/boot-test.sh

      - name: Seed a machine from a system file and log in over ssh
        run: sh ci/system-test.sh

      - name: Install onto a blank disk, then boot it
        run: sh ci/install-test.sh

      - name: Update the VM, then fall back from a broken update
        run: sh ci/ab-test.sh

      - name: Install and run a Flatpak runtime on the musl base
        run: sh ci/flatpak-test.sh

      - name: Report image sizes
        if: always()
        run: sh ci/sizes.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the container image and boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edel-images
          if-no-files-found: ignore
          path: |
            out/*.tar.gz
            out/*.log
