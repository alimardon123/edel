# Edel OS design tokens (DESIGN-PRINCIPLES, ADR-004): the one set of
# colours and sizes the compositor, shell-ui and the GTK theme are drawn
# with. The parts have this file built in; a file at
# /usr/share/edel/design/tokens.toml, which no image ships yet, would
# take its place. [colour] is the dark scheme and [colour.light] the
# light one (M5.5c, appearance.mode); light is the release's default,
# as ADR-008 and the mockups have it (M5.12a). The colours are the
# mockups' own (docs/mockups/edel-mockups.html), which Alimardon
# reviewed; M5.12 lets people override them in the settings file.
format = 1

[colour]
# Behind every window, where there is no wallpaper.
background = "#1a1d23"
# Window title bars (M4.4), the focused one lighter, and their text,
# dimmer on the windows without the keyboard.
title_bar = "#24272e"
title_bar_focused = "#2b2e36"
title_text = "#eceef1"
title_text_unfocused = "#737a85"
# Behind a title bar button under the pointer; close turns red.
title_button_hover = "#3a3e48"
title_close_hover = "#e0443e"
# shell-ui's panel (M5.1b), a shade darker than the background, and its
# text and icons.
panel = "#1a1c22"
panel_text = "#eceef1"
# The one accent: the shown workspace's button in the panel (M5.2c), a
# little deeper in the light scheme; M5.12 lets people choose it.
accent = "#5b8ef5"
# The one shadow, cast by one light above, under menus on the Full and
# Balanced tiers (M5.5e) and windows from M5.14; its alpha is its depth.
shadow = "#00000073"
# Apps' own surfaces (M5.6a), Settings first and GTK's windows through
# gtk.css, as the mockups have them: a window's page, the cards, grouped
# rows and sidebars set on it, the hairlines round cards and between
# rows, and text on the accent.
window = "#1e2026"
card = "#191b20"
line = "#ffffff14"
accent_text = "#0b1220"
# The hairline round every window and along the panels' inner edge, as
# the mockups draw them, a little stronger than a line.
edge = "#00000099"
# The overview's backdrop where there is no wallpaper (M5.2j-b), as the
# mockup draws it (docs/mockups/shell/overview.jpg): a gradient from the
# first at the top to the second at the bottom, and the text and marks
# drawn straight on it.
backdrop = "#4b5263"
backdrop_deep = "#23272f"
backdrop_text = "#f4f6fa"

# The light scheme (M5.5c, appearance.mode = "light", the default): the
# same keys, each one given, over the dark values above.
[colour.light]
background = "#dfe3ea"
title_bar = "#f1f2f4"
title_bar_focused = "#f7f8f9"
title_text = "#1c1e22"
title_text_unfocused = "#8d929b"
title_button_hover = "#e3e5e9"
title_close_hover = "#e0443e"
panel = "#f6f7f9"
panel_text = "#1c1e22"
accent = "#2d6ae3"
shadow = "#0000003d"
window = "#ffffff"
card = "#f5f6f8"
line = "#14182017"
accent_text = "#ffffff"
edge = "#14182024"
backdrop = "#8d9aba"
backdrop_deep = "#3c4868"
backdrop_text = "#f7f8fb"

[size]
# In logical pixels.
title_bar = 28
border = 1
# The title's letters, in logical pixels per em.
title_text = 13
# Between tiled windows and round them (M4.5).
gap = 8
# shell-ui's panel along the screen's edge, and its clock's letters (M5.1b).
panel = 40
# The small and large panels a panel's menu offers (M5.31c).
panel_small = 34
panel_large = 48
panel_text = 13
# What is drawn on the panel, from the mockups (M5.29): the smaller text
# (the clock's date), a button's height, the app icon in a button and the
# shell's own icons (the menu's, the layout toggle's).
panel_text_small = 11
panel_control = 30
panel_icon = 20
panel_glyph = 18
# Corner radii (M5.5e, the mockups' second round): windows (M5.14); menus
# such as the launcher (M5.3b) and the fillets where the panel meets the
# screen (M5.1b); and controls: the panel's buttons and a menu's rows.
radius_window = 10
radius_menu = 12
radius_control = 7
# Small things inside a window: a sidebar's rows, a value's box (M5.6a).
radius_small = 5
# Apps' text (M5.6a), Settings first; headings are drawn larger from it.
text = 13
# A row in a menu or list: the launcher's apps, the window switcher's
# windows (M5.3).
row = 36
# How far the shadow blurs and how far below its surface it falls; it is
# drawn in two layers, a close sharp one and a far soft one (M5.5e).
shadow_blur = 24
shadow_offset = 6

[font]
# The interface font's family, for title bars and everything shell-ui
# draws; the compositor finds its file among the system's fonts. Inter's
# variable file, one file for every weight, calls itself Inter Variable
# (M5.30b).
interface = "Inter Variable"
