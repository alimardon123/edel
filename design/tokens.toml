# Edel OS design tokens (DESIGN-PRINCIPLES, ADR-004): the one set of
# colours and sizes the compositor, shell-ui and the GTK theme are drawn
# with. The parts have this file built in; a file at
# /usr/share/edel/design/tokens.toml, which no image ships yet, would
# take its place. [colour] is the dark scheme and [colour.light] the
# light one (M5.5c, appearance.mode); light is the release's default,
# as ADR-008 and the mockups have it (M5.12a). The colours are the
# mockups' own (docs/mockups/edel-mockups.html), which Alimardon
# reviewed; M5.12 lets people override them in the settings file.
format = 1

[colour]
# Behind every window, where there is no wallpaper.
background = "#1a1d23"
# Window title bars (M4.4), the focused one lighter, and their text,
# dimmer on the windows without the keyboard.
title_bar = "#212329"
title_bar_focused = "#2b2e36"
title_text = "#eceef1"
title_text_unfocused = "#737a85"
# Behind a title bar button under the pointer; close turns red.
title_button_hover = "#3a3e48"
title_close_hover = "#e0443e"
# shell-ui's panel (M5.1b), a shade darker than the background, and its
# text and icons.
panel = "#1a1c22"
panel_text = "#eceef1"
# The one accent: the shown workspace's button in the panel (M5.2c), a
# little deeper in the light scheme; M5.12 lets people choose it.
accent = "#5b8ef5"
# The one shadow, cast by one light above, under menus on the Full and
# Balanced tiers (M5.5e) and windows from M5.14; its alpha is its depth.
shadow = "#00000073"
# Apps' own surfaces (M5.6a), Settings first and GTK's windows through
# gtk.css, as the mockups have them: a window's page, the cards, grouped
# rows and sidebars set on it, the hairlines round cards and between
# rows, and text on the accent.
window = "#1e2026"
card = "#191b20"
line = "#ffffff14"
accent_text = "#0b1220"
# The hairline round every window and along the panels' inner edge, as
# the mockups draw them, a little stronger than a line.
edge = "#00000099"
# The windows' borders (M5.12b2, appearance.border_width): the border of
# a window without the keyboard, the focused window's, and the colour its
# border ends in when it differs from the first, a gradient from left to
# right as Hyprland's col.active_border. All as edge at the start.
window_border = "#00000099"
window_border_focused = "#00000099"
window_border_focused_end = "#00000099"
# The overview's backdrop where there is no wallpaper (M5.2j-b), as the
# mockup draws it (docs/mockups/shell/overview.jpg): a gradient from the
# first at the top to the second at the bottom, and the text and marks
# drawn straight on it.
backdrop = "#4b5263"
backdrop_deep = "#23272f"
backdrop_text = "#f4f6fa"
# The frosted glass (M5.10c, docs/mockups/shell/lock.jpg; named for every
# surface since M8.21's 21l, as the polish brings the lock screen's glass
# language to the shell): the lock's password field, the notifications'
# count and the corner's buttons are this cool white over the backdrop
# (the mockups' glass makes what lies behind it bluer), edged with the
# rim; the same in both schemes, as the backdrop is dark in both.
glass = "#b4c8ff24"
glass_rim = "#ffffff29"
# What lies behind the lock and login screens while there is no
# wallpaper (M5.10c): a deep navy from the first at the top to the second
# at the bottom, lit by two soft glows, one at the upper left and one at
# the right, as the mockup draws it; the same in both schemes.
lock_backdrop = "#2f3c5e"
lock_backdrop_deep = "#1f2b48"
lock_glow = "#56688f"
lock_glow_second = "#454079"
# The lock editor's stage behind its picture (M5.10c7f, the mockup's edit
# screen): the deep navy it is filled with and the soft glow that lights it;
# the same in both schemes, as the lock is dark in both.
lock_edit_deep = "#141a2b"
lock_edit_glow = "#2a3456"
# The panel's sign while an app uses the camera, the microphone or the
# screen (M6.14b) and the icons on it: one warm amber, unlike any other
# colour of the shell, so it is seen at a glance.
in_use = "#f5a524"
in_use_text = "#1f1503"

# foot's colours (M6.13, features/terminal): the background, text, cursor
# and selection, and the 16 colours of the terminal, as the dark scheme
# has them. The normal colours are the dark accents' shades; each of the
# 16 but black and bright_black reads at 3 to 1 on the background, and the
# text at 7 to 1 or more (a test holds them). foot's config is written from
# this table by edel::tokens (foot_ini).
[colour.terminal]
background = "#1e2026"
foreground = "#eceef1"
cursor = "#5b8ef5"
selection = "#34466b"
black = "#2a2e37"
red = "#f2707a"
green = "#5cc777"
yellow = "#f2c94c"
blue = "#5b8ef5"
magenta = "#a487f0"
cyan = "#4cc3c9"
white = "#c3c9d4"
bright_black = "#5c6370"
bright_red = "#ff8f98"
bright_green = "#7fdc96"
bright_yellow = "#ffdb75"
bright_blue = "#7ea9ff"
bright_magenta = "#bca3ff"
bright_cyan = "#7ddde2"
bright_white = "#eceef1"

# The light scheme (M5.5c, appearance.mode = "light", the default): the
# same keys, each one given, over the dark values above.
[colour.light]
background = "#dfe3ea"
title_bar = "#eceef1"
title_bar_focused = "#f7f8f9"
title_text = "#1c1e22"
title_text_unfocused = "#8d929b"
title_button_hover = "#e3e5e9"
title_close_hover = "#e0443e"
panel = "#f6f7f9"
panel_text = "#1c1e22"
accent = "#2d6ae3"
shadow = "#0000003d"
window = "#ffffff"
card = "#f5f6f8"
line = "#14182017"
accent_text = "#ffffff"
edge = "#14182024"
# The windows' borders in the light scheme (M5.12b2), as edge.
window_border = "#14182024"
window_border_focused = "#14182024"
window_border_focused_end = "#14182024"
backdrop = "#8d9aba"
backdrop_deep = "#3c4868"
backdrop_text = "#f7f8fb"
glass = "#b4c8ff24"
glass_rim = "#ffffff29"
lock_backdrop = "#2f3c5e"
lock_backdrop_deep = "#1f2b48"
lock_glow = "#56688f"
lock_glow_second = "#454079"
# The lock editor's stage behind its picture (M5.10c7f, the mockup's edit
# screen): the deep navy it is filled with and the soft glow that lights it;
# the same in both schemes, as the lock is dark in both.
lock_edit_deep = "#141a2b"
lock_edit_glow = "#2a3456"
# The in-use sign (M6.14b), a little deeper on the light panel.
in_use = "#e8900c"
in_use_text = "#1f1503"

# The high-contrast look (M6.9, appearance.contrast = "high"): the colours
# laid over the dark scheme when a person turns high contrast on, and over
# the light scheme by [colour.light.contrast] below. Every pair in tokens.rs's
# PAIRS reads at 7 to 1 or more (WCAG AAA) in both schemes, and the edges and
# lines are black or white. The accent is named too, as its pairs need it;
# the focused window's edge takes it, so the focus still reads at a glance.
# Only colour names above are named here (a test holds them), and tokens.rs
# lays these over a person's own colours, so high contrast always wins.
[colour.contrast]
title_bar = "#000000"
title_bar_focused = "#262626"
title_text = "#ffffff"
title_text_unfocused = "#bfbfbf"
title_button_hover = "#404040"
panel = "#000000"
panel_text = "#ffffff"
accent = "#ffff00"
accent_text = "#000000"
window = "#000000"
card = "#141414"
line = "#ffffff"
edge = "#ffffff"
window_border = "#ffffff"
window_border_focused = "#ffff00"
window_border_focused_end = "#ffff00"

# The light scheme's high contrast, as [colour.contrast] is the dark one's.
[colour.light.contrast]
title_bar = "#e6e6e6"
title_bar_focused = "#ffffff"
title_text = "#000000"
title_text_unfocused = "#404040"
title_button_hover = "#cccccc"
panel = "#ffffff"
panel_text = "#000000"
accent = "#0000ff"
accent_text = "#ffffff"
window = "#ffffff"
card = "#f2f2f2"
line = "#000000"
edge = "#000000"
window_border = "#000000"
window_border_focused = "#0000ff"
window_border_focused_end = "#0000ff"

# foot's colours in the light scheme (M6.13), as [colour.terminal] is in
# the dark one: each of the 16 but white and bright_white reads at 3 to 1
# on the background, and the text at 7 to 1 or more.
[colour.light.terminal]
background = "#fafbfc"
foreground = "#1c1e22"
cursor = "#2d6ae3"
selection = "#bfd2f7"
black = "#2b2f36"
red = "#c42b33"
green = "#267f39"
yellow = "#8f6a00"
blue = "#2d6ae3"
magenta = "#7a4fd6"
cyan = "#0f7f86"
white = "#aeb4bd"
bright_black = "#5a6270"
bright_red = "#d0363f"
bright_green = "#2f9a46"
bright_yellow = "#a67c00"
bright_blue = "#3f7bf0"
bright_magenta = "#9150e0"
bright_cyan = "#12969e"
bright_white = "#7d838e"

# The accents a person picks from (M5.12b1, appearance.accent): each name
# has the light scheme's shade and the dark scheme's. `blue` is the
# release's accent, the `accent` of [colour] and [colour.light] above (a
# test holds them together). The text on each is chosen by contrast, so
# each reads at 4.5 to 1 and each mark at 3 to 1 on the panel and windows.
[accent.blue]
light = "#2d6ae3"
dark = "#5b8ef5"

[accent.purple]
light = "#7a4fd6"
dark = "#a487f0"

[accent.pink]
light = "#c43c86"
dark = "#f07ab8"

[accent.red]
light = "#d0363f"
dark = "#f2707a"

[accent.orange]
light = "#b8520f"
dark = "#f59a4b"

[accent.yellow]
light = "#8f6a00"
dark = "#f2c94c"

[accent.green]
light = "#267f39"
dark = "#5cc777"

[accent.teal]
light = "#0f7f86"
dark = "#4cc3c9"

[accent.graphite]
light = "#5a6270"
dark = "#a3abb8"

[size]
# In logical pixels.
title_bar = 28
border = 1
# The title's letters, in logical pixels per em.
title_text = 13
# Between tiled windows and round them (M4.5).
gap = 8
# Between tiled windows and the screen's edge, when it differs from gap
# (M5.12b2, appearance.gaps_outer); the same as gap at the start.
gap_outer = 8
# shell-ui's panel along the screen's edge, and its clock's letters (M5.1b).
panel = 40
# The small and large panels a panel's menu offers (M5.31c).
panel_small = 34
panel_large = 48
panel_text = 13
# What is drawn on the panel, from the mockups (M5.29): the smaller text
# (the clock's date), a button's height, the app icon in a button and the
# shell's own icons (the menu's, the layout toggle's).
panel_text_small = 11
panel_control = 30
panel_icon = 20
panel_glyph = 18
# The app icons the apps widget draws in a bar and in a dock, logical pixels
# (M5.12b5 part A); appearance.icon_size scales them with panel_icon.
app_icon = 24
dock_icon = 40
# Corner radii (M5.5e, the mockups' second round): windows (M5.14); menus
# such as the launcher (M5.3b) and the fillets where the panel meets the
# screen (M5.1b); and controls: the panel's buttons and a menu's rows.
radius_window = 10
radius_menu = 12
radius_control = 7
# Small things inside a window: a sidebar's rows, a value's box (M5.6a).
radius_small = 5
# Tiles and pictures in the editors and the lock's looks.
radius_tile = 14
# Cards: the corner menu, the editors' stage and marks.
radius_card = 16
# The dock and the editors' previews and side panes.
radius_dock = 18
# A notification's card.
radius_notice = 20
# A banner.
radius_banner = 22
# The editors' sheet.
radius_sheet = 24
# The notification centre.
radius_centre = 30
# Quick settings' round buttons.
radius_quick = 50
# Apps' text (M5.6a), Settings first; headings are drawn larger from it.
text = 13
# A row in a menu or list: the launcher's apps, the window switcher's
# windows (M5.3).
row = 36
# How far the shadow blurs and how far below its surface it falls; it is
# drawn in two layers, a close sharp one and a far soft one (M5.5e).
shadow_blur = 24
shadow_offset = 6
# The lock and login screens' clock, large and light (M5.10c); a Compact
# screen draws it smaller to fit.
lock_clock = 150
# The panels' opacity in percent (M5.12b2, appearance.panel_opacity),
# for the bars and docks alone, not the cards that share their colour.
panel_opacity = 100
# The windows' opacity in percent (M5.12b3, appearance.window_opacity and
# appearance.window_opacity_unfocused): the focused window with its title
# bar and border, and every other window; 100 is opaque.
window_opacity = 100
window_opacity_unfocused = 100
# How strongly the wallpaper blurs behind see-through panels, in percent
# (M5.12b3, appearance.blur): frosted glass, made once from the wallpaper
# at a quarter of the screen's size; 0 shows the wallpaper sharp.
blur = 50
# How much of the accent the focused window's title bar takes, in percent,
# so the window with the keyboard reads at a glance; 0 keeps it neutral.
# A person's own title_bar_focused colour replaces the tint.
title_tint = 6

[font]
# The interface font's family, for title bars and everything shell-ui
# draws; the compositor finds its file among the system's fonts. Inter's
# variable file, one file for every weight, calls itself Inter Variable
# (M5.30b).
interface = "Inter Variable"
# The lock and login screens' clock's weight, 100 (thin) to 900 (black):
# thin and light, as the mockups draw it (M5.10c).
lock_clock_weight = 250
